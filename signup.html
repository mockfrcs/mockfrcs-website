<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<title>MockFRCS — Create Account</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="brand.css">
<style>
  .auth-card label.agree{display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px;font-family:var(--f-sans);font-size:13px;font-weight:400;line-height:1.5;letter-spacing:0;text-transform:none;color:var(--t-dim);cursor:pointer}
  .auth-card label.agree input{margin:3px 0 0;padding:0;width:16px;height:16px;accent-color:#17B98C;flex:none}
  .auth-card label.agree a{color:var(--green-br);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<div class="auth-top">
  <div class="in">
    <a href="index.html" class="logo gro"><svg class="mk" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#2BD6A4" stroke-width="1.6"/><path d="M12 6v6l4 2" stroke="#2BD6A4" stroke-width="1.6" stroke-linecap="round"/></svg><span class="wm">Mock<em>FRCS</em></span></a>
    <a href="login.html" class="lk">Already registered? Log in →</a>
  </div>
</div>

<main class="auth-main">
  <div class="auth-card">
    <div class="ah">
      <h1 class="gro">Create your account</h1>
      <p class="sub">Full timed FRCS Part 1 mock exams from £29.99</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 8 characters" />
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat your password" />
    </div>
    <label class="agree"><input type="checkbox" id="agree"><span>I agree to the <a href="terms.html" target="_blank">Terms &amp; Conditions</a> and have read the <a href="privacy.html" target="_blank">Privacy Notice</a>.</span></label>
    <button class="btn-submit" id="signupBtn" onclick="handleSignup()">Create account</button>
    <div class="divider"><div class="divider-line"></div><div class="divider-text">already have an account?</div><div class="divider-line"></div></div>
    <div class="footer-link"><a href="login.html">Log in to your account</a></div>
  </div>
</main>

<div class="auth-foot">© 2026 MOCKFRCS.CO.UK · FOR EDUCATIONAL PURPOSES ONLY · <a href="terms.html" style="color:inherit;text-decoration:underline">TERMS</a> · <a href="privacy.html" style="color:inherit;text-decoration:underline">PRIVACY</a></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
(async () => { const user = await getUser(); if (user) window.location.href = 'dashboard.html'; })();

async function handleSignup() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('signupBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  errorMsg.classList.remove('show'); successMsg.classList.remove('show');
  if (!email || !password || !confirmPassword) { errorMsg.textContent = 'Please fill in all fields.'; errorMsg.classList.add('show'); return; }
  if (password.length < 8) { errorMsg.textContent = 'Password must be at least 8 characters.'; errorMsg.classList.add('show'); return; }
  if (password !== confirmPassword) { errorMsg.textContent = 'Passwords do not match.'; errorMsg.classList.add('show'); return; }
  if (!document.getElementById('agree').checked) { errorMsg.textContent = 'Please agree to the Terms & Conditions to continue.'; errorMsg.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Creating account...';
  const { data, error } = await db.auth.signUp({ email, password });
  if (error) { errorMsg.textContent = error.message; errorMsg.classList.add('show'); btn.disabled = false; btn.textContent = 'Create account'; return; }
  window.location.href = 'pricing.html';
}
document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSignup(); });
</script>
</body>
</html>
