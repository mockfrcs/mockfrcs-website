<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<title>MockFRCS — Log In</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="brand.css">
</head>
<body>

<div class="auth-top">
  <div class="in">
    <a href="index.html" class="logo gro"><svg class="mk" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#2BD6A4" stroke-width="1.6"/><path d="M12 6v6l4 2" stroke="#2BD6A4" stroke-width="1.6" stroke-linecap="round"/></svg><span class="wm">Mock<em>FRCS</em></span></a>
    <a href="signup.html" class="lk">No account? Sign up →</a>
  </div>
</div>

<main class="auth-main">
  <div class="auth-card">
    <div class="ah">
      <h1 class="gro">Log in</h1>
      <p class="sub">Welcome back to MockFRCS</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>
    <div class="form-group">
      <label for="password">Password <a href="reset.html" class="forgot-link">Forgot password?</a></label>
      <input type="password" id="password" placeholder="Your password" />
    </div>
    <button class="btn-submit" id="loginBtn" onclick="handleLogin()">Log in</button>
    <div class="divider"><div class="divider-line"></div><div class="divider-text">don't have an account?</div><div class="divider-line"></div></div>
    <div class="footer-link"><a href="signup.html">Create an account</a></div>
  </div>
</main>

<div class="auth-foot">© 2026 MOCKFRCS.CO.UK · FOR EDUCATIONAL PURPOSES ONLY</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
(async () => { const user = await getUser(); if (user) window.location.href = 'dashboard.html'; })();

async function handleLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.classList.remove('show');
  if (!email || !password) { errorMsg.textContent = 'Please enter your email and password.'; errorMsg.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Logging in...';
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) { errorMsg.textContent = 'Incorrect email or password. Please try again.'; errorMsg.classList.add('show'); btn.disabled = false; btn.textContent = 'Log in'; return; }
  window.location.href = 'dashboard.html';
}
document.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
