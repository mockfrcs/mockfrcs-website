<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<title>MockFRCS — Practice</title>
<meta name="description" content="Topic practice for the FRCS Part 1 General Surgery exam, with an explanation and source for every answer.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f5;color:#1a1a18;min-height:100vh;display:flex;flex-direction:column;}
.nav{border-bottom:0.5px solid rgba(0,0,0,0.08);background:#fff;}
.nav-inner{max-width:1000px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.logo{font-size:18px;font-weight:600;color:#1a1a18;text-decoration:none;}
.logo span{color:#185FA5;}
.crumb{font-size:13px;color:#185FA5;text-decoration:none;}
.crumb:hover{text-decoration:underline;}

main{flex:1;max-width:760px;margin:0 auto;padding:26px 24px 80px;width:100%;}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.topic-name{font-size:19px;font-weight:600;letter-spacing:-0.3px;}
.tally{font-size:12.5px;color:#777;}
.progress{height:6px;background:rgba(0,0,0,0.07);border-radius:4px;overflow:hidden;margin-bottom:22px;}
.progress span{display:block;height:100%;background:#185FA5;width:0;transition:width .2s;}

.card{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:14px;padding:24px;box-shadow:0 1px 8px rgba(0,0,0,0.04);}
.q-label{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:#999;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:12px;}
.q-label b{color:#185FA5;font-weight:700;}
.q-sub{text-transform:none;letter-spacing:0;font-size:12px;color:#999;text-align:right;}
.stem{font-size:15px;line-height:1.65;margin-bottom:12px;}
.ask{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:16px;}

.opts{list-style:none;display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid rgba(0,0,0,0.12);border-radius:10px;padding:12px 14px;font:inherit;font-size:14.5px;line-height:1.5;cursor:pointer;transition:border-color .12s,background .12s;}
.opt:hover:not(:disabled){border-color:#185FA5;}
.opt:disabled{cursor:default;color:#1a1a18;-webkit-text-fill-color:#1a1a18;opacity:1;}
.opt .letter{flex:none;width:23px;height:23px;border-radius:50%;border:1px solid rgba(0,0,0,0.18);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.opt.correct{border-color:#3B6D11;background:#F2F8EA;}
.opt.correct .letter{background:#3B6D11;border-color:#3B6D11;color:#fff;}
.opt.wrong{border-color:#A32D2D;background:#FCF2F2;}
.opt.wrong .letter{background:#A32D2D;border-color:#A32D2D;color:#fff;}

.feedback{margin-top:18px;border-top:0.5px solid rgba(0,0,0,0.1);padding-top:16px;display:none;}
.feedback.show{display:block;}
.verdict{font-size:14px;font-weight:700;margin-bottom:10px;}
.verdict.right{color:#3B6D11;}
.verdict.wrong{color:#A32D2D;}
.explain{font-size:14px;line-height:1.7;color:#333;}
.source{font-size:12.5px;color:#888;margin-top:12px;line-height:1.55;}

.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;}
.btn{font:inherit;font-size:14px;font-weight:500;border-radius:9px;padding:10px 20px;cursor:pointer;border:0.5px solid rgba(0,0,0,0.15);background:#fff;color:#444;}
.btn:hover{border-color:rgba(0,0,0,0.3);}
.btn.primary{background:#185FA5;border-color:#185FA5;color:#fff;}
.btn.primary:hover{background:#0C447C;}
.btn:disabled{opacity:.45;cursor:default;}

.done{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:14px;padding:34px;text-align:center;box-shadow:0 1px 8px rgba(0,0,0,0.04);}
.done h2{font-size:22px;margin-bottom:10px;}
.done .score{font-size:40px;font-weight:600;color:#185FA5;letter-spacing:-1px;margin:6px 0 4px;}
.done p{font-size:14px;color:#666;line-height:1.6;margin-bottom:18px;}
.done .btn{margin:0 5px;}
.loading{background:#fff;border:0.5px solid rgba(0,0,0,0.1);border-radius:14px;padding:34px;text-align:center;color:#666;font-size:14px;}
.hint{font-size:12px;color:#aaa;text-align:center;margin-top:16px;}
footer{padding:20px 24px;text-align:center;font-size:12px;color:#bbb;border-top:0.5px solid rgba(0,0,0,0.08);background:#fff;margin-top:auto;}
@media (max-width:640px){main{padding:18px 16px 60px;}.card{padding:18px;}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="dashboard.html" class="logo">Mock<span>FRCS</span></a>
    <a href="practice.html" class="crumb">&larr; All topics</a>
  </div>
</nav>

<main>
  <div id="loading" class="loading">Loading questions…</div>

  <div id="runner" style="display:none">
    <div class="topbar">
      <div class="topic-name" id="topicName"></div>
      <div class="tally" id="tally"></div>
    </div>
    <div class="progress"><span id="progressBar"></span></div>

    <article class="card">
      <div class="q-label">
        <span>Question <b id="qNum">1</b> of <span id="qTotal">50</span></span>
        <span class="q-sub" id="qSub"></span>
      </div>
      <p class="stem" id="stem"></p>
      <p class="ask" id="ask"></p>
      <div class="opts" id="opts"></div>

      <div class="feedback" id="feedback">
        <div class="verdict" id="verdict"></div>
        <p class="explain" id="explain"></p>
        <p class="source" id="source"></p>
      </div>

      <div class="controls">
        <button class="btn" id="prevBtn" onclick="go(-1)">&larr; Previous</button>
        <button class="btn primary" id="nextBtn" onclick="go(1)">Next &rarr;</button>
      </div>
    </article>
    <p class="hint">Press 1&ndash;5 to answer, and Enter for the next question.</p>
  </div>

  <div id="done" class="done" style="display:none">
    <h2>Topic complete</h2>
    <div class="score" id="finalScore">0%</div>
    <p id="finalText"></p>
    <button class="btn primary" onclick="location.href='practice.html'">Back to topics</button>
    <button class="btn" onclick="restartTopic()">Reset this topic</button>
  </div>
</main>

<footer>&copy; MockFRCS &middot; hello@mockfrcs.co.uk</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
const LETTERS = ['A','B','C','D','E'];
let questions = [], answers = {}, index = 0, user = null, slug = '';

function params(){ return new URLSearchParams(window.location.search); }

(async function(){
  user = await requireMembership();
  if (!user) return;

  slug = params().get('topic') || '';
  if (!slug) { location.href = 'practice.html'; return; }

  const { data: qs, error } = await db
    .from('practice_questions')
    .select('*')
    .eq('topic_slug', slug)
    .order('question_number');

  if (error || !qs || qs.length === 0) {
    document.getElementById('loading').textContent =
      'No questions found for this topic. Please contact hello@mockfrcs.co.uk';
    return;
  }
  questions = qs;

  const { data: prior } = await db
    .from('practice_latest_attempts')
    .select('question_id, selected_answer, is_correct')
    .eq('user_id', user.id)
    .eq('topic_slug', slug);

  (prior || []).forEach(a => { answers[a.question_id] = a.selected_answer; });

  // Resume at the first unanswered question.
  const firstUnanswered = questions.findIndex(q => answers[q.id] === undefined);
  index = firstUnanswered === -1 ? 0 : firstUnanswered;

  document.getElementById('topicName').textContent = questions[0].topic;
  document.getElementById('qTotal').textContent = questions.length;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('runner').style.display = 'block';
  render();
})();

function render(){
  const q = questions[index];
  document.getElementById('qNum').textContent = index + 1;
  document.getElementById('qSub').textContent = q.subtopic || '';
  document.getElementById('stem').textContent = q.stem;
  document.getElementById('ask').textContent = q.question;

  const opts = [q.option_a, q.option_b, q.option_c, q.option_d, q.option_e];
  const chosen = answers[q.id];
  const box = document.getElementById('opts');
  box.innerHTML = '';
  opts.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span></span>';
    b.querySelector('span:last-child').textContent = text;
    if (chosen !== undefined) {
      b.disabled = true;
      if (i === q.correct_answer) b.classList.add('correct');
      else if (i === chosen) b.classList.add('wrong');
    } else {
      b.onclick = () => answer(i);
    }
    box.appendChild(b);
  });

  const fb = document.getElementById('feedback');
  if (chosen === undefined) {
    fb.classList.remove('show');
  } else {
    const right = chosen === q.correct_answer;
    document.getElementById('verdict').textContent =
      right ? 'Correct' : 'Incorrect — the answer is ' + LETTERS[q.correct_answer];
    document.getElementById('verdict').className = 'verdict ' + (right ? 'right' : 'wrong');
    document.getElementById('explain').textContent = q.explanation;
    document.getElementById('source').textContent = q.source ? 'Source: ' + q.source : '';
    fb.classList.add('show');
  }

  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').textContent =
    index === questions.length - 1 ? 'Finish' : 'Next →';
  updateTally();
}

function updateTally(){
  const answered = questions.filter(q => answers[q.id] !== undefined);
  const correct = answered.filter(q => answers[q.id] === q.correct_answer).length;
  document.getElementById('tally').textContent =
    answered.length + ' answered' + (answered.length ? ' · ' + correct + ' correct' : '');
  document.getElementById('progressBar').style.width =
    Math.round((answered.length / questions.length) * 100) + '%';
}

async function answer(i){
  const q = questions[index];
  if (answers[q.id] !== undefined) return;
  answers[q.id] = i;
  render();
  try {
    await db.from('practice_attempts').insert({
      user_id: user.id,
      question_id: q.id,
      topic_slug: q.topic_slug,
      selected_answer: i,
      is_correct: i === q.correct_answer
    });
  } catch (e) {
    // Progress saving is best effort; the answer is still shown.
    console.warn('Could not save attempt', e);
  }
}

function go(step){
  if (step === 1 && index === questions.length - 1) return finish();
  index = Math.max(0, Math.min(questions.length - 1, index + step));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function finish(){
  const answered = questions.filter(q => answers[q.id] !== undefined);
  const correct = answered.filter(q => answers[q.id] === q.correct_answer).length;
  const pct = answered.length ? Math.round((correct / answered.length) * 100) : 0;
  document.getElementById('runner').style.display = 'none';
  document.getElementById('finalScore').textContent = pct + '%';
  document.getElementById('finalText').textContent =
    correct + ' correct out of ' + answered.length + ' answered' +
    (answered.length < questions.length
      ? ', with ' + (questions.length - answered.length) + ' left to do.'
      : '.');
  document.getElementById('done').style.display = 'block';
  window.scrollTo({ top: 0 });
}

async function restartTopic(){
  if (!confirm('Clear your answers for this topic and start again?')) return;
  await db.from('practice_attempts').delete().eq('user_id', user.id).eq('topic_slug', slug);
  answers = {}; index = 0;
  document.getElementById('done').style.display = 'none';
  document.getElementById('runner').style.display = 'block';
  render();
}

document.addEventListener('keydown', e => {
  if (document.getElementById('runner').style.display === 'none') return;
  if (e.key >= '1' && e.key <= '5') {
    const i = parseInt(e.key, 10) - 1;
    const q = questions[index];
    if (q && answers[q.id] === undefined) answer(i);
  } else if (e.key === 'Enter' || e.key === 'ArrowRight') {
    go(1);
  } else if (e.key === 'ArrowLeft') {
    go(-1);
  }
});
</script>
</body>
</html>
