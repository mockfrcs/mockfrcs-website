<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<title>MockFRCS — Practice Question Bank</title>
<meta name="description" content="Topic practice for the FRCS Part 1 General Surgery exam, with an explanation and source for every answer.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="brand.css">
<style>
  .topbar-nav{position:sticky;top:0;z-index:50;background:rgba(6,17,13,.9);backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line-d2)}
  .topbar-nav .in{max-width:760px;margin:0 auto;padding:14px var(--gut);display:flex;align-items:center;justify-content:space-between;gap:14px}
  .topbar-nav .logo{font-size:18px}
  .crumb{font-family:var(--f-mono);font-size:12.5px;color:var(--green-br)}
  main{max-width:760px;margin:0 auto;padding:28px var(--gut) 80px;width:100%}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
  .topic-name{font-family:var(--f-gro);font-size:20px;font-weight:600;letter-spacing:-.02em}
  .tally{font-family:var(--f-mono);font-size:12px;color:var(--t-dim)}
  .progress{height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:22px}
  .progress span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--mint));width:0;transition:width .2s}
  .card{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line-d);border-radius:14px;padding:26px}
  .q-label{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:11px;color:var(--t-faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px}
  .q-label b{color:var(--green-br);font-weight:700}
  .q-sub{text-transform:none;letter-spacing:0;font-size:11.5px;color:var(--t-faint);text-align:right}
  .card .stem{font-size:15px;line-height:1.65;margin-bottom:12px;color:var(--t-hi)}
  .card .ask{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:16px;color:var(--t-hi)}
  .opts{list-style:none;display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line-d2);border-radius:10px;padding:12px 14px;font-family:var(--f-sans);font-size:14px;line-height:1.5;cursor:pointer;color:var(--t-hi);transition:border-color .12s,background .12s}
  .opt:hover:not(:disabled){border-color:var(--green)}
  .opt:disabled{cursor:default;opacity:1;color:var(--t-hi);-webkit-text-fill-color:var(--t-hi)}
  .opt .letter{flex:none;width:23px;height:23px;border-radius:50%;border:1px solid var(--line-d);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;font-weight:600}
  .opt.correct{border-color:var(--green);background:rgba(23,185,140,.12);color:var(--t-hi);-webkit-text-fill-color:var(--t-hi)}
  .opt.correct .letter{background:var(--green);border-color:var(--green);color:#04130D}
  .opt.wrong{border-color:var(--red);background:rgba(208,73,62,.12);color:#f3c9c5;-webkit-text-fill-color:#f3c9c5}
  .opt.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
  .feedback{margin-top:18px;border-top:1px solid var(--line-d2);padding-top:16px;display:none}
  .feedback.show{display:block}
  .verdict{font-family:var(--f-mono);font-size:13px;font-weight:700;margin-bottom:10px}
  .verdict.right{color:var(--green-br)}
  .verdict.wrong{color:#e8928a}
  .card .explain{font-size:14px;line-height:1.7;color:var(--t-hi)}
  .card .source{font-family:var(--f-mono);font-size:11.5px;color:var(--t-dim);margin-top:12px;line-height:1.55}
  .controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
  .btn-ps{font-family:var(--f-mono);font-size:14px;font-weight:500;border-radius:8px;padding:10px 20px;cursor:pointer;border:1px solid var(--line-d);background:transparent;color:var(--t-hi)}
  .btn-ps:hover{border-color:var(--green);color:var(--green-br)}
  .btn-ps.primary{background:var(--green);border-color:var(--green);color:#04130D}
  .btn-ps.primary:hover{background:var(--green-br)}
  .btn-ps:disabled{opacity:.4;cursor:default}
  .done{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line-d);border-radius:14px;padding:40px;text-align:center}
  .done h2{font-family:var(--f-gro);font-size:22px;margin-bottom:10px}
  .done .score{font-family:var(--f-gro);font-size:44px;font-weight:600;color:var(--green-br);letter-spacing:-.03em;margin:6px 0 4px}
  .done p{font-size:14px;color:var(--t-dim);line-height:1.6;margin-bottom:18px}
  .done .btn-ps{margin:0 5px}
  .loading{background:var(--surface);border:1px solid var(--line-d);border-radius:14px;padding:40px;text-align:center;color:var(--t-dim);font-family:var(--f-mono);font-size:14px}
  .hint{font-family:var(--f-mono);font-size:11.5px;color:var(--t-faint);text-align:center;margin-top:16px}
  @media(max-width:640px){main{padding:18px 16px 60px}.card{padding:18px}}
</style>
</head>
<body>

<nav class="topbar-nav">
  <div class="in">
    <a href="dashboard.html" class="logo gro"><svg class="mk" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#2BD6A4" stroke-width="1.6"/><path d="M12 6v6l4 2" stroke="#2BD6A4" stroke-width="1.6" stroke-linecap="round"/></svg><span class="wm">Mock<em>FRCS</em></span></a>
    <a href="practice.html" class="crumb">← All topics</a>
  </div>
</nav>

<main>
  <div id="loading" class="loading">Loading questions…</div>

  <div id="runner" style="display:none">
    <div class="topbar">
      <div class="topic-name gro" id="topicName"></div>
      <div class="tally" id="tally"></div>
    </div>
    <div class="progress"><span id="progressBar"></span></div>

    <article class="card">
      <div class="q-label">
        <span>Question <b id="qNum">1</b> of <span id="qTotal">50</span></span>
        <span class="q-sub" id="qSub"></span>
      </div>
      <p class="stem" id="stem"></p>
      <p class="ask" id="ask"></p>
      <div class="opts" id="opts"></div>

      <div class="feedback" id="feedback">
        <div class="verdict" id="verdict"></div>
        <p class="explain" id="explain"></p>
        <p class="source" id="source"></p>
      </div>

      <div class="controls">
        <button class="btn-ps" id="prevBtn" onclick="go(-1)">← Previous</button>
        <button class="btn-ps primary" id="nextBtn" onclick="go(1)">Next →</button>
      </div>
    </article>
    <p class="hint">Press 1–5 to answer, and Enter for the next question.</p>
  </div>

  <div id="done" class="done" style="display:none">
    <h2 class="gro">Topic complete</h2>
    <div class="score gro" id="finalScore">0%</div>
    <p id="finalText"></p>
    <button class="btn-ps primary" onclick="location.href='practice.html'">Back to topics</button>
    <button class="btn-ps" onclick="restartTopic()">Reset this topic</button>
  </div>
</main>

<div class="auth-foot">© 2026 MOCKFRCS.CO.UK · HELLO@MOCKFRCS.CO.UK · <a href="terms.html" style="color:inherit;text-decoration:underline">TERMS</a> · <a href="privacy.html" style="color:inherit;text-decoration:underline">PRIVACY</a></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
const LETTERS = ['A','B','C','D','E'];
let questions = [], answers = {}, index = 0, user = null, slug = '';
function params(){ return new URLSearchParams(window.location.search); }

(async function(){
  user = await requireMembership();
  if (!user) return;
  slug = params().get('topic') || '';
  if (!slug) { location.href = 'practice.html'; return; }
  const { data: qs, error } = await db.from('practice_questions').select('*').eq('topic_slug', slug).order('question_number');
  if (error || !qs || qs.length === 0) { document.getElementById('loading').textContent = 'No questions found for this topic. Please contact hello@mockfrcs.co.uk'; return; }
  questions = qs;
  const { data: prior } = await db.from('practice_latest_attempts').select('question_id, selected_answer, is_correct').eq('user_id', user.id).eq('topic_slug', slug);
  (prior || []).forEach(a => { answers[a.question_id] = a.selected_answer; });
  const firstUnanswered = questions.findIndex(q => answers[q.id] === undefined);
  index = firstUnanswered === -1 ? 0 : firstUnanswered;
  document.getElementById('topicName').textContent = questions[0].topic;
  document.getElementById('qTotal').textContent = questions.length;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('runner').style.display = 'block';
  render();
})();

function render(){
  const q = questions[index];
  document.getElementById('qNum').textContent = index + 1;
  document.getElementById('qSub').textContent = q.subtopic || '';
  document.getElementById('stem').textContent = q.stem;
  document.getElementById('ask').textContent = q.question;
  const opts = [q.option_a, q.option_b, q.option_c, q.option_d, q.option_e];
  const chosen = answers[q.id];
  const box = document.getElementById('opts');
  box.innerHTML = '';
  opts.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button';
    b.innerHTML = '<span class="letter">' + LETTERS[i] + '</span><span></span>';
    b.querySelector('span:last-child').textContent = text;
    if (chosen !== undefined) {
      b.disabled = true;
      if (i === q.correct_answer) b.classList.add('correct');
      else if (i === chosen) b.classList.add('wrong');
    } else { b.onclick = () => answer(i); }
    box.appendChild(b);
  });
  const fb = document.getElementById('feedback');
  if (chosen === undefined) { fb.classList.remove('show'); }
  else {
    const right = chosen === q.correct_answer;
    document.getElementById('verdict').textContent = right ? 'Correct' : 'Incorrect — the answer is ' + LETTERS[q.correct_answer];
    document.getElementById('verdict').className = 'verdict ' + (right ? 'right' : 'wrong');
    document.getElementById('explain').textContent = q.explanation;
    document.getElementById('source').textContent = q.source ? 'Source: ' + q.source : '';
    fb.classList.add('show');
  }
  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').textContent = index === questions.length - 1 ? 'Finish' : 'Next →';
  updateTally();
}

function updateTally(){
  const answered = questions.filter(q => answers[q.id] !== undefined);
  const correct = answered.filter(q => answers[q.id] === q.correct_answer).length;
  document.getElementById('tally').textContent = answered.length + ' answered' + (answered.length ? ' · ' + correct + ' correct' : '');
  document.getElementById('progressBar').style.width = Math.round((answered.length / questions.length) * 100) + '%';
}

async function answer(i){
  const q = questions[index];
  if (answers[q.id] !== undefined) return;
  answers[q.id] = i;
  render();
  try { await db.from('practice_attempts').insert({ user_id: user.id, question_id: q.id, topic_slug: q.topic_slug, selected_answer: i, is_correct: i === q.correct_answer }); }
  catch (e) { console.warn('Could not save attempt', e); }
}

function go(step){
  if (step === 1 && index === questions.length - 1) return finish();
  index = Math.max(0, Math.min(questions.length - 1, index + step));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function finish(){
  const answered = questions.filter(q => answers[q.id] !== undefined);
  const correct = answered.filter(q => answers[q.id] === q.correct_answer).length;
  const pct = answered.length ? Math.round((correct / answered.length) * 100) : 0;
  document.getElementById('runner').style.display = 'none';
  document.getElementById('finalScore').textContent = pct + '%';
  document.getElementById('finalText').textContent = correct + ' correct out of ' + answered.length + ' answered' + (answered.length < questions.length ? ', with ' + (questions.length - answered.length) + ' left to do.' : '.');
  document.getElementById('done').style.display = 'block';
  window.scrollTo({ top: 0 });
}

async function restartTopic(){
  if (!confirm('Clear your answers for this topic and start again?')) return;
  await db.from('practice_attempts').delete().eq('user_id', user.id).eq('topic_slug', slug);
  answers = {}; index = 0;
  document.getElementById('done').style.display = 'none';
  document.getElementById('runner').style.display = 'block';
  render();
}

document.addEventListener('keydown', e => {
  if (document.getElementById('runner').style.display === 'none') return;
  if (e.key >= '1' && e.key <= '5') { const i = parseInt(e.key, 10) - 1; const q = questions[index]; if (q && answers[q.id] === undefined) answer(i); }
  else if (e.key === 'Enter' || e.key === 'ArrowRight') { go(1); }
  else if (e.key === 'ArrowLeft') { go(-1); }
});
</script>
</body>
</html>
