<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<title>MockFRCS — Practice Question Bank</title>
<meta name="description" content="Topic-by-topic practice questions for the FRCS Part 1 General Surgery exam, with a full explanation and source for every answer.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="brand.css">
<style>
  .app-nav{position:sticky;top:0;z-index:100;background:rgba(6,17,13,.9);backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line-d2)}
  .app-nav .in{max-width:1000px;margin:0 auto;padding:14px var(--gut);display:flex;align-items:center;justify-content:space-between;gap:16px}
  .app-left{display:flex;align-items:center;gap:30px}
  .app-nav .logo{font-size:18px}
  .app-links{display:flex;gap:22px}
  .app-links a{font-family:var(--f-mono);font-size:12px;letter-spacing:.3px;color:var(--t-dim);text-transform:uppercase;transition:color .15s}
  .app-links a:hover,.app-links a.on{color:var(--t-hi)}
  .app-links a.on{color:var(--green-br)}
  .app-right{display:flex;align-items:center;gap:16px}
  .nav-email{font-family:var(--f-mono);font-size:12px;color:var(--t-faint)}
  .btn-signout{font-family:var(--f-mono);font-size:12px;color:var(--t-dim);background:none;border:none;cursor:pointer}
  .btn-signout:hover{color:var(--green-br)}
  .nav-toggle{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:var(--t-hi)}
  .nav-mobile{display:none;flex-direction:column;max-width:1000px;margin:0 auto;padding:4px var(--gut) 14px;border-top:1px solid var(--line-d2)}
  .nav-mobile.open{display:flex}
  .nav-mobile a{font-family:var(--f-mono);font-size:14px;text-transform:uppercase;color:var(--t-dim);padding:11px 0;border-bottom:1px solid var(--line-d2);cursor:pointer}
  @media(max-width:700px){.app-links,.nav-email,.btn-signout{display:none}.nav-toggle{display:block}}

  main{max-width:1000px;margin:0 auto;padding:48px var(--gut) 72px;width:100%}
  .page-header{text-align:center}
  .page-header .ey{font-family:var(--f-mono);font-size:12px;letter-spacing:.8px;color:var(--green-br);text-transform:uppercase}
  .page-header h1{font-family:var(--f-gro);font-weight:600;font-size:32px;letter-spacing:-.03em;margin:12px 0}
  .page-header p{font-size:15px;color:var(--t-dim);max-width:640px;margin:0 auto;line-height:1.65}
  .summary{display:flex;justify-content:center;gap:40px;margin-top:34px;flex-wrap:wrap}
  .stat{text-align:center}
  .stat-num{font-family:var(--f-gro);font-size:28px;font-weight:600;color:var(--green-br);letter-spacing:-.03em}
  .stat-lab{font-family:var(--f-mono);font-size:11px;color:var(--t-faint);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
  .topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:40px}
  .tc{background:var(--surface);border:1px solid var(--line-d);border-radius:12px;padding:22px;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s,box-shadow .15s}
  .tc:hover{border-color:var(--green);transform:translateY(-3px);box-shadow:0 20px 44px -30px rgba(0,0,0,.6)}
  .tc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
  .tc h3{font-family:var(--f-gro);font-size:16px;font-weight:600}
  .tc-count{font-family:var(--f-mono);font-size:11px;color:var(--t-faint);white-space:nowrap}
  .tc p{font-size:12.5px;color:var(--t-dim);line-height:1.55;margin-bottom:16px;flex:1}
  .bar{height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:10px}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--mint));border-radius:4px;width:0}
  .tc-foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--t-faint)}
  .tc-go{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--green-br)}
  .crumb{max-width:1000px;margin:0 auto;padding:16px var(--gut) 0;width:100%;text-align:center}
  .crumb a{font-family:var(--f-mono);font-size:12px;letter-spacing:.3px;color:var(--t-dim);text-transform:uppercase;transition:color .15s}
  .crumb a:hover{color:var(--green-br)}
  .loading{background:var(--surface);border:1px solid var(--line-d);border-radius:14px;padding:40px;text-align:center;margin-top:34px;color:var(--t-dim);font-family:var(--f-mono);font-size:14px}
</style>
</head>
<body>

<nav class="app-nav">
  <div class="in">
    <div class="app-left">
      <a href="dashboard.html" class="logo gro"><svg class="mk" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#2BD6A4" stroke-width="1.6"/><path d="M12 6v6l4 2" stroke="#2BD6A4" stroke-width="1.6" stroke-linecap="round"/></svg><span class="wm">Mock<em>FRCS</em></span></a>
      <div class="app-links"><a href="dashboard.html">Dashboard</a><a href="revision.html" class="on">Revision</a><a href="index.html">Home</a></div>
    </div>
    <div class="app-right"><span class="nav-email" id="navEmail"></span><button class="btn-signout" onclick="signOut()">Sign out</button></div>
    <button class="nav-toggle" aria-label="Open menu" onclick="toggleNav()">&#9776;</button>
  </div>
  <div class="nav-mobile" id="navMobile"><a href="dashboard.html">Dashboard</a><a href="revision.html">Revision</a><a href="index.html">Home</a><a onclick="signOut();return false;">Sign out</a></div>
</nav>

<main>
  <nav class="crumb"><a href="revision.html">&larr; Revision resources</a></nav>
  <div class="page-header">
    <div class="ey">// Practice</div>
    <h1 class="gro">Practice Question Bank</h1>
  </div>

  <div id="summary" class="summary" style="display:none">
    <div class="stat"><div class="stat-num" id="sAnswered">0</div><div class="stat-lab">Answered</div></div>
    <div class="stat"><div class="stat-num" id="sCorrect">0%</div><div class="stat-lab">Correct</div></div>
    <div class="stat"><div class="stat-num" id="sTotal">0</div><div class="stat-lab">Questions</div></div>
  </div>

  <div id="loading" class="loading">Loading your practice topics…</div>
  <div id="grid" class="topic-grid" style="display:none"></div>
</main>

<div class="auth-foot">© 2026 MOCKFRCS.CO.UK · HELLO@MOCKFRCS.CO.UK</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
function toggleNav(){document.getElementById('navMobile').classList.toggle('open');}

const BLURBS = {
  'colorectal': 'Cancer pathways, IBD, benign anorectal disease and the inherited syndromes.',
  'oesophagogastric': 'Barrett’s and early cancer, gastric cancer surgery, bariatrics and reflux.',
  'hpb': 'Gallstone disease, pancreatitis, pancreatic and liver lesions, portal hypertension.',
  'breast': 'Margins and the axilla, systemic therapy, familial risk and benign disease.',
  'endocrine': 'Thyroid, parathyroid and adrenal, with the neuroendocrine tumours.',
  'egs': 'The acute abdomen, emergency laparotomy standards and emergency urology.',
  'trauma': 'Resuscitation, imaging decisions, damage control and organ-specific injury.',
  'criticalcare': 'Preoperative optimisation, organ support, fluids and professional practice.',
  'anatomy': 'Applied and operative anatomy: planes, landmarks, nerve injuries and variants.',
  'vascular': 'The aorta, acute and chronic limb ischaemia, mesenteric and carotid disease.',
  'transplant': 'Death and donation, the law, graft complications and immunosuppression.',
  'paediatrics': 'Neonatal emergencies, the infant abdomen, and safeguarding and consent.',
  'hernia': 'Groin and ventral hernia, mesh decisions and the abdominal wall lesions.',
  'electiveskin': 'Skin cancer, soft tissue sarcoma, lumps and professional practice.'
};

(async function(){
  const user = await requireMembership();
  if (!user) return;
  document.getElementById('navEmail').textContent = user.email;

  const { data: questions, error: qErr } = await db.from('practice_questions').select('id, topic_slug, topic');
  if (qErr || !questions || questions.length === 0) {
    document.getElementById('loading').innerHTML = 'No practice questions are loaded yet. Please contact hello@mockfrcs.co.uk';
    return;
  }
  const { data: attempts } = await db.from('practice_latest_attempts').select('topic_slug, is_correct').eq('user_id', user.id);

  const byTopic = {};
  questions.forEach(q => { byTopic[q.topic_slug] = byTopic[q.topic_slug] || { name: q.topic, total: 0, answered: 0, correct: 0 }; byTopic[q.topic_slug].total++; });
  (attempts || []).forEach(a => { if (!byTopic[a.topic_slug]) return; byTopic[a.topic_slug].answered++; if (a.is_correct) byTopic[a.topic_slug].correct++; });

  const slugs = Object.keys(byTopic).sort((a, b) => byTopic[a].name.localeCompare(byTopic[b].name));
  const grid = document.getElementById('grid');
  let tAnswered = 0, tCorrect = 0, tTotal = 0;
  slugs.forEach(slug => {
    const t = byTopic[slug];
    tAnswered += t.answered; tCorrect += t.correct; tTotal += t.total;
    const pct = t.total ? Math.round((t.answered / t.total) * 100) : 0;
    const scorePct = t.answered ? Math.round((t.correct / t.answered) * 100) : null;
    const a = document.createElement('a');
    a.className = 'tc';
    a.href = 'practice-set.html?topic=' + encodeURIComponent(slug);
    a.innerHTML =
      '<div class="tc-head"><h3></h3><span class="tc-count">' + t.total + ' questions</span></div>' +
      '<p></p>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '<div class="tc-foot"><span>' + t.answered + ' of ' + t.total + ' answered' + (scorePct === null ? '' : ' &middot; ' + scorePct + '% correct') + '</span><span class="tc-go">' + (t.answered ? 'Continue' : 'Start') + ' &rarr;</span></div>';
    a.querySelector('h3').textContent = t.name;
    a.querySelector('p').textContent = BLURBS[slug] || '';
    grid.appendChild(a);
  });

  document.getElementById('sAnswered').textContent = tAnswered;
  document.getElementById('sCorrect').textContent = tAnswered ? Math.round((tCorrect / tAnswered) * 100) + '%' : '—';
  document.getElementById('sTotal').textContent = tTotal;
  document.getElementById('summary').style.display = 'flex';
  document.getElementById('loading').style.display = 'none';
  grid.style.display = 'grid';
})();
</script>
</body>
</html>
