<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<title>MockFRCS — Set New Password</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="brand.css">
</head>
<body>

<div class="auth-top">
  <div class="in">
    <a href="index.html" class="logo gro"><svg class="mk" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#2BD6A4" stroke-width="1.6"/><path d="M12 6v6l4 2" stroke="#2BD6A4" stroke-width="1.6" stroke-linecap="round"/></svg><span class="wm">Mock<em>FRCS</em></span></a>
  </div>
</div>

<main class="auth-main">
  <div class="auth-card">
    <div class="ah">
      <h1 class="gro">Set a new password</h1>
      <p class="sub">Choose a new password for your MockFRCS account.</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <div class="form-group">
      <label for="password">New password</label>
      <input type="password" id="password" placeholder="At least 8 characters" />
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm new password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat your new password" />
    </div>
    <button class="btn-submit" id="resetBtn" onclick="handleReset()">Set new password</button>
  </div>
</main>

<div class="auth-foot">© 2026 MOCKFRCS.CO.UK · FOR EDUCATIONAL PURPOSES ONLY · <a href="terms.html" style="color:inherit;text-decoration:underline">TERMS</a> · <a href="privacy.html" style="color:inherit;text-decoration:underline">PRIVACY</a></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
async function handleReset() {
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const btn = document.getElementById('resetBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  errorMsg.classList.remove('show'); successMsg.classList.remove('show');
  if (password.length < 8) { errorMsg.textContent = 'Password must be at least 8 characters.'; errorMsg.classList.add('show'); return; }
  if (password !== confirmPassword) { errorMsg.textContent = 'Passwords do not match.'; errorMsg.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Updating...';
  const { error } = await db.auth.updateUser({ password });
  if (error) { errorMsg.textContent = error.message; errorMsg.classList.add('show'); btn.disabled = false; btn.textContent = 'Set new password'; return; }
  successMsg.textContent = 'Password updated successfully — redirecting to your dashboard...'; successMsg.classList.add('show');
  setTimeout(() => window.location.href = 'dashboard.html', 2000);
}
</script>
</body>
</html>
