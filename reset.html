<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="shortcut icon" href="favicon.ico">
<title>MockFRCS — Reset Password</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="brand.css">
</head>
<body>

<div class="auth-top">
  <div class="in">
    <a href="index.html" class="logo gro"><svg class="mk" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#2BD6A4" stroke-width="1.6"/><path d="M12 6v6l4 2" stroke="#2BD6A4" stroke-width="1.6" stroke-linecap="round"/></svg><span class="wm">Mock<em>FRCS</em></span></a>
    <a href="login.html" class="lk">Back to log in →</a>
  </div>
</div>

<main class="auth-main">
  <div class="auth-card">
    <div class="ah">
      <h1 class="gro">Reset your password</h1>
      <p class="sub">Enter your email and we'll send you a reset link.</p>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="success-msg" id="successMsg"></div>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>
    <button class="btn-submit" id="resetBtn" onclick="handleReset()">Send reset link</button>
    <a href="login.html" class="back-link">← Back to login</a>
  </div>
</main>

<div class="auth-foot">© 2026 MOCKFRCS.CO.UK · FOR EDUCATIONAL PURPOSES ONLY</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
async function handleReset() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('resetBtn');
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  errorMsg.classList.remove('show'); successMsg.classList.remove('show');
  if (!email) { errorMsg.textContent = 'Please enter your email address.'; errorMsg.classList.add('show'); return; }
  btn.disabled = true; btn.textContent = 'Sending...';
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: 'https://mockfrcs.co.uk/reset-confirm.html' });
  if (error) { errorMsg.textContent = error.message; errorMsg.classList.add('show'); btn.disabled = false; btn.textContent = 'Send reset link'; return; }
  successMsg.textContent = 'Reset link sent — check your email inbox.'; successMsg.classList.add('show'); btn.textContent = 'Sent';
}
</script>
</body>
</html>
