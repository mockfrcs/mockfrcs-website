<svg viewBox="0 0 1000 1273" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="1273" fill="#F4F6F4"/>
<rect x="0" y="0" width="1000" height="108" fill="#AA2E5A"/>
<rect x="0.0" y="108" width="250.0" height="4" fill="#C77B20"/>
<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Invasive breast cancer — types &amp; pathology</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#EAC4D2">FRCS Part 1 (General Surgery)  ·  histological types  ·  Nottingham grade  ·  receptor &amp; molecular subtypes   [1 of 3]</text>
<rect x="30" y="138" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="154" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">THE TWO MAIN TYPES</text>
<rect x="30" y="172" width="455" height="164.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="172" width="6" height="164.0" fill="#15806A" rx="3"/>
<text x="54" y="200" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">COMMONEST — ~70–80%</text>
<text x="54" y="224" font-size="18" font-weight="800" fill="#3A1322">Invasive ductal (NST)</text>
<text x="54" y="246" font-size="12" font-weight="700" fill="#15806A">Histology</text>
<text x="130" y="246.0" font-size="12" font-weight="400" fill="#2E3C42">Malignant cells breach the basement membrane;</text>
<text x="130" y="266.5" font-size="12" font-weight="400" fill="#2E3C42">desmoplastic mass.</text>
<text x="54" y="287.0" font-size="12" font-weight="700" fill="#15806A">Imaging</text>
<text x="130" y="287.0" font-size="12" font-weight="400" fill="#2E3C42">Spiculated mass ± microcalcification.</text>
<text x="54" y="307.5" font-size="12" font-weight="700" fill="#15806A">Name</text>
<text x="130" y="307.5" font-size="12" font-weight="400" fill="#2E3C42">‘No special type’ (NST) = not one of the special</text>
<text x="130" y="328.0" font-size="12" font-weight="400" fill="#2E3C42">variants.</text>
<rect x="505" y="172" width="455" height="123.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="505" y="172" width="6" height="123.0" fill="#6D4AA3" rx="3"/>
<text x="529" y="200" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">~10–15%</text>
<text x="529" y="224" font-size="18" font-weight="800" fill="#3A1322">Invasive lobular</text>
<text x="529" y="246" font-size="12" font-weight="700" fill="#6D4AA3">Histology</text>
<text x="615" y="246.0" font-size="12" font-weight="400" fill="#2E3C42">E-cadherin NEGATIVE; discohesive single-file cells.</text>
<text x="529" y="266.5" font-size="12" font-weight="700" fill="#6D4AA3">Behaviour</text>
<text x="615" y="266.5" font-size="12" font-weight="400" fill="#2E3C42">Multifocal &amp; bilateral; often occult on mammography.</text>
<text x="529" y="287.0" font-size="12" font-weight="700" fill="#6D4AA3">Spread</text>
<text x="615" y="287.0" font-size="12" font-weight="400" fill="#2E3C42">Bone, GI tract, peritoneum, ovary, meninges.</text>
<rect x="30" y="338.0" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="354.0" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">SPECIAL &amp; RARE TYPES</text>
<rect x="30" y="372.0" width="940" height="24" fill="#3A1322" rx="5"/>
<text x="40" y="388.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Type</text>
<text x="250" y="388.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Key features</text>
<text x="620" y="388.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Prognosis / management</text>
<rect x="30" y="396.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="396.0" width="4" height="25" fill="#15806A"/>
<text x="40" y="412.0" font-size="11" font-weight="700" fill="#3A1322">Special types</text>
<text x="250" y="412.0" font-size="11" font-weight="400" fill="#2E3C42">Tubular, cribriform, mucinous, medullary</text>
<text x="620" y="412.0" font-size="11" font-weight="400" fill="#2E3C42">Generally BETTER prognosis</text>
<rect x="30" y="421.0" width="4" height="25" fill="#BE3A2E"/>
<text x="40" y="437.0" font-size="11" font-weight="700" fill="#3A1322">Inflammatory</text>
<text x="250" y="437.0" font-size="11" font-weight="400" fill="#2E3C42">Peau d’orange; dermal lymphatic emboli (T4d)</text>
<text x="620" y="437.0" font-size="11" font-weight="400" fill="#2E3C42">Poor — neoadjuvant chemo FIRST</text>
<rect x="30" y="446.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="446.0" width="4" height="25" fill="#6D4AA3"/>
<text x="40" y="462.0" font-size="11" font-weight="700" fill="#3A1322">Paget’s</text>
<text x="250" y="462.0" font-size="11" font-weight="400" fill="#2E3C42">Eczematous / eroded nipple; underlying DCIS or cancer</text>
<text x="620" y="462.0" font-size="11" font-weight="400" fill="#2E3C42">Punch biopsy; treat the underlying lesion</text>
<rect x="30" y="471.0" width="4" height="25" fill="#C77B20"/>
<text x="40" y="487.0" font-size="11" font-weight="700" fill="#3A1322">Angiosarcoma</text>
<text x="250" y="487.0" font-size="11" font-weight="400" fill="#2E3C42">Primary rare; secondary = Stewart-Treves</text>
<text x="620" y="487.0" font-size="11" font-weight="400" fill="#2E3C42">Post-RT / chronic lymphoedema; aggressive</text>
<rect x="30" y="496.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="496.0" width="4" height="25" fill="#245C8C"/>
<text x="40" y="512.0" font-size="11" font-weight="700" fill="#3A1322">Phyllodes</text>
<text x="250" y="512.0" font-size="11" font-weight="400" fill="#2E3C42">Fibroepithelial ‘leaf-like’; rapid growth</text>
<text x="620" y="512.0" font-size="11" font-weight="400" fill="#2E3C42">WLE ≥1 cm margin; NO axillary surgery</text>
<rect x="30" y="523.0" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="539.0" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">NOTTINGHAM GRADE  (BLOOM–RICHARDSON–ELSTON)</text>
<rect x="30" y="557.0" width="940" height="123.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="557.0" width="6" height="123.0" fill="#C77B20" rx="3"/>
<text x="54" y="585.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">THREE COMPONENTS, EACH SCORED 1–3</text>
<text x="54" y="609.0" font-size="18" font-weight="800" fill="#3A1322">Histological grade</text>
<text x="54" y="631.0" font-size="12" font-weight="700" fill="#C77B20">Components</text>
<text x="142" y="631.0" font-size="12" font-weight="400" fill="#2E3C42">Tubule formation + nuclear pleomorphism + mitotic count — each 1–3 (total 3–9).</text>
<text x="54" y="651.5" font-size="12" font-weight="700" fill="#C77B20">Grades</text>
<text x="142" y="651.5" font-size="12" font-weight="400" fill="#2E3C42">G1 well-differentiated (3–5) · G2 moderate (6–7) · G3 poor (8–9).</text>
<text x="54" y="672.0" font-size="12" font-weight="700" fill="#C77B20">Why</text>
<text x="142" y="672.0" font-size="12" font-weight="400" fill="#2E3C42">Feeds the Nottingham Prognostic Index and drives adjuvant decisions.</text>
<rect x="30" y="682.0" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="698.0" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">RECEPTORS &amp; MOLECULAR SUBTYPES</text>
<rect x="30" y="716.0" width="940" height="24" fill="#3A1322" rx="5"/>
<text x="40" y="732.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Subtype</text>
<text x="240" y="732.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">ER / PR</text>
<text x="400" y="732.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">HER2</text>
<text x="540" y="732.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Notes</text>
<rect x="30" y="740.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="740.0" width="4" height="25" fill="#15806A"/>
<text x="40" y="756.0" font-size="11" font-weight="700" fill="#3A1322">Luminal A</text>
<text x="240" y="756.0" font-size="11" font-weight="400" fill="#2E3C42">ER+ / PR+</text>
<text x="400" y="756.0" font-size="11" font-weight="400" fill="#2E3C42">Negative</text>
<text x="540" y="756.0" font-size="11" font-weight="400" fill="#2E3C42">Low Ki67; endocrine; best prognosis</text>
<rect x="30" y="765.0" width="4" height="25" fill="#245C8C"/>
<text x="40" y="781.0" font-size="11" font-weight="700" fill="#3A1322">Luminal B</text>
<text x="240" y="781.0" font-size="11" font-weight="400" fill="#2E3C42">ER+</text>
<text x="400" y="781.0" font-size="11" font-weight="400" fill="#2E3C42">Neg or pos</text>
<text x="540" y="781.0" font-size="11" font-weight="400" fill="#2E3C42">High Ki67; endocrine ± chemotherapy</text>
<rect x="30" y="790.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="790.0" width="4" height="25" fill="#BE3A2E"/>
<text x="40" y="806.0" font-size="11" font-weight="700" fill="#3A1322">HER2-enriched</text>
<text x="240" y="806.0" font-size="11" font-weight="400" fill="#2E3C42">ER−</text>
<text x="400" y="806.0" font-size="11" font-weight="400" fill="#2E3C42">Positive</text>
<text x="540" y="806.0" font-size="11" font-weight="400" fill="#2E3C42">Anti-HER2 therapy + chemotherapy</text>
<rect x="30" y="815.0" width="4" height="25" fill="#6D4AA3"/>
<text x="40" y="831.0" font-size="11" font-weight="700" fill="#3A1322">Triple-negative</text>
<text x="240" y="831.0" font-size="11" font-weight="400" fill="#2E3C42">ER− / PR−</text>
<text x="400" y="831.0" font-size="11" font-weight="400" fill="#2E3C42">Negative</text>
<text x="540" y="831.0" font-size="11" font-weight="400" fill="#2E3C42">Basal; chemo; BRCA1-associated</text>
<rect x="30" y="844.0" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="860.0" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="874.0" width="940" height="250.0" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="874.0" width="6" height="250.0" fill="#C77B20" rx="3"/>
<circle cx="60" cy="896.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="900.0" font-size="12" font-weight="600" fill="#3A1322">Lobular cancer is E-cadherin negative, often multifocal / bilateral and can be mammographically occult — have a low threshold</text>
<text x="72" y="918.0" font-size="12" font-weight="400" fill="#2E3C42">for MRI.</text>
<circle cx="60" cy="936.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="940.0" font-size="12" font-weight="600" fill="#3A1322">Inflammatory breast cancer is a clinical diagnosis (rapid onset, peau d’orange) — it is T4d and treated with neoadjuvant chemo</text>
<text x="72" y="958.0" font-size="12" font-weight="400" fill="#2E3C42">first, not primary surgery.</text>
<circle cx="60" cy="976.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="980.0" font-size="12" font-weight="600" fill="#3A1322">Peau d’orange with no mass is not simply infection — biopsy skin and breast to exclude inflammatory cancer before treating as</text>
<text x="72" y="998.0" font-size="12" font-weight="400" fill="#2E3C42">mastitis.</text>
<circle cx="60" cy="1016.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1020.0" font-size="12" font-weight="600" fill="#3A1322">A purple skin nodule in a chronically lymphoedematous arm after axillary surgery / RT is angiosarcoma (Stewart-Treves) until</text>
<text x="72" y="1038.0" font-size="12" font-weight="400" fill="#2E3C42">proven otherwise.</text>
<circle cx="60" cy="1056.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1060.0" font-size="12" font-weight="600" fill="#3A1322">An eczematous, non-healing nipple is Paget’s disease until biopsied — look for underlying DCIS or invasive cancer.</text>
<circle cx="60" cy="1078.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1082.0" font-size="12" font-weight="600" fill="#3A1322">Triple-negative and HER2-positive cancers are aggressive but are precisely the ones most likely to benefit from neoadjuvant</text>
<text x="72" y="1100.0" font-size="12" font-weight="400" fill="#2E3C42">therapy.</text>
<line x1="30" y1="1134.0" x2="970" y2="1134.0" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1153.0" font-size="10.5" font-weight="400" fill="#7C8A8E">Sources: WHO Classification of Breast Tumours (5th ed.); RCPath breast cancer histopathology dataset; NICE NG101 — Early and locally advanced breast cancer.</text>
<text x="30" y="1167.0" font-size="10.5" font-weight="400" fill="#7C8A8E">Key points: NST ~70–80%; lobular ~10–15% (E-cadherin negative). Nottingham grade = tubules + pleomorphism + mitoses (G1–G3). Subtypes: Luminal A/B, HER2-enriched,</text>
<text x="30" y="1181.0" font-size="10.5" font-weight="400" fill="#7C8A8E">triple-negative/basal.</text>
<text x="30" y="1195.0" font-size="10.5" font-weight="400" fill="#9AA6AA">FRCS Part 1 revision aid — verify against current primary sources and local MDT guidance before clinical use.</text>
<g id="mf-wordmark"><text x="822" y="42" font-size="21" font-weight="800" letter-spacing="0.2" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="822" y="60" font-size="10.5" font-weight="500" fill="#EAC4D2">mockfrcs.co.uk</text></g>
<rect x="0" y="1227" width="1000" height="46" fill="#AA2E5A"/><text x="30" y="1256" font-size="14" font-weight="800" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="970" y="1256" text-anchor="end" font-size="12.5" font-weight="600" fill="#EAC4D2">Revision resources &amp; realistic mock exams · mockfrcs.co.uk</text>
</svg>