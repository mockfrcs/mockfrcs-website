<svg viewBox="0 0 1000 1505.5" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="1505.5" fill="#F4F6F4"/>
<rect x="0" y="0" width="1000" height="108" fill="#AA2E5A"/>
<rect x="0.0" y="108" width="250.0" height="4" fill="#C77B20"/>
<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Breast cancer in pregnancy (PABC)</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#EAC4D2">FRCS Part 1 (General Surgery)  ·  imaging &amp; staging · surgery &amp; axilla · timing of chemo &amp; radiotherapy · contraindicated agents</text>
<rect x="30" y="138" width="6" height="20" fill="#6D4AA3" rx="3"/>
<text x="46" y="154" font-size="13" font-weight="800" fill="#6D4AA3" letter-spacing="1.2">DEFINITION &amp; TUMOUR CHARACTERISTICS</text>
<rect x="30" y="172" width="940" height="164.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="172" width="6" height="164.0" fill="#6D4AA3" rx="3"/>
<text x="54" y="200" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">PREGNANCY-ASSOCIATED BREAST CANCER</text>
<text x="54" y="224" font-size="18" font-weight="800" fill="#3A1322">The young patient with delayed diagnosis</text>
<text x="54" y="246" font-size="12" font-weight="700" fill="#6D4AA3">Definition</text>
<text x="162" y="246.0" font-size="12" font-weight="400" fill="#2E3C42">Breast cancer during pregnancy or within ~1 year postpartum / lactation; ~1 in 3000 pregnancies.</text>
<text x="54" y="266.5" font-size="12" font-weight="700" fill="#6D4AA3">Presentation</text>
<text x="162" y="266.5" font-size="12" font-weight="400" fill="#2E3C42">Often delayed — physiological breast changes mask the lump; still needs full triple assessment.</text>
<text x="54" y="287.0" font-size="12" font-weight="700" fill="#6D4AA3">Phenotype</text>
<text x="162" y="287.0" font-size="12" font-weight="400" fill="#2E3C42">Reflects the young age group: frequently node-positive, higher grade, more often ER-negative / HER2-positive; usually ductal NST.</text>
<text x="162" y="307.5" font-size="12" font-weight="400" fill="#2E3C42">Consider BRCA testing.</text>
<text x="54" y="328.0" font-size="12" font-weight="700" fill="#6D4AA3">Prognosis</text>
<text x="162" y="328.0" font-size="12" font-weight="400" fill="#2E3C42">Stage-for-stage similar to non-pregnant women; worse outcomes are driven by delay. Termination does NOT improve survival.</text>
<rect x="30" y="338.0" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="354.0" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">IMAGING &amp; STAGING  ·  SAFE vs AVOID</text>
<rect x="30" y="372.0" width="940" height="24" fill="#3A1322" rx="5"/>
<text x="40" y="388.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Modality</text>
<text x="260" y="388.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Use in pregnancy</text>
<rect x="30" y="396.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="396.0" width="4" height="25" fill="#15806A"/>
<text x="40" y="412.0" font-size="11" font-weight="700" fill="#3A1322">Breast ultrasound</text>
<text x="260" y="412.0" font-size="11" font-weight="400" fill="#2E3C42">First-line — safe; preferred for a pregnancy lump</text>
<rect x="30" y="421.0" width="4" height="25" fill="#15806A"/>
<text x="40" y="437.0" font-size="11" font-weight="700" fill="#3A1322">Core biopsy</text>
<text x="260" y="437.0" font-size="11" font-weight="400" fill="#2E3C42">Diagnostic standard; inform the pathologist of pregnancy</text>
<rect x="30" y="446.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="446.0" width="4" height="25" fill="#15806A"/>
<text x="40" y="462.0" font-size="11" font-weight="700" fill="#3A1322">Mammography</text>
<text x="260" y="462.0" font-size="11" font-weight="400" fill="#2E3C42">Safe with abdominal / fetal shielding (low fetal dose)</text>
<rect x="30" y="471.0" width="4" height="25" fill="#15806A"/>
<text x="40" y="487.0" font-size="11" font-weight="700" fill="#3A1322">Chest X-ray</text>
<text x="260" y="487.0" font-size="11" font-weight="400" fill="#2E3C42">Safe with shielding — staging</text>
<rect x="30" y="496.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="496.0" width="4" height="25" fill="#15806A"/>
<text x="40" y="512.0" font-size="11" font-weight="700" fill="#3A1322">Liver ultrasound</text>
<text x="260" y="512.0" font-size="11" font-weight="400" fill="#2E3C42">Safe — staging for metastases</text>
<rect x="30" y="521.0" width="4" height="25" fill="#C77B20"/>
<text x="40" y="537.0" font-size="11" font-weight="700" fill="#3A1322">MRI</text>
<text x="260" y="537.0" font-size="11" font-weight="400" fill="#2E3C42">Non-contrast only — AVOID gadolinium (crosses placenta)</text>
<rect x="30" y="546.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="546.0" width="4" height="25" fill="#BE3A2E"/>
<text x="40" y="562.0" font-size="11" font-weight="700" fill="#3A1322">CT · PET · bone scan</text>
<text x="260" y="562.0" font-size="11" font-weight="400" fill="#2E3C42">AVOID — fetal ionising radiation</text>
<rect x="30" y="573.0" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="589.0" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">SURGERY &amp; THE AXILLA</text>
<rect x="30" y="607.0" width="940" height="143.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="607.0" width="6" height="143.5" fill="#245C8C" rx="3"/>
<text x="54" y="635.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">THE MAINSTAY OF LOCAL TREATMENT</text>
<text x="54" y="659.0" font-size="18" font-weight="800" fill="#3A1322">Safe in every trimester</text>
<text x="54" y="681.0" font-size="12" font-weight="700" fill="#245C8C">Timing</text>
<text x="162" y="681.0" font-size="12" font-weight="400" fill="#2E3C42">Surgery is safe in ALL trimesters — the mainstay of local treatment.</text>
<text x="54" y="701.5" font-size="12" font-weight="700" fill="#245C8C">Procedure</text>
<text x="162" y="701.5" font-size="12" font-weight="400" fill="#2E3C42">Mastectomy, or breast-conserving surgery when radiotherapy can be deferred to postpartum (i.e. later pregnancy).</text>
<text x="54" y="722.0" font-size="12" font-weight="700" fill="#245C8C">Sentinel node</text>
<text x="162" y="722.0" font-size="12" font-weight="400" fill="#2E3C42">Technetium-99m radioisotope — considered safe. AVOID blue dye (anaphylaxis; methylene blue teratogenic).</text>
<text x="54" y="742.5" font-size="12" font-weight="700" fill="#245C8C">Node-positive</text>
<text x="162" y="742.5" font-size="12" font-weight="400" fill="#2E3C42">Axillary node clearance if involved. Reconstruction is usually delayed.</text>
<rect x="30" y="752.5" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="768.5" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">THE TRIMESTER TIMELINE  ·  WHAT IS GIVEN, AND WHEN</text>
<rect x="30.0" y="786.5" width="227.5" height="104" fill="#E1EAF1" rx="9" stroke="#245C8C" stroke-width="1.3"/>
<rect x="30.0" y="786.5" width="227.5" height="22" fill="#245C8C" rx="9"/>
<rect x="30.0" y="797.5" width="227.5" height="11" fill="#245C8C"/>
<text x="40.0" y="802.5" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">1st TRIMESTER</text>
<text x="40.0" y="823.5" font-size="10.5" font-weight="700" fill="#245C8C">Surgery only</text>
<text x="40.0" y="838.5" font-size="10" font-weight="400" fill="#2E3C42">NO chemo (organogenesis); no</text>
<text x="40.0" y="851.5" font-size="10" font-weight="400" fill="#2E3C42">radiotherapy; no endocrine / anti-HER2</text>
<rect x="267.5" y="786.5" width="227.5" height="104" fill="#E2F1EC" rx="9" stroke="#15806A" stroke-width="1.3"/>
<rect x="267.5" y="786.5" width="227.5" height="22" fill="#15806A" rx="9"/>
<rect x="267.5" y="797.5" width="227.5" height="11" fill="#15806A"/>
<text x="277.5" y="802.5" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">2nd–3rd TRIMESTER</text>
<text x="277.5" y="823.5" font-size="10.5" font-weight="700" fill="#15806A">Chemo from ~14 weeks</text>
<text x="277.5" y="838.5" font-size="10" font-weight="400" fill="#2E3C42">Anthracycline ± taxane; stop ~3 weeks</text>
<text x="277.5" y="851.5" font-size="10" font-weight="400" fill="#2E3C42">before delivery</text>
<rect x="505.0" y="786.5" width="227.5" height="104" fill="#F6ECDD" rx="9" stroke="#C77B20" stroke-width="1.3"/>
<rect x="505.0" y="786.5" width="227.5" height="22" fill="#C77B20" rx="9"/>
<rect x="505.0" y="797.5" width="227.5" height="11" fill="#C77B20"/>
<text x="515.0" y="802.5" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">DELIVERY</text>
<text x="515.0" y="823.5" font-size="10.5" font-weight="700" fill="#C77B20">Aim term ≥37 weeks</text>
<text x="515.0" y="838.5" font-size="10" font-weight="400" fill="#2E3C42">No chemo after ~35 weeks; no</text>
<text x="515.0" y="851.5" font-size="10" font-weight="400" fill="#2E3C42">breastfeeding while on chemo</text>
<rect x="742.5" y="786.5" width="227.5" height="104" fill="#ECE6F4" rx="9" stroke="#6D4AA3" stroke-width="1.3"/>
<rect x="742.5" y="786.5" width="227.5" height="22" fill="#6D4AA3" rx="9"/>
<rect x="742.5" y="797.5" width="227.5" height="11" fill="#6D4AA3"/>
<text x="752.5" y="802.5" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">POSTPARTUM</text>
<text x="752.5" y="823.5" font-size="10.5" font-weight="700" fill="#6D4AA3">Deferred agents start</text>
<text x="752.5" y="838.5" font-size="10" font-weight="400" fill="#2E3C42">Radiotherapy · tamoxifen / endocrine ·</text>
<text x="752.5" y="851.5" font-size="10" font-weight="400" fill="#2E3C42">trastuzumab</text>
<rect x="30" y="892.5" width="6" height="20" fill="#BE3A2E" rx="3"/>
<text x="46" y="908.5" font-size="13" font-weight="800" fill="#BE3A2E" letter-spacing="1.2">CONTRAINDICATED IN PREGNANCY</text>
<rect x="30" y="926.5" width="940" height="164.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="926.5" width="6" height="164.0" fill="#BE3A2E" rx="3"/>
<text x="54" y="954.5" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">DEFER OR AVOID — THE HIGH-YIELD LIST</text>
<text x="54" y="978.5" font-size="18" font-weight="800" fill="#3A1322">What not to give</text>
<text x="54" y="1000.5" font-size="12" font-weight="700" fill="#BE3A2E">Endocrine</text>
<text x="162" y="1000.5" font-size="12" font-weight="400" fill="#2E3C42">Tamoxifen — teratogenic (Goldenhar syndrome, vaginal bleeding, fetal death). Defer all endocrine therapy to postpartum.</text>
<text x="54" y="1021.0" font-size="12" font-weight="700" fill="#BE3A2E">Anti-HER2</text>
<text x="162" y="1021.0" font-size="12" font-weight="400" fill="#2E3C42">Trastuzumab / pertuzumab — oligohydramnios / anhydramnios, fetal renal impairment. Defer to postpartum.</text>
<text x="54" y="1041.5" font-size="12" font-weight="700" fill="#BE3A2E">Radiotherapy</text>
<text x="162" y="1041.5" font-size="12" font-weight="400" fill="#2E3C42">Deferred until after delivery.</text>
<text x="54" y="1062.0" font-size="12" font-weight="700" fill="#BE3A2E">Chemo</text>
<text x="162" y="1062.0" font-size="12" font-weight="400" fill="#2E3C42">None in the first trimester (organogenesis); avoid methotrexate / CMF (abortifacient).</text>
<text x="54" y="1082.5" font-size="12" font-weight="700" fill="#BE3A2E">Also avoid</text>
<text x="162" y="1082.5" font-size="12" font-weight="400" fill="#2E3C42">Blue dye, gadolinium, CT / PET; bevacizumab, CDK4/6 inhibitors, everolimus.</text>
<rect x="30" y="1094.5" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="1110.5" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="1124.5" width="940" height="218.0" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="1124.5" width="6" height="218.0" fill="#C77B20" rx="3"/>
<circle cx="60" cy="1146.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1150.5" font-size="12" font-weight="600" fill="#3A1322">A breast lump in pregnancy still needs full triple assessment — never attribute it to pregnancy changes; that delay is what</text>
<text x="72" y="1168.5" font-size="12" font-weight="400" fill="#2E3C42">worsens outcome.</text>
<circle cx="60" cy="1186.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1190.5" font-size="12" font-weight="600" fill="#3A1322">Chemotherapy is safe from the second trimester but NEVER in the first (organogenesis) — and stop ~3 weeks before delivery.</text>
<circle cx="60" cy="1208.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1212.5" font-size="12" font-weight="600" fill="#3A1322">Tamoxifen and trastuzumab are contraindicated throughout pregnancy — defer both to postpartum.</text>
<circle cx="60" cy="1230.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1234.5" font-size="12" font-weight="600" fill="#3A1322">For the sentinel node use technetium alone — avoid blue dye (anaphylaxis risk; methylene blue teratogenicity).</text>
<circle cx="60" cy="1252.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1256.5" font-size="12" font-weight="600" fill="#3A1322">Radiotherapy is deferred until after delivery — this steers the timing of breast-conserving surgery.</text>
<circle cx="60" cy="1274.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1278.5" font-size="12" font-weight="600" fill="#3A1322">Terminating the pregnancy does not improve cancer outcomes — treatment proceeds with the pregnancy ongoing, alongside</text>
<text x="72" y="1296.5" font-size="12" font-weight="400" fill="#2E3C42">obstetrics.</text>
<circle cx="60" cy="1314.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1318.5" font-size="12" font-weight="600" fill="#3A1322">Stage with ultrasound, shielded chest X-ray and non-contrast MRI — avoid gadolinium, CT and PET.</text>
<line x1="30" y1="1352.5" x2="970" y2="1352.5" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1371.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Sources: ESGO / international consensus on cancer in pregnancy (Amant et al.); ESMO Clinical Practice Guideline — cancer, fertility and pregnancy; NCI PDQ — Breast Cancer Treatment</text>
<text x="30" y="1385.5" font-size="10.5" font-weight="400" fill="#7C8A8E">During Pregnancy; RCOG guidance. UK/ESGO position taken for sentinel-node dye (technetium alone).</text>
<text x="30" y="1399.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Key points: surgery safe in all trimesters; chemo 2nd–3rd trimester only (from ~14 wks, stop ~3 wks pre-delivery); defer radiotherapy, tamoxifen and trastuzumab to postpartum; avoid</text>
<text x="30" y="1413.5" font-size="10.5" font-weight="400" fill="#7C8A8E">gadolinium / CT / PET; termination does not improve prognosis.</text>
<text x="30" y="1427.5" font-size="10.5" font-weight="400" fill="#9AA6AA">FRCS Part 1 revision aid — verify against current primary sources and local obstetric-oncology MDT guidance before clinical use.</text>
<g id="mf-wordmark"><text x="822" y="42" font-size="21" font-weight="800" letter-spacing="0.2" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="822" y="60" font-size="10.5" font-weight="500" fill="#EAC4D2">mockfrcs.co.uk</text></g>
<rect x="0" y="1459.5" width="1000" height="46" fill="#AA2E5A"/><text x="30" y="1488.5" font-size="14" font-weight="800" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="970" y="1488.5" text-anchor="end" font-size="12.5" font-weight="600" fill="#EAC4D2">Revision resources &amp; realistic mock exams · mockfrcs.co.uk</text>
</svg>