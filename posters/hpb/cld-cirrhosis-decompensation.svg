<svg viewBox="0 0 1000 1735.5" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="1735.5" fill="#F4F6F4"/>
<rect x="0" y="0" width="1000" height="108" fill="#283A6B"/>
<rect x="0.0" y="108" width="250.0" height="4" fill="#C77B20"/>
<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Cirrhosis &amp; decompensation</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#C3CBE6">FRCS Part 1 (General Surgery)  ·  NICE NG50 · Baveno VII · UKELD  ·  Child–Pugh / MELD · varices · ascites · HE · HRS  ·  HPB (2 of 2 · sheet 2)</text>
<rect x="30" y="126" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="142" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">THE NATURAL HISTORY</text>
<path d="M 30.0 156.0 L 321.3 156.0 L 343.3 191.0 L 321.3 226.0 L 30.0 226.0 Z" fill="#E2F1EC" stroke="#15806A" stroke-width="1.4"/>
<text x="46.0" y="182" font-size="11.5" font-weight="800" fill="#15806A" letter-spacing="0.4">COMPENSATED</text>
<text x="46.0" y="200" font-size="11" font-weight="400" fill="#2E3C42">Often asymptomatic; median survival &gt;12 y</text>
<path d="M 343.3 156.0 L 634.7 156.0 L 656.7 191.0 L 634.7 226.0 L 343.3 226.0 L 365.3 191.0 Z" fill="#F6ECDD" stroke="#C77B20" stroke-width="1.4"/>
<text x="375.3333333333333" y="182" font-size="11.5" font-weight="800" fill="#C77B20" letter-spacing="0.4">DECOMPENSATION</text>
<text x="375.3333333333333" y="200" font-size="11" font-weight="400" fill="#2E3C42">Ascites · variceal bleed · encephalopathy ·</text>
<text x="375.3333333333333" y="215" font-size="11" font-weight="400" fill="#2E3C42">jaundice</text>
<path d="M 656.7 156.0 L 970.0 156.0 L 970.0 226.0 L 656.7 226.0 L 678.7 191.0 Z" fill="#FBEAE6" stroke="#BE3A2E" stroke-width="1.4"/>
<text x="688.6666666666666" y="182" font-size="11.5" font-weight="800" fill="#BE3A2E" letter-spacing="0.4">ACLF / END-STAGE</text>
<text x="688.6666666666666" y="200" font-size="11" font-weight="400" fill="#2E3C42">Organ failure → transplant assessment</text>
<rect x="30" y="238" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="254" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">CHILD–PUGH SCORE</text>
<rect x="30" y="268" width="940" height="24" fill="#16203F" rx="5"/>
<text x="40" y="284" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Parameter</text>
<text x="300" y="284" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">1 point</text>
<text x="470" y="284" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">2 points</text>
<text x="660" y="284" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">3 points</text>
<rect x="30" y="292" width="940" height="24" fill="#F1F4F2"/>
<rect x="30" y="292" width="4" height="24" fill="#245C8C"/>
<text x="40" y="308" font-size="11" font-weight="700" fill="#16203F">Bilirubin (µmol/L)</text>
<text x="300" y="308" font-size="11" font-weight="400" fill="#2E3C42">&lt;34</text>
<text x="470" y="308" font-size="11" font-weight="400" fill="#2E3C42">34–50</text>
<text x="660" y="308" font-size="11" font-weight="400" fill="#2E3C42">&gt;50</text>
<rect x="30" y="316" width="4" height="24" fill="#245C8C"/>
<text x="40" y="332" font-size="11" font-weight="700" fill="#16203F">Albumin (g/L)</text>
<text x="300" y="332" font-size="11" font-weight="400" fill="#2E3C42">&gt;35</text>
<text x="470" y="332" font-size="11" font-weight="400" fill="#2E3C42">28–35</text>
<text x="660" y="332" font-size="11" font-weight="400" fill="#2E3C42">&lt;28</text>
<rect x="30" y="340" width="940" height="24" fill="#F1F4F2"/>
<rect x="30" y="340" width="4" height="24" fill="#245C8C"/>
<text x="40" y="356" font-size="11" font-weight="700" fill="#16203F">INR</text>
<text x="300" y="356" font-size="11" font-weight="400" fill="#2E3C42">&lt;1.7</text>
<text x="470" y="356" font-size="11" font-weight="400" fill="#2E3C42">1.7–2.3</text>
<text x="660" y="356" font-size="11" font-weight="400" fill="#2E3C42">&gt;2.3</text>
<rect x="30" y="364" width="4" height="24" fill="#245C8C"/>
<text x="40" y="380" font-size="11" font-weight="700" fill="#16203F">Ascites</text>
<text x="300" y="380" font-size="11" font-weight="400" fill="#2E3C42">None</text>
<text x="470" y="380" font-size="11" font-weight="400" fill="#2E3C42">Mild / diuretic-responsive</text>
<text x="660" y="380" font-size="11" font-weight="400" fill="#2E3C42">Refractory</text>
<rect x="30" y="388" width="940" height="24" fill="#F1F4F2"/>
<rect x="30" y="388" width="4" height="24" fill="#245C8C"/>
<text x="40" y="404" font-size="11" font-weight="700" fill="#16203F">Encephalopathy</text>
<text x="300" y="404" font-size="11" font-weight="400" fill="#2E3C42">None</text>
<text x="470" y="404" font-size="11" font-weight="400" fill="#2E3C42">Grade 1–2</text>
<text x="660" y="404" font-size="11" font-weight="400" fill="#2E3C42">Grade 3–4</text>
<text x="30" y="430" font-size="10.5" font-weight="400" fill="#6B7B80">Class A = 5–6 (well-compensated) · B = 7–9 · C = 10–15 (decompensated). Mnemonic 'A BEAT': Albumin, Bilirubin, Encephalopathy, Ascites, Time (INR / PT).</text>
<rect x="30" y="441" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="457" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">PROGNOSIS &amp; TRANSPLANT LISTING</text>
<rect x="30" y="471" width="940" height="143.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="471" width="6" height="143.5" fill="#245C8C" rx="3"/>
<text x="54" y="499" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">scores &amp; referral</text>
<text x="54" y="523" font-size="18" font-weight="800" fill="#16203F">MELD · UKELD · Milan</text>
<text x="54" y="545" font-size="12" font-weight="700" fill="#245C8C">MELD</text>
<text x="140" y="545.0" font-size="12" font-weight="400" fill="#2E3C42">Bilirubin, INR, creatinine (± sodium in MELD-Na); predicts 90-day mortality and prioritises transplant</text>
<text x="54" y="565.5" font-size="12" font-weight="700" fill="#245C8C">UKELD</text>
<text x="140" y="565.5" font-size="12" font-weight="400" fill="#2E3C42">UK end-stage liver disease score (bilirubin, INR, creatinine, sodium); ≥49 = eligible for transplant listing (≈9% 1-year mortality</text>
<text x="140" y="586.0" font-size="12" font-weight="400" fill="#2E3C42">without)</text>
<text x="54" y="606.5" font-size="12" font-weight="700" fill="#245C8C">Refer</text>
<text x="140" y="606.5" font-size="12" font-weight="400" fill="#2E3C42">Decompensated cirrhosis, HCC within Milan criteria, or acute liver failure</text>
<rect x="30" y="626.5" width="6" height="20" fill="#BE3A2E" rx="3"/>
<text x="46" y="642.5" font-size="13" font-weight="800" fill="#BE3A2E" letter-spacing="1.2">PORTAL HYPERTENSION &amp; VARICEAL BLEEDING</text>
<rect x="30" y="656.5" width="940" height="143.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="656.5" width="6" height="143.5" fill="#BE3A2E" rx="3"/>
<text x="54" y="684.5" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">the lethal complication</text>
<text x="54" y="708.5" font-size="18" font-weight="800" fill="#16203F">Oesophageal varices</text>
<text x="54" y="730.5" font-size="12" font-weight="700" fill="#BE3A2E">Prophylaxis</text>
<text x="148" y="730.5" font-size="12" font-weight="400" fill="#2E3C42">Non-selective beta-blocker — carvedilol preferred (or propranolol); endoscopic band ligation if NSBB not tolerated</text>
<text x="54" y="751.0" font-size="12" font-weight="700" fill="#BE3A2E">Acute bleed</text>
<text x="148" y="751.0" font-size="12" font-weight="400" fill="#2E3C42">Resuscitate; terlipressin + prophylactic antibiotics (e.g. IV ceftriaxone); endoscopic band ligation within 12 h</text>
<text x="54" y="771.5" font-size="12" font-weight="700" fill="#BE3A2E">Rescue</text>
<text x="148" y="771.5" font-size="12" font-weight="400" fill="#2E3C42">Balloon tamponade (Sengstaken–Blakemore) as a bridge; TIPS for refractory or early rebleeding</text>
<text x="54" y="792.0" font-size="12" font-weight="700" fill="#BE3A2E">Secondary</text>
<text x="148" y="792.0" font-size="12" font-weight="400" fill="#2E3C42">NSBB + repeat band ligation to eradicate varices</text>
<rect x="30" y="812.0" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="828.0" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">ASCITES &amp; SPONTANEOUS BACTERIAL PERITONITIS</text>
<rect x="30" y="842.0" width="940" height="143.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="842.0" width="6" height="143.5" fill="#15806A" rx="3"/>
<text x="54" y="870.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">fluid &amp; infection</text>
<text x="54" y="894.0" font-size="18" font-weight="800" fill="#16203F">Ascites &amp; SBP</text>
<text x="54" y="916.0" font-size="12" font-weight="700" fill="#15806A">SAAG</text>
<text x="140" y="916.0" font-size="12" font-weight="400" fill="#2E3C42">Serum-ascites albumin gradient ≥11 g/L = portal hypertension</text>
<text x="54" y="936.5" font-size="12" font-weight="700" fill="#15806A">Ascites</text>
<text x="140" y="936.5" font-size="12" font-weight="400" fill="#2E3C42">Salt restriction; spironolactone ± furosemide; large-volume paracentesis + albumin; refractory → TIPS</text>
<text x="54" y="957.0" font-size="12" font-weight="700" fill="#15806A">SBP</text>
<text x="140" y="957.0" font-size="12" font-weight="400" fill="#2E3C42">Ascitic neutrophils ≥250/mm³ → IV cefotaxime (or piperacillin-tazobactam) + IV albumin (cuts hepatorenal syndrome)</text>
<text x="54" y="977.5" font-size="12" font-weight="700" fill="#15806A">Prophylaxis</text>
<text x="140" y="977.5" font-size="12" font-weight="400" fill="#2E3C42">Oral ciprofloxacin / norfloxacin after SBP or if ascitic protein low</text>
<rect x="30" y="997.5" width="6" height="20" fill="#6D4AA3" rx="3"/>
<text x="46" y="1013.5" font-size="13" font-weight="800" fill="#6D4AA3" letter-spacing="1.2">ENCEPHALOPATHY &amp; HEPATORENAL SYNDROME</text>
<rect x="30" y="1027.5" width="462.0" height="184.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="1027.5" width="6" height="184.5" fill="#6D4AA3" rx="3"/>
<text x="54" y="1055.5" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">brain</text>
<text x="54" y="1079.5" font-size="16" font-weight="800" fill="#16203F">Hepatic encephalopathy</text>
<text x="54" y="1101.5" font-size="12" font-weight="700" fill="#6D4AA3">Precipitants</text>
<text x="134" y="1101.5" font-size="12" font-weight="400" fill="#2E3C42">Infection, GI bleed, constipation, dehydration,</text>
<text x="134" y="1122.0" font-size="12" font-weight="400" fill="#2E3C42">sedatives, electrolyte upset</text>
<text x="54" y="1142.5" font-size="12" font-weight="700" fill="#6D4AA3">Grading</text>
<text x="134" y="1142.5" font-size="12" font-weight="400" fill="#2E3C42">West Haven 1–4 (altered sleep → coma); asterixis, ↑</text>
<text x="134" y="1163.0" font-size="12" font-weight="400" fill="#2E3C42">ammonia</text>
<text x="54" y="1183.5" font-size="12" font-weight="700" fill="#6D4AA3">Treat</text>
<text x="134" y="1183.5" font-size="12" font-weight="400" fill="#2E3C42">Lactulose to 2–3 soft stools/day + rifaximin; correct the</text>
<text x="134" y="1204.0" font-size="12" font-weight="400" fill="#2E3C42">precipitant</text>
<rect x="508.0" y="1027.5" width="462.0" height="143.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="508.0" y="1027.5" width="6" height="143.5" fill="#BE3A2E" rx="3"/>
<text x="532.0" y="1055.5" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">kidney</text>
<text x="532.0" y="1079.5" font-size="16" font-weight="800" fill="#16203F">Hepatorenal syndrome</text>
<text x="532.0" y="1101.5" font-size="12" font-weight="700" fill="#BE3A2E">What</text>
<text x="604.0" y="1101.5" font-size="12" font-weight="400" fill="#2E3C42">AKI in advanced cirrhosis; a diagnosis of exclusion (no</text>
<text x="604.0" y="1122.0" font-size="12" font-weight="400" fill="#2E3C42">other cause)</text>
<text x="532.0" y="1142.5" font-size="12" font-weight="700" fill="#BE3A2E">Treat</text>
<text x="604.0" y="1142.5" font-size="12" font-weight="400" fill="#2E3C42">Terlipressin + IV albumin; stop nephrotoxins &amp; diuretics</text>
<text x="532.0" y="1163.0" font-size="12" font-weight="700" fill="#BE3A2E">Definitive</text>
<text x="604.0" y="1163.0" font-size="12" font-weight="400" fill="#2E3C42">Liver transplant</text>
<rect x="30" y="1224.0" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="1240.0" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">SURVEILLANCE FOR HEPATOCELLULAR CARCINOMA</text>
<rect x="30" y="1254.0" width="940" height="102.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="1254.0" width="6" height="102.5" fill="#C77B20" rx="3"/>
<text x="54" y="1282.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">the feared endpoint</text>
<text x="54" y="1306.0" font-size="18" font-weight="800" fill="#16203F">HCC &amp; Milan criteria</text>
<text x="54" y="1328.0" font-size="12" font-weight="700" fill="#C77B20">Surveillance</text>
<text x="148" y="1328.0" font-size="12" font-weight="400" fill="#2E3C42">6-monthly ultrasound ± serum AFP in cirrhosis (NICE NG50); also in HBV without cirrhosis</text>
<text x="54" y="1348.5" font-size="12" font-weight="700" fill="#C77B20">Milan</text>
<text x="148" y="1348.5" font-size="12" font-weight="400" fill="#2E3C42">1 lesion ≤5 cm, or ≤3 lesions each ≤3 cm, no vascular invasion — defines transplant eligibility</text>
<rect x="30" y="1368.5" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="1384.5" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="1398.5" width="940" height="178.0" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="1398.5" width="6" height="178.0" fill="#C77B20" rx="3"/>
<circle cx="60" cy="1420.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1424.5" font-size="12" font-weight="600" fill="#16203F">A serum-ascites albumin gradient ≥11 g/L indicates portal hypertension; a low gradient points elsewhere (malignancy, TB, pancreatic ascites).</text>
<circle cx="60" cy="1442.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1446.5" font-size="12" font-weight="600" fill="#16203F">Any cirrhotic with new or worsening ascites needs a diagnostic tap — SBP is diagnosed at ascitic neutrophils ≥250/mm³ and treated with</text>
<text x="72" y="1464.5" font-size="12" font-weight="400" fill="#2E3C42">antibiotics plus IV albumin.</text>
<circle cx="60" cy="1482.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1486.5" font-size="12" font-weight="600" fill="#16203F">In acute variceal bleeding, terlipressin and prophylactic antibiotics both improve survival — give them before / at endoscopy, not after.</text>
<circle cx="60" cy="1504.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1508.5" font-size="12" font-weight="600" fill="#16203F">Carvedilol is the preferred non-selective beta-blocker once clinically significant portal hypertension is present.</text>
<circle cx="60" cy="1526.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1530.5" font-size="12" font-weight="600" fill="#16203F">Hepatorenal syndrome is a diagnosis of exclusion — terlipressin + albumin is the medical treatment; liver transplant is definitive.</text>
<circle cx="60" cy="1548.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1552.5" font-size="12" font-weight="600" fill="#16203F">UKELD ≥49 is the UK threshold for transplant listing; hepatocellular carcinoma is assessed against the Milan criteria.</text>
<line x1="30" y1="1598.5" x2="970" y2="1598.5" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1617.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Sources: NICE NG50 (cirrhosis in over-16s, 2016) · Baveno VII consensus on portal hypertension (J Hepatol 2022) · EASL guidance on decompensated cirrhosis. Scores: Child–Pugh (A 5–6 /</text>
<text x="30" y="1631.5" font-size="10.5" font-weight="400" fill="#7C8A8E">B 7–9 / C 10–15), MELD / MELD-Na, UKELD (UK transplant listing ≥49). HCC: Milan criteria.</text>
<text x="30" y="1645.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Aetiology (MASLD, alcohol, viral), fibrosis staging and transient elastography are on the companion sheet (1 of 2).</text>
<text x="30" y="1659.5" font-size="10.5" font-weight="400" fill="#9AA6AA">Revision aid — verify against current local guidance before clinical use.</text>
<g id="mf-wordmark"><text x="822" y="42" font-size="21" font-weight="800" letter-spacing="0.2" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="822" y="60" font-size="10.5" font-weight="500" fill="#C3CBE6">mockfrcs.co.uk</text></g>
<rect x="0" y="1689.5" width="1000" height="46" fill="#283A6B"/><text x="30" y="1718.5" font-size="14" font-weight="800" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="970" y="1718.5" text-anchor="end" font-size="12.5" font-weight="600" fill="#C3CBE6">Revision resources &amp; realistic mock exams · mockfrcs.co.uk</text>
</svg>