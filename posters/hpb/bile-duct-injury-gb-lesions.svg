<svg viewBox="0 0 1000 1615.5" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="1615.5" fill="#F4F6F4"/>
<rect x="0" y="0" width="1000" height="108" fill="#283A6B"/>
<rect x="0.0" y="108" width="250.0" height="4" fill="#C77B20"/>
<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Bile duct injury &amp; gallbladder lesions</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#C3CBE6">FRCS Part 1 (General Surgery)  ·  Strasberg / Bismuth · critical view of safety · GB polyps (ESGE/ESGAR 2022)  ·  HPB (biliary 4 of 4)</text>
<rect x="30" y="126" width="6" height="20" fill="#BE3A2E" rx="3"/>
<text x="46" y="142" font-size="13" font-weight="800" fill="#BE3A2E" letter-spacing="1.2">BILE DUCT INJURY — STRASBERG CLASSIFICATION</text>
<rect x="30" y="156" width="940" height="24" fill="#16203F" rx="5"/>
<text x="40" y="172" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Type</text>
<text x="150" y="172" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Injury</text>
<text x="560" y="172" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Management</text>
<rect x="30" y="180" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="180" width="4" height="25" fill="#15806A"/>
<text x="40" y="196" font-size="11" font-weight="700" fill="#16203F">A</text>
<text x="150" y="196" font-size="11" font-weight="400" fill="#2E3C42">Leak: cystic-duct stump or duct of Luschka</text>
<text x="560" y="196" font-size="11" font-weight="400" fill="#2E3C42">ERCP + biliary stent</text>
<rect x="30" y="205" width="4" height="25" fill="#C77B20"/>
<text x="40" y="221" font-size="11" font-weight="700" fill="#16203F">B</text>
<text x="150" y="221" font-size="11" font-weight="400" fill="#2E3C42">Occluded aberrant right sectoral duct</text>
<text x="560" y="221" font-size="11" font-weight="400" fill="#2E3C42">Observe; HJ if symptomatic</text>
<rect x="30" y="230" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="230" width="4" height="25" fill="#C77B20"/>
<text x="40" y="246" font-size="11" font-weight="700" fill="#16203F">C</text>
<text x="150" y="246" font-size="11" font-weight="400" fill="#2E3C42">Transected aberrant sectoral duct (bile leak)</text>
<text x="560" y="246" font-size="11" font-weight="400" fill="#2E3C42">Drainage; HJ if significant</text>
<rect x="30" y="255" width="4" height="25" fill="#C77B20"/>
<text x="40" y="271" font-size="11" font-weight="700" fill="#16203F">D</text>
<text x="150" y="271" font-size="11" font-weight="400" fill="#2E3C42">Lateral injury to a major bile duct</text>
<text x="560" y="271" font-size="11" font-weight="400" fill="#2E3C42">Repair over a stent / ERCP</text>
<rect x="30" y="280" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="280" width="4" height="25" fill="#BE3A2E"/>
<text x="40" y="296" font-size="11" font-weight="700" fill="#16203F">E1–E5</text>
<text x="150" y="296" font-size="11" font-weight="400" fill="#2E3C42">Circumferential major-duct injury (= Bismuth)</text>
<text x="560" y="296" font-size="11" font-weight="400" fill="#2E3C42">Roux-en-Y hepaticojejunostomy</text>
<rect x="30" y="315" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="331" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">TYPE E = BISMUTH LEVEL OF THE INJURY</text>
<rect x="30.0" y="345" width="181.6" height="84" fill="#E2F1EC" rx="9" stroke="#15806A" stroke-width="1.3"/>
<rect x="30.0" y="345" width="181.6" height="22" fill="#15806A" rx="9"/>
<rect x="30.0" y="356" width="181.6" height="11" fill="#15806A"/>
<text x="40.0" y="361" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">E1</text>
<text x="40.0" y="382" font-size="10.5" font-weight="700" fill="#15806A">&gt;2 cm from confluence</text>
<text x="40.0" y="397" font-size="10" font-weight="400" fill="#2E3C42">Long common-hepatic stump</text>
<rect x="219.6" y="345" width="181.6" height="84" fill="#E2F1EC" rx="9" stroke="#15806A" stroke-width="1.3"/>
<rect x="219.6" y="345" width="181.6" height="22" fill="#15806A" rx="9"/>
<rect x="219.6" y="356" width="181.6" height="11" fill="#15806A"/>
<text x="229.6" y="361" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">E2</text>
<text x="229.6" y="382" font-size="10.5" font-weight="700" fill="#15806A">&lt;2 cm from confluence</text>
<text x="229.6" y="397" font-size="10" font-weight="400" fill="#2E3C42">Short stump</text>
<rect x="409.2" y="345" width="181.6" height="84" fill="#F6ECDD" rx="9" stroke="#C77B20" stroke-width="1.3"/>
<rect x="409.2" y="345" width="181.6" height="22" fill="#C77B20" rx="9"/>
<rect x="409.2" y="356" width="181.6" height="11" fill="#C77B20"/>
<text x="419.2" y="361" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">E3</text>
<text x="419.2" y="382" font-size="10.5" font-weight="700" fill="#C77B20">At the confluence</text>
<text x="419.2" y="397" font-size="10" font-weight="400" fill="#2E3C42">Confluence still intact</text>
<rect x="598.8" y="345" width="181.6" height="84" fill="#FBEAE6" rx="9" stroke="#BE3A2E" stroke-width="1.3"/>
<rect x="598.8" y="345" width="181.6" height="22" fill="#BE3A2E" rx="9"/>
<rect x="598.8" y="356" width="181.6" height="11" fill="#BE3A2E"/>
<text x="608.8" y="361" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">E4</text>
<text x="608.8" y="382" font-size="10.5" font-weight="700" fill="#BE3A2E">Confluence destroyed</text>
<text x="608.8" y="397" font-size="10" font-weight="400" fill="#2E3C42">Right &amp; left ducts separated</text>
<rect x="788.4" y="345" width="181.6" height="84" fill="#FBEAE6" rx="9" stroke="#BE3A2E" stroke-width="1.3"/>
<rect x="788.4" y="345" width="181.6" height="22" fill="#BE3A2E" rx="9"/>
<rect x="788.4" y="356" width="181.6" height="11" fill="#BE3A2E"/>
<text x="798.4" y="361" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">E5</text>
<text x="798.4" y="382" font-size="10.5" font-weight="700" fill="#BE3A2E">Aberrant sectoral duct</text>
<text x="798.4" y="397" font-size="10" font-weight="400" fill="#2E3C42">± concomitant CHD injury</text>
<rect x="30" y="439" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="455" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">PREVENTION — CRITICAL VIEW OF SAFETY</text>
<rect x="30" y="469" width="940" height="214" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="469" width="6" height="214" fill="#15806A" rx="3"/>
<text x="52" y="497" font-size="13" font-weight="800" fill="#16203F">Critical view of safety — before dividing anything</text>
<path d="M 64 519 L 460 519 L 460 535 Q 265 551 64 535 Z" fill="#E7D6BC" stroke="#D6C098" stroke-width="1.2"/>
<text x="74" y="532" font-size="10" font-weight="400" fill="#8A7A55" font-style="italic">liver</text>
<line x1="180" y1="543" x2="180" y2="653" stroke="#AEBBC0" stroke-width="7"/>
<rect x="160" y="653" width="40" height="13" rx="6" fill="#EBE1CE" stroke="#CDBF9E" stroke-width="1.2"/>
<text x="166" y="619" font-size="10" font-weight="700" fill="#6B7B80" text-anchor="end">CHD</text>
<path d="M 180 627 L 316 619 L 180 565 Z" fill="#E2F1EC" stroke="#15806A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="194" y="609" font-size="9.5" font-weight="700" fill="#15806A">triangle</text>
<ellipse cx="370" cy="587" rx="34" ry="27" fill="#D8E8DE" stroke="#15806A" stroke-width="1.6"/>
<path d="M 342 603 L 316 619 L 326 625 L 350 609 Z" fill="#D8E8DE" stroke="#15806A" stroke-width="1.4"/>
<text x="356" y="583" font-size="11" font-weight="700" fill="#1C6B52">GB</text>
<line x1="316" y1="621" x2="180" y2="627" stroke="#AEBBC0" stroke-width="6"/>
<text x="226" y="641" font-size="10" font-weight="400" fill="#2E3C42">cystic duct</text>
<line x1="320" y1="607" x2="198" y2="589" stroke="#BE3A2E" stroke-width="4"/>
<text x="226" y="579" font-size="10" font-weight="400" fill="#BE3A2E">cystic artery</text>
<circle cx="495" cy="529" r="9" fill="#15806A"/>
<text x="495" y="533" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="512" y="533" font-size="11.5" font-weight="400" fill="#2E3C42">Hepatocystic triangle cleared of all fibrofatty tissue</text>
<circle cx="495" cy="554" r="9" fill="#15806A"/>
<text x="495" y="558" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="512" y="558" font-size="11.5" font-weight="400" fill="#2E3C42">Lower third of the gallbladder dissected off the cystic plate</text>
<circle cx="495" cy="579" r="9" fill="#15806A"/>
<text x="495" y="583" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="512" y="583" font-size="11.5" font-weight="400" fill="#2E3C42">Only TWO structures (cystic duct + cystic artery) enter the GB</text>
<line x1="488" y1="606" x2="946" y2="606" stroke="#D7DEDC" stroke-width="1"/>
<text x="488" y="624" font-size="11" font-weight="600" fill="#16203F">Bail-out if unclear: intra-operative cholangiogram; subtotal</text>
<text x="488" y="638" font-size="11" font-weight="400" fill="#2E3C42">cholecystectomy or convert.</text>
<rect x="30" y="693" width="6" height="20" fill="#BE3A2E" rx="3"/>
<text x="46" y="709" font-size="13" font-weight="800" fill="#BE3A2E" letter-spacing="1.2">RECOGNISING &amp; MANAGING AN INJURY</text>
<rect x="30" y="723" width="940" height="164.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="723" width="6" height="164.0" fill="#BE3A2E" rx="3"/>
<text x="54" y="751" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">recognise, resuscitate, refer</text>
<text x="54" y="775" font-size="18" font-weight="800" fill="#16203F">If it happens</text>
<text x="54" y="797" font-size="12" font-weight="700" fill="#BE3A2E">Presents</text>
<text x="154" y="797.0" font-size="12" font-weight="400" fill="#2E3C42">Early: bile leak, biloma, biliary peritonitis; late: stricture, jaundice, cholangitis</text>
<text x="54" y="817.5" font-size="12" font-weight="700" fill="#BE3A2E">Classic injury</text>
<text x="154" y="817.5" font-size="12" font-weight="400" fill="#2E3C42">The common bile duct misidentified as the cystic duct — the 'classical' laparoscopic injury</text>
<text x="54" y="838.0" font-size="12" font-weight="700" fill="#BE3A2E">First steps</text>
<text x="154" y="838.0" font-size="12" font-weight="400" fill="#2E3C42">Control sepsis + percutaneously drain any collection; define the anatomy (MRCP / ERCP / PTC)</text>
<text x="54" y="858.5" font-size="12" font-weight="700" fill="#BE3A2E">Definitive</text>
<text x="154" y="858.5" font-size="12" font-weight="400" fill="#2E3C42">Refer EARLY to an HPB centre. Leaks (A / D) → ERCP + stent; transections / type E → Roux-en-Y hepaticojejunostomy (delayed, by an</text>
<text x="154" y="879.0" font-size="12" font-weight="400" fill="#2E3C42">HPB surgeon)</text>
<rect x="30" y="897.0" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="913.0" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">GALLBLADDER POLYPS &amp; PORCELAIN GB</text>
<rect x="30" y="927.0" width="462.0" height="225.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="927.0" width="6" height="225.5" fill="#245C8C" rx="3"/>
<text x="54" y="955.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">ESGE / ESGAR 2022</text>
<text x="54" y="979.0" font-size="16" font-weight="800" fill="#16203F">Gallbladder polyps</text>
<text x="54" y="1001.0" font-size="12" font-weight="700" fill="#245C8C">Resect if</text>
<text x="140" y="1001.0" font-size="12" font-weight="400" fill="#2E3C42">Polyp ≥10 mm; OR 6–9 mm with a risk factor; OR</text>
<text x="140" y="1021.5" font-size="12" font-weight="400" fill="#2E3C42">growth &gt;2 mm in 2 years</text>
<text x="54" y="1042.0" font-size="12" font-weight="700" fill="#245C8C">Risk factors</text>
<text x="140" y="1042.0" font-size="12" font-weight="400" fill="#2E3C42">Age &gt;60, Asian ethnicity, sessile polyp / focal wall</text>
<text x="140" y="1062.5" font-size="12" font-weight="400" fill="#2E3C42">thickening &gt;4 mm, PSC</text>
<text x="54" y="1083.0" font-size="12" font-weight="700" fill="#245C8C">Surveillance</text>
<text x="140" y="1083.0" font-size="12" font-weight="400" fill="#2E3C42">6–9 mm, no risk factor → US follow-up; ≤5 mm → US at</text>
<text x="140" y="1103.5" font-size="12" font-weight="400" fill="#2E3C42">6 mo, 1 &amp; 2 y, then stop if stable</text>
<text x="54" y="1124.0" font-size="12" font-weight="700" fill="#245C8C">Reassure</text>
<text x="140" y="1124.0" font-size="12" font-weight="400" fill="#2E3C42">Most small polyps are benign cholesterol</text>
<text x="140" y="1144.5" font-size="12" font-weight="400" fill="#2E3C42">pseudopolyps; if it disappears, stop monitoring</text>
<rect x="508.0" y="927.0" width="462.0" height="123.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="508.0" y="927.0" width="6" height="123.0" fill="#C77B20" rx="3"/>
<text x="532.0" y="955.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">calcified wall</text>
<text x="532.0" y="979.0" font-size="16" font-weight="800" fill="#16203F">Porcelain gallbladder</text>
<text x="532.0" y="1001.0" font-size="12" font-weight="700" fill="#C77B20">What</text>
<text x="592.0" y="1001.0" font-size="12" font-weight="400" fill="#2E3C42">Calcified gallbladder wall from chronic inflammation</text>
<text x="532.0" y="1021.5" font-size="12" font-weight="700" fill="#C77B20">Risk</text>
<text x="592.0" y="1021.5" font-size="12" font-weight="400" fill="#2E3C42">~6% gallbladder cancer (lower than once thought)</text>
<text x="532.0" y="1042.0" font-size="12" font-weight="700" fill="#C77B20">Manage</text>
<text x="592.0" y="1042.0" font-size="12" font-weight="400" fill="#2E3C42">Cholecystectomy is indicated</text>
<rect x="30" y="1162.5" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="1178.5" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="1192.5" width="940" height="250.0" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="1192.5" width="6" height="250.0" fill="#C77B20" rx="3"/>
<circle cx="60" cy="1214.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1218.5" font-size="12" font-weight="600" fill="#16203F">The critical view of safety (triangle cleared, gallbladder off the cystic plate, only two structures entering) is the key to</text>
<text x="72" y="1236.5" font-size="12" font-weight="400" fill="#2E3C42">preventing bile-duct injury — achieve it before dividing anything.</text>
<circle cx="60" cy="1254.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1258.5" font-size="12" font-weight="600" fill="#16203F">If the anatomy is unclear, stop: intra-operative cholangiography, a subtotal cholecystectomy or conversion are all safer than a</text>
<text x="72" y="1276.5" font-size="12" font-weight="400" fill="#2E3C42">wrong division (the 'culture of safety').</text>
<circle cx="60" cy="1294.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1298.5" font-size="12" font-weight="600" fill="#16203F">Strasberg A–D are minor and usually managed endoscopically (ERCP + stent); type E is a circumferential, Bismuth-level injury</text>
<text x="72" y="1316.5" font-size="12" font-weight="400" fill="#2E3C42">needing a Roux-en-Y hepaticojejunostomy.</text>
<circle cx="60" cy="1334.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1338.5" font-size="12" font-weight="600" fill="#16203F">Refer a suspected bile-duct injury EARLY to an HPB centre — do not attempt a definitive repair locally; control sepsis and</text>
<text x="72" y="1356.5" font-size="12" font-weight="400" fill="#2E3C42">define the anatomy first.</text>
<circle cx="60" cy="1374.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1378.5" font-size="12" font-weight="600" fill="#16203F">Resect a gallbladder polyp that is ≥10 mm, 6–9 mm with a risk factor, or growing &gt;2 mm in 2 years (ESGE/ESGAR); otherwise</text>
<text x="72" y="1396.5" font-size="12" font-weight="400" fill="#2E3C42">surveil with ultrasound.</text>
<circle cx="60" cy="1414.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1418.5" font-size="12" font-weight="600" fill="#16203F">A porcelain gallbladder carries a ~6% cancer risk and is an indication for cholecystectomy.</text>
<line x1="30" y1="1464.5" x2="970" y2="1464.5" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1483.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Sources: Strasberg classification of laparoscopic bile-duct injuries (extends Bismuth E1–E5) · SAGES 'critical view of safety' / culture of safety · ESGAR/EAES/EFISDS/ESGE joint guidelines</text>
<text x="30" y="1497.5" font-size="10.5" font-weight="400" fill="#7C8A8E">on gallbladder polyps (2022).</text>
<text x="30" y="1511.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Critical view of safety = (1) hepatocystic triangle cleared, (2) lower third of the gallbladder off the cystic plate, (3) only two structures entering the gallbladder. Completes the biliary</text>
<text x="30" y="1525.5" font-size="10.5" font-weight="400" fill="#7C8A8E">cluster (1 gallstone disease · 2 GB cancer &amp; choledochal cysts · 3 cholangiocarcinoma · 4 injury &amp; GB lesions).</text>
<text x="30" y="1539.5" font-size="10.5" font-weight="400" fill="#9AA6AA">Revision aid — verify against current local guidance before clinical use.</text>
<g id="mf-wordmark"><text x="822" y="42" font-size="21" font-weight="800" letter-spacing="0.2" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="822" y="60" font-size="10.5" font-weight="500" fill="#C3CBE6">mockfrcs.co.uk</text></g>
<rect x="0" y="1569.5" width="1000" height="46" fill="#283A6B"/><text x="30" y="1598.5" font-size="14" font-weight="800" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="970" y="1598.5" text-anchor="end" font-size="12.5" font-weight="600" fill="#C3CBE6">Revision resources &amp; realistic mock exams · mockfrcs.co.uk</text>
</svg>