<text x="237.6" y="872.0" font-size="10.5" font-weight="400" fill="#2E3C42">Supraduodenal diverticulum</text>
<rect x="409.2" y="712.0" width="181.6" height="196" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="409.2" y="712.0" width="6" height="196" fill="#C77B20" rx="3"/>
<text x="427.2" y="740.0" font-size="12.5" font-weight="800" fill="#16203F">TYPE III</text>
