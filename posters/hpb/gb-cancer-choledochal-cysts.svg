<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Gallbladder cancer &amp; choledochal cysts</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#C3CBE6">FRCS Part 1 (General Surgery)  ·  AJCC 8th · Todani  ·  T-stage surgery · incidental cancer · Caroli  ·  HPB (biliary 2 of 4)</text>
<rect x="30" y="126" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="142" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">GALLBLADDER CANCER — RISK FACTORS</text>
<rect x="30" y="156" width="940" height="123.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="156" width="6" height="123.0" fill="#245C8C" rx="3"/>
<text x="54" y="184" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">who is at risk</text>
<text x="54" y="208" font-size="18" font-weight="800" fill="#16203F">Risk factors</text>
<text x="54" y="230" font-size="12" font-weight="700" fill="#245C8C">Gallstones</text>
<text x="126" y="230.0" font-size="12" font-weight="400" fill="#2E3C42">Present in most; large stones (&gt;3 cm) and chronic inflammation</text>
<text x="54" y="250.5" font-size="12" font-weight="700" fill="#245C8C">Structural</text>
<text x="126" y="250.5" font-size="12" font-weight="400" fill="#2E3C42">Porcelain gallbladder (~6% cancer risk); polyps &gt;10 mm; anomalous pancreaticobiliary junction</text>
<text x="54" y="271.0" font-size="12" font-weight="700" fill="#245C8C">Other</text>
<text x="126" y="271.0" font-size="12" font-weight="400" fill="#2E3C42">PSC; chronic Salmonella (typhoid) carriage; obesity; F &gt; M; high in Chile / India</text>
<rect x="30" y="289.0" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="305.0" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">T STAGE DIRECTS THE OPERATION (AJCC 8th)</text>
<rect x="30" y="319.0" width="940" height="24" fill="#16203F" rx="5"/>
<text x="40" y="335.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">T stage</text>
<text x="150" y="335.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Invasion depth</text>
<text x="470" y="335.0" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Surgery</text>
<rect x="30" y="343.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="343.0" width="4" height="25" fill="#15806A"/>
<text x="40" y="359.0" font-size="11" font-weight="700" fill="#16203F">Tis / T1a</text>
<text x="150" y="359.0" font-size="11" font-weight="400" fill="#2E3C42">Mucosa (lamina propria)</text>
<text x="470" y="359.0" font-size="11" font-weight="400" fill="#2E3C42">Simple cholecystectomy — adequate if R0</text>
<rect x="30" y="368.0" width="4" height="25" fill="#C77B20"/>
<text x="40" y="384.0" font-size="11" font-weight="700" fill="#16203F">T1b</text>
<text x="150" y="384.0" font-size="11" font-weight="400" fill="#2E3C42">Muscularis (muscle layer)</text>
<text x="470" y="384.0" font-size="11" font-weight="400" fill="#2E3C42">Extended (radical) cholecystectomy</text>
<rect x="30" y="393.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="393.0" width="4" height="25" fill="#C77B20"/>
<text x="40" y="409.0" font-size="11" font-weight="700" fill="#16203F">T2a / T2b</text>
<text x="150" y="409.0" font-size="11" font-weight="400" fill="#2E3C42">Perimuscular (T2b = hepatic side, worse)</text>
<text x="470" y="409.0" font-size="11" font-weight="400" fill="#2E3C42">Extended cholecystectomy + segment IVb/V + portal nodes</text>
<rect x="30" y="418.0" width="4" height="25" fill="#BE3A2E"/>
<text x="40" y="434.0" font-size="11" font-weight="700" fill="#16203F">T3</text>
<text x="150" y="434.0" font-size="11" font-weight="400" fill="#2E3C42">Serosa and/or liver or one adjacent organ</text>
<text x="470" y="434.0" font-size="11" font-weight="400" fill="#2E3C42">Extended resection ± bile duct / adjacent organ</text>
<rect x="30" y="443.0" width="940" height="25" fill="#F1F4F2"/>
<rect x="30" y="443.0" width="4" height="25" fill="#BE3A2E"/>
<text x="40" y="459.0" font-size="11" font-weight="700" fill="#16203F">T4</text>
<text x="150" y="459.0" font-size="11" font-weight="400" fill="#2E3C42">Portal vein / hepatic artery, or ≥2 organs</text>
<text x="470" y="459.0" font-size="11" font-weight="400" fill="#2E3C42">Usually unresectable → palliative</text>
<rect x="30" y="478.0" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="494.0" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">EXTENDED CHOLECYSTECTOMY &amp; INCIDENTAL CANCER</text>
<rect x="30" y="508.0" width="940" height="164.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="508.0" width="6" height="164.0" fill="#15806A" rx="3"/>
<text x="54" y="536.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">how radical, and when</text>
<text x="54" y="560.0" font-size="18" font-weight="800" fill="#16203F">Radical surgery</text>
<text x="54" y="582.0" font-size="12" font-weight="700" fill="#15806A">Extended chole</text>
<text x="162" y="582.0" font-size="12" font-weight="400" fill="#2E3C42">Cholecystectomy + liver segment IVb/V (wedge or anatomical) + hepatoduodenal-ligament lymphadenectomy; ± bile-duct</text>
<text x="162" y="602.5" font-size="12" font-weight="400" fill="#2E3C42">excision if the cystic-duct margin is positive</text>
<text x="54" y="623.0" font-size="12" font-weight="700" fill="#15806A">Port sites</text>
<text x="162" y="623.0" font-size="12" font-weight="400" fill="#2E3C42">Routine port-site excision is no longer recommended</text>
<text x="54" y="643.5" font-size="12" font-weight="700" fill="#15806A">Incidental</text>
<text x="162" y="643.5" font-size="12" font-weight="400" fill="#2E3C42">Found on histology after a lap chole → restage (CT chest/abdo/pelvis, MRI), MDT; re-resect for T1b and above</text>
<text x="54" y="664.0" font-size="12" font-weight="700" fill="#15806A">Adjuvant</text>
<text x="162" y="664.0" font-size="12" font-weight="400" fill="#2E3C42">Capecitabine after resection (BILCAP); advanced disease → gemcitabine + cisplatin (ABC-02)</text>
<rect x="30" y="682.0" width="6" height="20" fill="#6D4AA3" rx="3"/>
<text x="46" y="698.0" font-size="13" font-weight="800" fill="#6D4AA3" letter-spacing="1.2">CHOLEDOCHAL CYSTS — TODANI TYPES</text>
<rect x="30.0" y="712.0" width="181.6" height="196" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30.0" y="712.0" width="6" height="196" fill="#245C8C" rx="3"/>
