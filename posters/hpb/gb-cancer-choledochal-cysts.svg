<circle cx="879" cy="778" r="5" fill="#FBEAE6" stroke="#BE3A2E" stroke-width="1.6"/>
<text x="806.4" y="872.0" font-size="10.5" font-weight="400" fill="#2E3C42">Caroli — intrahepatic only</text>
<rect x="30" y="918.0" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="934.0" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">CHOLEDOCHAL CYSTS — PRINCIPLES &amp; MANAGEMENT</text>
<rect x="30" y="948.0" width="940" height="164.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="948.0" width="6" height="164.0" fill="#15806A" rx="3"/>
<text x="54" y="976.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">excise, don't just drain</text>
<text x="54" y="1000.0" font-size="18" font-weight="800" fill="#16203F">Why and how to operate</text>
<text x="54" y="1022.0" font-size="12" font-weight="700" fill="#15806A">Cause</text>
<text x="134" y="1022.0" font-size="12" font-weight="400" fill="#2E3C42">Anomalous pancreaticobiliary junction (long common channel) → pancreatic reflux → chronic inflammation</text>
<text x="54" y="1042.5" font-size="12" font-weight="700" fill="#15806A">Present</text>
<text x="134" y="1042.5" font-size="12" font-weight="400" fill="#2E3C42">Children: pain + jaundice + palpable mass (rarely all three); adults: cholangitis, pancreatitis, stones</text>
<text x="54" y="1063.0" font-size="12" font-weight="700" fill="#15806A">Malignancy</text>
<text x="134" y="1063.0" font-size="12" font-weight="400" fill="#2E3C42">Lifetime cholangiocarcinoma risk ~3–7.5%, rising with age; also gallbladder cancer</text>
<text x="54" y="1083.5" font-size="12" font-weight="700" fill="#15806A">Surgery</text>
<text x="134" y="1083.5" font-size="12" font-weight="400" fill="#2E3C42">COMPLETE excision + cholecystectomy + Roux-en-Y hepaticojejunostomy (I, II, IV). Type III → endoscopic sphincterotomy; type V</text>
<text x="134" y="1104.0" font-size="12" font-weight="400" fill="#2E3C42">(Caroli) → hepatectomy or transplant</text>
<rect x="30" y="1122.0" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="1138.0" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="1152.0" width="940" height="250.0" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="1152.0" width="6" height="250.0" fill="#C77B20" rx="3"/>
<circle cx="60" cy="1174.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1178.0" font-size="12" font-weight="600" fill="#16203F">Gallbladder cancer confined to the mucosa (Tis / T1a) is cured by simple cholecystectomy; T1b and beyond need an extended</text>
<text x="72" y="1196.0" font-size="12" font-weight="400" fill="#2E3C42">(radical) cholecystectomy with segment IVb/V resection and portal lymphadenectomy.</text>
<circle cx="60" cy="1214.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1218.0" font-size="12" font-weight="600" fill="#16203F">When gallbladder cancer is found incidentally on histology after a lap chole, restage and re-resect for T1b+; routine port-site</text>
<text x="72" y="1236.0" font-size="12" font-weight="400" fill="#2E3C42">excision is not recommended.</text>
<circle cx="60" cy="1254.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1258.0" font-size="12" font-weight="600" fill="#16203F">T2b (hepatic-side) tumours behave worse than T2a (peritoneal-side) — location matters in the AJCC 8th edition.</text>
<circle cx="60" cy="1276.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1280.0" font-size="12" font-weight="600" fill="#16203F">A choledochal cyst needs COMPLETE excision with Roux-en-Y hepaticojejunostomy, not internal drainage — the retained cyst</text>
<text x="72" y="1298.0" font-size="12" font-weight="400" fill="#2E3C42">wall keeps a lifelong cholangiocarcinoma risk.</text>
<circle cx="60" cy="1316.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1320.0" font-size="12" font-weight="600" fill="#16203F">Todani type III (choledochocele) is the exception — often managed endoscopically; type V is Caroli disease (intrahepatic),</text>
<text x="72" y="1338.0" font-size="12" font-weight="400" fill="#2E3C42">managed by resection or transplant.</text>
<circle cx="60" cy="1356.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1360.0" font-size="12" font-weight="600" fill="#16203F">Suspect an anomalous pancreaticobiliary junction (long common channel) behind both choledochal cysts and some gallbladder</text>
<text x="72" y="1378.0" font-size="12" font-weight="400" fill="#2E3C42">cancers.</text>
<line x1="30" y1="1424.0" x2="970" y2="1424.0" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1443.0" font-size="10.5" font-weight="400" fill="#7C8A8E">Sources: AJCC 8th edition TNM staging (gallbladder cancer) · Todani classification of choledochal cysts (modification of Alonso-Lej). Adjuvant: BILCAP (capecitabine); advanced: ABC-02</text>
<text x="30" y="1457.0" font-size="10.5" font-weight="400" fill="#7C8A8E">(gemcitabine + cisplatin).</text>
<text x="30" y="1471.0" font-size="10.5" font-weight="400" fill="#7C8A8E">Extended (radical) cholecystectomy = cholecystectomy + liver segment IVb/V resection + hepatoduodenal-ligament lymphadenectomy. Cholangiocarcinoma is on the companion sheet</text>
<text x="30" y="1485.0" font-size="10.5" font-weight="400" fill="#7C8A8E">(biliary 3 of 4).</text>
<text x="30" y="1499.0" font-size="10.5" font-weight="400" fill="#9AA6AA">Revision aid — verify against current local guidance before clinical use.</text>
