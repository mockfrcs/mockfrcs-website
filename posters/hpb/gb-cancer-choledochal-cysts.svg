<text x="427.2" y="872.0" font-size="10.5" font-weight="400" fill="#2E3C42">Choledochocele</text>
<text x="427.2" y="885.0" font-size="10.5" font-weight="400" fill="#2E3C42">(intraduodenal)</text>
<rect x="598.8" y="712.0" width="181.6" height="196" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="598.8" y="712.0" width="6" height="196" fill="#6D4AA3" rx="3"/>
<text x="616.8" y="740.0" font-size="12.5" font-weight="800" fill="#16203F">TYPE IV</text>
<line x1="669.5999999999999" y1="764.0" x2="689.5999999999999" y2="784.0" stroke="#AEBBC0" stroke-width="2.4"/>
