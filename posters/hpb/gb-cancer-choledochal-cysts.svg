<ellipse cx="690" cy="810" rx="10" ry="19" fill="#ECE6F4" stroke="#6D4AA3" stroke-width="1.8"/>
<text x="616.8" y="872.0" font-size="10.5" font-weight="400" fill="#2E3C42">Intra + extrahepatic cysts</text>
<rect x="788.4" y="712.0" width="181.6" height="196" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="788.4" y="712.0" width="6" height="196" fill="#BE3A2E" rx="3"/>
<text x="806.4" y="740.0" font-size="12.5" font-weight="800" fill="#16203F">TYPE V</text>
<line x1="859.1999999999999" y1="764.0" x2="879.1999999999999" y2="784.0" stroke="#AEBBC0" stroke-width="2.4"/>
<line x1="899.1999999999999" y1="764.0" x2="879.1999999999999" y2="784.0" stroke="#AEBBC0" stroke-width="2.4"/>
