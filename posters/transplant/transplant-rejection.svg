<svg viewBox="0 0 1000 1356" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="1356" fill="#F4F6F4"/>
<rect x="0" y="0" width="1000" height="108" fill="#1E5140"/>
<rect x="0.0" y="108" width="250.0" height="4" fill="#C77B20"/>
<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Transplant Rejection</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#BFD9CE">Hyperacute · acute cellular · antibody-mediated · chronic — timeframes, pathophysiology &amp; treatment — FRCS Part 1</text>
<rect x="30" y="126" width="6" height="20" fill="#BE3A2E" rx="3"/>
<text x="46" y="142" font-size="13" font-weight="800" fill="#BE3A2E" letter-spacing="1.2">THE REJECTION SPECTRUM — BY ONSET</text>
<rect x="30.0" y="160" width="229.0" height="94" fill="#FBEAE6" rx="9" stroke="#BE3A2E" stroke-width="1.3"/>
<rect x="30.0" y="160" width="229.0" height="22" fill="#BE3A2E" rx="9"/>
<rect x="30.0" y="171" width="229.0" height="11" fill="#BE3A2E"/>
<text x="40.0" y="176" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">HYPERACUTE</text>
<text x="40.0" y="197" font-size="10.5" font-weight="700" fill="#BE3A2E">Minutes–hours</text>
<text x="40.0" y="212" font-size="10" font-weight="400" fill="#2E3C42">Preformed Ab / ABO → thrombosis; no</text>
<text x="40.0" y="225" font-size="10" font-weight="400" fill="#2E3C42">Rx, graft explant</text>
<rect x="267.0" y="160" width="229.0" height="94" fill="#F6ECDD" rx="9" stroke="#C77B20" stroke-width="1.3"/>
<rect x="267.0" y="160" width="229.0" height="22" fill="#C77B20" rx="9"/>
<rect x="267.0" y="171" width="229.0" height="11" fill="#C77B20"/>
<text x="277.0" y="176" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">ACUTE CELLULAR</text>
<text x="277.0" y="197" font-size="10.5" font-weight="700" fill="#C77B20">Days–months</text>
<text x="277.0" y="212" font-size="10" font-weight="400" fill="#2E3C42">T-cell, tubulitis; pulsed steroids ± rATG</text>
<rect x="504.0" y="160" width="229.0" height="94" fill="#ECE6F4" rx="9" stroke="#6D4AA3" stroke-width="1.3"/>
<rect x="504.0" y="160" width="229.0" height="22" fill="#6D4AA3" rx="9"/>
<rect x="504.0" y="171" width="229.0" height="11" fill="#6D4AA3"/>
<text x="514.0" y="176" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">ACUTE AMR</text>
<text x="514.0" y="197" font-size="10.5" font-weight="700" fill="#6D4AA3">Days–weeks</text>
<text x="514.0" y="212" font-size="10" font-weight="400" fill="#2E3C42">DSA + C4d; plasma exchange, IVIG,</text>
<text x="514.0" y="225" font-size="10" font-weight="400" fill="#2E3C42">rituximab</text>
<rect x="741.0" y="160" width="229.0" height="94" fill="#E1EAF1" rx="9" stroke="#245C8C" stroke-width="1.3"/>
<rect x="741.0" y="160" width="229.0" height="22" fill="#245C8C" rx="9"/>
<rect x="741.0" y="171" width="229.0" height="11" fill="#245C8C"/>
<text x="751.0" y="176" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">CHRONIC</text>
<text x="751.0" y="197" font-size="10.5" font-weight="700" fill="#245C8C">Months–years</text>
<text x="751.0" y="212" font-size="10" font-weight="400" fill="#2E3C42">IFTA + vasculopathy; largely irreversible</text>
<text x="30" y="268" font-size="11" font-weight="400" fill="#2E3C42">Accelerated rejection (~2–5 days) sits between hyperacute and acute — a memory/anamnestic response in a sensitised recipient. Rejection is one cause of graft</text>
<text x="30" y="283" font-size="11" font-weight="400" fill="#2E3C42">dysfunction; a biopsy graded by the Banff classification is the diagnostic gold standard.</text>
<rect x="30" y="300" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="316" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">MECHANISM · HISTOLOGY · TREATMENT</text>
<rect x="30" y="334" width="940" height="24" fill="#123027" rx="5"/>
<text x="42" y="350" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">TYPE</text>
<text x="150" y="350" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">MECHANISM</text>
<text x="395" y="350" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">HISTOLOGY (BANFF)</text>
<text x="635" y="350" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">TREATMENT</text>
<rect x="30" y="358" width="940" height="24" fill="#F1F4F2"/>
<rect x="30" y="358" width="4" height="24" fill="#BE3A2E"/>
<text x="42" y="374" font-size="11" font-weight="700" fill="#123027">Hyperacute</text>
<text x="150" y="374" font-size="11" font-weight="400" fill="#2E3C42">Preformed anti-HLA/ABO Ab + complement</text>
<text x="395" y="374" font-size="11" font-weight="400" fill="#2E3C42">Fibrinoid necrosis, fibrin thrombi</text>
<text x="635" y="374" font-size="11" font-weight="400" fill="#2E3C42">Explant — no effective treatment</text>
<rect x="30" y="382" width="4" height="24" fill="#C77B20"/>
<text x="42" y="398" font-size="11" font-weight="700" fill="#123027">Acute cellular</text>
<text x="150" y="398" font-size="11" font-weight="400" fill="#2E3C42">Recipient T cells vs donor HLA (IV)</text>
<text x="395" y="398" font-size="11" font-weight="400" fill="#2E3C42">Tubulitis, interstitial infiltrate</text>
<text x="635" y="398" font-size="11" font-weight="400" fill="#2E3C42">IV methylpred ×3–5 d; rATG if resistant</text>
<rect x="30" y="406" width="940" height="24" fill="#F1F4F2"/>
<rect x="30" y="406" width="4" height="24" fill="#6D4AA3"/>
<text x="42" y="422" font-size="11" font-weight="700" fill="#123027">Acute AMR</text>
<text x="150" y="422" font-size="11" font-weight="400" fill="#2E3C42">Donor-specific Ab + complement (type II)</text>
<text x="395" y="422" font-size="11" font-weight="400" fill="#2E3C42">Glomerulitis, PTC-itis, C4d+</text>
<text x="635" y="422" font-size="11" font-weight="400" fill="#2E3C42">Plasma exchange + IVIG + rituximab</text>
<rect x="30" y="430" width="4" height="24" fill="#245C8C"/>
<text x="42" y="446" font-size="11" font-weight="700" fill="#123027">Chronic</text>
<text x="150" y="446" font-size="11" font-weight="400" fill="#2E3C42">Chronic-active AMR (DSA) + non-immune</text>
<text x="395" y="446" font-size="11" font-weight="400" fill="#2E3C42">Tx glomerulopathy, IFTA, vasculopathy</text>
<text x="635" y="446" font-size="11" font-weight="400" fill="#2E3C42">Optimise IS; BP/proteinuria; CV risk</text>
<rect x="30" y="464" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="480" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">MATCHING · CROSSMATCH · DIAGNOSIS</text>
<rect x="30" y="498" width="460.0" height="225.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="498" width="6" height="225.5" fill="#245C8C" rx="3"/>
<text x="54" y="526" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">COMPATIBILITY</text>
<text x="54" y="550" font-size="18" font-weight="800" fill="#123027">Matching &amp; sensitisation</text>
<text x="54" y="572" font-size="12" font-weight="700" fill="#245C8C">HLA / MHC</text>
<text x="152" y="572.0" font-size="12" font-weight="400" fill="#2E3C42">Class I (A, B, C) on all nucleated cells; class II (DR,</text>
<text x="152" y="592.5" font-size="12" font-weight="400" fill="#2E3C42">DQ, DP) on APCs.</text>
<text x="54" y="613.0" font-size="12" font-weight="700" fill="#245C8C">Matching</text>
<text x="152" y="613.0" font-size="12" font-weight="400" fill="#2E3C42">Minimise mismatch across 6 antigens — importance</text>
<text x="152" y="633.5" font-size="12" font-weight="400" fill="#2E3C42">DR &gt; B &gt; A.</text>
<text x="54" y="654.0" font-size="12" font-weight="700" fill="#245C8C">Sensitisation</text>
<text x="152" y="654.0" font-size="12" font-weight="400" fill="#2E3C42">Prior transfusion / pregnancy / transplant → anti-HLA;</text>
<text x="152" y="674.5" font-size="12" font-weight="400" fill="#2E3C42">PRA / cRF quantifies.</text>
<text x="54" y="695.0" font-size="12" font-weight="700" fill="#245C8C">DSA</text>
<text x="152" y="695.0" font-size="12" font-weight="400" fill="#2E3C42">Donor-specific antibodies drive antibody-mediated</text>
<text x="152" y="715.5" font-size="12" font-weight="400" fill="#2E3C42">rejection (acute &amp; chronic).</text>
<rect x="510.0" y="498" width="460.0" height="225.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="510.0" y="498" width="6" height="225.5" fill="#15806A" rx="3"/>
<text x="534.0" y="526" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">TESTS</text>
<text x="534.0" y="550" font-size="18" font-weight="800" fill="#123027">Crossmatch &amp; diagnosis</text>
<text x="534.0" y="572" font-size="12" font-weight="700" fill="#15806A">CDC XM</text>
<text x="630.0" y="572.0" font-size="12" font-weight="400" fill="#2E3C42">Complement-dependent cytotoxicity; a positive T-cell</text>
<text x="630.0" y="592.5" font-size="12" font-weight="400" fill="#2E3C42">CDC contraindicates (hyperacute risk).</text>
<text x="534.0" y="613.0" font-size="12" font-weight="700" fill="#15806A">Flow / virtual</text>
<text x="630.0" y="613.0" font-size="12" font-weight="400" fill="#2E3C42">Flow cytometry is more sensitive; virtual XM matches</text>
<text x="630.0" y="633.5" font-size="12" font-weight="400" fill="#2E3C42">known DSA against donor HLA.</text>
<text x="534.0" y="654.0" font-size="12" font-weight="700" fill="#15806A">C4d</text>
<text x="630.0" y="654.0" font-size="12" font-weight="400" fill="#2E3C42">Peritubular-capillary C4d = complement footprint of</text>
<text x="630.0" y="674.5" font-size="12" font-weight="400" fill="#2E3C42">AMR.</text>
<text x="534.0" y="695.0" font-size="12" font-weight="700" fill="#15806A">Biopsy</text>
<text x="630.0" y="695.0" font-size="12" font-weight="400" fill="#2E3C42">Banff classification of the biopsy is the diagnostic</text>
<text x="630.0" y="715.5" font-size="12" font-weight="400" fill="#2E3C42">gold standard.</text>
<rect x="30" y="731.5" width="6" height="20" fill="#6D4AA3" rx="3"/>
<text x="46" y="747.5" font-size="13" font-weight="800" fill="#6D4AA3" letter-spacing="1.2">IMMUNOLOGY MAP</text>
<rect x="30" y="765.5" width="940" height="143.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="765.5" width="6" height="143.5" fill="#6D4AA3" rx="3"/>
<text x="54" y="793.5" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">MECHANISMS</text>
<text x="54" y="817.5" font-size="18" font-weight="800" fill="#123027">How the graft is attacked</text>
<text x="54" y="839.5" font-size="12" font-weight="700" fill="#6D4AA3">Hypersensitivity</text>
<text x="180" y="839.5" font-size="12" font-weight="400" fill="#2E3C42">Type II (antibody) = hyperacute + antibody-mediated rejection; Type IV (cell-mediated) = acute cellular rejection.</text>
<text x="54" y="860.0" font-size="12" font-weight="700" fill="#6D4AA3">Allorecognition</text>
<text x="180" y="860.0" font-size="12" font-weight="400" fill="#2E3C42">Direct (recipient T cells see intact donor HLA on donor APCs) · indirect (recipient APCs present processed donor peptide) ·</text>
<text x="180" y="880.5" font-size="12" font-weight="400" fill="#2E3C42">semidirect.</text>
<text x="54" y="901.0" font-size="12" font-weight="700" fill="#6D4AA3">Effectors</text>
<text x="180" y="901.0" font-size="12" font-weight="400" fill="#2E3C42">CD8 cytotoxic + CD4 helper T cells (cellular); donor-specific antibody + classical-pathway complement (humoral).</text>
<rect x="30" y="917.0" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="933.0" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="947.0" width="940" height="228.0" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="947.0" width="6" height="228.0" fill="#C77B20" rx="3"/>
<circle cx="60" cy="969.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="973.0" font-size="12" font-weight="600" fill="#123027">Hyperacute rejection is now rare because it is designed out by ABO matching and a pre-transplant crossmatch — a positive</text>
<text x="72" y="991.0" font-size="12" font-weight="400" fill="#2E3C42">T-cell CDC crossmatch is a contraindication to proceeding.</text>
<circle cx="60" cy="1009.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1013.0" font-size="12" font-weight="600" fill="#123027">A rising creatinine is not automatically rejection — exclude calcineurin-inhibitor toxicity, obstruction, dehydration, BK / CMV</text>
<text x="72" y="1031.0" font-size="12" font-weight="400" fill="#2E3C42">and recurrent disease; biopsy (Banff) before escalating immunosuppression.</text>
<circle cx="60" cy="1049.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1053.0" font-size="12" font-weight="600" fill="#123027">C4d in peritubular capillaries with a donor-specific antibody is the signature of antibody-mediated rejection — treat with</text>
<text x="72" y="1071.0" font-size="12" font-weight="400" fill="#2E3C42">plasma exchange, IVIG and rituximab, not just more steroids.</text>
<circle cx="60" cy="1089.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1093.0" font-size="12" font-weight="600" fill="#123027">Chronic rejection is largely irreversible at diagnosis, so prevention (good matching, adherence and prompt treatment of acute</text>
<text x="72" y="1111.0" font-size="12" font-weight="400" fill="#2E3C42">episodes) matters more than any single drug.</text>
<circle cx="60" cy="1129.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1133.0" font-size="12" font-weight="600" fill="#123027">Don't confuse rejection with graft-versus-host disease: in GVHD the donor's immune cells attack the recipient (after</text>
<text x="72" y="1151.0" font-size="12" font-weight="400" fill="#2E3C42">bone-marrow / intestinal / rarely liver grafts) — the opposite direction to rejection.</text>
<line x1="30" y1="1191.0" x2="970" y2="1191.0" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1210.0" font-size="10.5" font-weight="400" fill="#7C8A8E">Sources: Banff classification of allograft pathology; British Transplantation Society &amp; BSHI antibody-incompatible / crossmatch guidelines; NHSBT; StatPearls — Acute &amp; Chronic Renal</text>
<text x="30" y="1224.0" font-size="10.5" font-weight="400" fill="#7C8A8E">Transplant Rejection.</text>
<text x="30" y="1238.0" font-size="10.5" font-weight="400" fill="#7C8A8E">Drug doses illustrative and unit-specific: IV methylprednisolone 250–1000 mg/day ×3–5; rabbit ATG 1–1.5 mg/kg; rituximab 375 mg/m²; IVIG 100 mg/kg–2 g/kg; ± bortezomib /</text>
<text x="30" y="1252.0" font-size="10.5" font-weight="400" fill="#7C8A8E">eculizumab for resistant AMR.</text>
<text x="30" y="1266.0" font-size="10.5" font-weight="400" fill="#9AA6AA">FRCS Part 1 revision aid — verify against current primary sources before clinical use.</text>
<g id="mf-wordmark"><text x="822" y="42" font-size="21" font-weight="800" letter-spacing="0.2" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="822" y="60" font-size="10.5" font-weight="500" fill="#BFD9CE">mockfrcs.co.uk</text></g>
<rect x="0" y="1310" width="1000" height="46" fill="#1E5140"/><text x="30" y="1339" font-size="14" font-weight="800" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="970" y="1339" text-anchor="end" font-size="12.5" font-weight="600" fill="#BFD9CE">Revision resources &amp; realistic mock exams · mockfrcs.co.uk</text>
</svg>