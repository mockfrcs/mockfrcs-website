<svg viewBox="0 0 1000 1663.5" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="1663.5" fill="#F4F6F4"/>
<rect x="0" y="0" width="1000" height="108" fill="#1E5140"/>
<rect x="0.0" y="108" width="250.0" height="4" fill="#C77B20"/>
<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Death by Neurological Criteria &amp; the DCD Donor</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#BFD9CE">Brainstem-death testing (AoMRC) · cranial-nerve reflexes · apnoea test · Maastricht categories — FRCS Part 1</text>
<rect x="30" y="126" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="142" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">DIAGNOSING DEATH BY NEUROLOGICAL CRITERIA — THE PATHWAY</text>
<rect x="74" y="160" width="896" height="57" fill="#FFFFFF" rx="10" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="74" y="160" width="6" height="57" fill="#C77B20" rx="3"/>
<circle cx="52" cy="188.5" r="17" fill="#C77B20"/>
<text x="52" y="193.5" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="98" y="183" font-size="13" font-weight="800" fill="#123027">1 · Preconditions</text>
<text x="98" y="201" font-size="11" font-weight="400" fill="#2E3C42">Apnoeic coma on a ventilator, with irreversible brain damage of known aetiology.</text>
<line x1="52" y1="188.5" x2="52" y2="263.0" stroke="#D7DEDC" stroke-width="2.5"/>
<rect x="74" y="227" width="896" height="72" fill="#FFFFFF" rx="10" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="74" y="227" width="6" height="72" fill="#BE3A2E" rx="3"/>
<circle cx="52" cy="263.0" r="17" fill="#BE3A2E"/>
<text x="52" y="268.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="98" y="250" font-size="13" font-weight="800" fill="#123027">2 · Exclude reversible causes</text>
<text x="98" y="268" font-size="11" font-weight="400" fill="#2E3C42">Core temperature ≥34°C · no sedatives / opioids / neuromuscular blockers (confirm with train-of-four) · no severe metabolic, endocrine, electrolyte or</text>
<text x="98" y="283" font-size="11" font-weight="400" fill="#2E3C42">acid–base derangement · no circulatory cause.</text>
<line x1="52" y1="263.0" x2="52" y2="337.5" stroke="#D7DEDC" stroke-width="2.5"/>
<rect x="74" y="309" width="896" height="57" fill="#FFFFFF" rx="10" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="74" y="309" width="6" height="57" fill="#15806A" rx="3"/>
<circle cx="52" cy="337.5" r="17" fill="#15806A"/>
<text x="52" y="342.5" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="98" y="332" font-size="13" font-weight="800" fill="#123027">3 · Brainstem reflexes — all absent</text>
<text x="98" y="350" font-size="11" font-weight="400" fill="#2E3C42">Pupillary, corneal, oculovestibular (caloric), cranial-nerve motor to supraorbital pressure, gag and cough / tracheal reflexes (see table below).</text>
<line x1="52" y1="337.5" x2="52" y2="404.5" stroke="#D7DEDC" stroke-width="2.5"/>
<rect x="74" y="376" width="896" height="57" fill="#FFFFFF" rx="10" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="74" y="376" width="6" height="57" fill="#245C8C" rx="3"/>
<circle cx="52" cy="404.5" r="17" fill="#245C8C"/>
<text x="52" y="409.5" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="98" y="399" font-size="13" font-weight="800" fill="#123027">4 · Apnoea test (performed last)</text>
<text x="98" y="417" font-size="11" font-weight="400" fill="#2E3C42">No respiratory effort as PaCO₂ rises &gt;0.5 kPa to &gt;6.5 kPa (start ≥6.0 kPa, pH &lt;7.40); pre-oxygenated with O₂ insufflation.</text>
<line x1="52" y1="404.5" x2="52" y2="479.0" stroke="#D7DEDC" stroke-width="2.5"/>
<rect x="74" y="443" width="896" height="72" fill="#FFFFFF" rx="10" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="74" y="443" width="6" height="72" fill="#6D4AA3" rx="3"/>
<circle cx="52" cy="479.0" r="17" fill="#6D4AA3"/>
<text x="52" y="484.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="98" y="466" font-size="13" font-weight="800" fill="#123027">5 · Two sets · governance · time of death</text>
<text x="98" y="484" font-size="11" font-weight="400" fill="#2E3C42">Two doctors GMC-registered &gt;5 yrs (≥1 consultant), independent of the transplant team; two complete sets; legal time of death = completion of the</text>
<text x="98" y="499" font-size="11" font-weight="400" fill="#2E3C42">SECOND (final) set.</text>
<rect x="30" y="519" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="535" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">BRAINSTEM REFLEXES — AFFERENT / EFFERENT CRANIAL NERVES</text>
<rect x="30" y="553" width="940" height="24" fill="#123027" rx="5"/>
<text x="42" y="569" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">REFLEX</text>
<text x="232" y="569" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">AFFERENT</text>
<text x="342" y="569" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">EFFERENT</text>
<text x="458" y="569" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">METHOD / FINDING</text>
<rect x="30" y="577" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="577" width="4" height="23" fill="#245C8C"/>
<text x="42" y="593" font-size="11" font-weight="700" fill="#123027">Pupillary light</text>
<text x="232" y="593" font-size="11" font-weight="400" fill="#2E3C42">CN II</text>
<text x="342" y="593" font-size="11" font-weight="400" fill="#2E3C42">CN III</text>
<text x="458" y="593" font-size="11" font-weight="400" fill="#2E3C42">Fixed pupils, no response to bright light</text>
<rect x="30" y="600" width="4" height="23" fill="#245C8C"/>
<text x="42" y="616" font-size="11" font-weight="700" fill="#123027">Corneal</text>
<text x="232" y="616" font-size="11" font-weight="400" fill="#2E3C42">CN V</text>
<text x="342" y="616" font-size="11" font-weight="400" fill="#2E3C42">CN VII</text>
<text x="458" y="616" font-size="11" font-weight="400" fill="#2E3C42">No blink to corneal touch</text>
<rect x="30" y="623" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="623" width="4" height="23" fill="#245C8C"/>
<text x="42" y="639" font-size="11" font-weight="700" fill="#123027">Oculovestibular</text>
<text x="232" y="639" font-size="11" font-weight="400" fill="#2E3C42">CN VIII</text>
<text x="342" y="639" font-size="11" font-weight="400" fill="#2E3C42">CN III / VI</text>
<text x="458" y="639" font-size="11" font-weight="400" fill="#2E3C42">50 mL ice-cold water, clear TM — no eye movement</text>
<rect x="30" y="646" width="4" height="23" fill="#245C8C"/>
<text x="42" y="662" font-size="11" font-weight="700" fill="#123027">Motor (supraorbital)</text>
<text x="232" y="662" font-size="11" font-weight="400" fill="#2E3C42">CN V</text>
<text x="342" y="662" font-size="11" font-weight="400" fill="#2E3C42">CN VII</text>
<text x="458" y="662" font-size="11" font-weight="400" fill="#2E3C42">No facial response; no limb motor to central pain</text>
<rect x="30" y="669" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="669" width="4" height="23" fill="#245C8C"/>
<text x="42" y="685" font-size="11" font-weight="700" fill="#123027">Gag</text>
<text x="232" y="685" font-size="11" font-weight="400" fill="#2E3C42">CN IX</text>
<text x="342" y="685" font-size="11" font-weight="400" fill="#2E3C42">CN X</text>
<text x="458" y="685" font-size="11" font-weight="400" fill="#2E3C42">No gag to posterior pharyngeal stimulation</text>
<rect x="30" y="692" width="4" height="23" fill="#245C8C"/>
<text x="42" y="708" font-size="11" font-weight="700" fill="#123027">Cough / tracheal</text>
<text x="232" y="708" font-size="11" font-weight="400" fill="#2E3C42">CN X</text>
<text x="342" y="708" font-size="11" font-weight="400" fill="#2E3C42">CN X</text>
<text x="458" y="708" font-size="11" font-weight="400" fill="#2E3C42">No cough to a bronchial suction catheter</text>
<rect x="30" y="725" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="741" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">APNOEA TEST · WHO, WHEN &amp; TIME OF DEATH</text>
<rect x="30" y="759" width="460.0" height="225.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="759" width="6" height="225.5" fill="#245C8C" rx="3"/>
<text x="54" y="787" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">FINAL TEST</text>
<text x="54" y="811" font-size="18" font-weight="800" fill="#123027">Apnoea test</text>
<text x="54" y="833" font-size="12" font-weight="700" fill="#245C8C">Prepare</text>
<text x="114" y="833.0" font-size="12" font-weight="400" fill="#2E3C42">Pre-oxygenate 100% O₂; reach PaCO₂ ≥6.0 kPa &amp; pH &lt;7.40</text>
<text x="114" y="853.5" font-size="12" font-weight="400" fill="#2E3C42">before disconnection.</text>
<text x="54" y="874.0" font-size="12" font-weight="700" fill="#245C8C">Perform</text>
<text x="114" y="874.0" font-size="12" font-weight="400" fill="#2E3C42">Disconnect ventilator with O₂ insufflation (catheter / CPAP);</text>
<text x="114" y="894.5" font-size="12" font-weight="400" fill="#2E3C42">observe ~5 min.</text>
<text x="54" y="915.0" font-size="12" font-weight="700" fill="#245C8C">Positive</text>
<text x="114" y="915.0" font-size="12" font-weight="400" fill="#2E3C42">No spontaneous respiration despite PaCO₂ rising &gt;0.5 kPa</text>
<text x="114" y="935.5" font-size="12" font-weight="400" fill="#2E3C42">to &gt;6.5 kPa.</text>
<text x="54" y="956.0" font-size="12" font-weight="700" fill="#245C8C">Caution</text>
<text x="114" y="956.0" font-size="12" font-weight="400" fill="#2E3C42">Done last, after reflexes absent; abandon for hypoxia /</text>
<text x="114" y="976.5" font-size="12" font-weight="400" fill="#2E3C42">instability.</text>
<rect x="510.0" y="759" width="460.0" height="184.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="510.0" y="759" width="6" height="184.5" fill="#15806A" rx="3"/>
<text x="534.0" y="787" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">GOVERNANCE</text>
<text x="534.0" y="811" font-size="18" font-weight="800" fill="#123027">Who, when &amp; death</text>
<text x="534.0" y="833" font-size="12" font-weight="700" fill="#15806A">Doctors</text>
<text x="640.0" y="833.0" font-size="12" font-weight="400" fill="#2E3C42">Two, both GMC-registered &gt;5 yrs, competent; at</text>
<text x="640.0" y="853.5" font-size="12" font-weight="400" fill="#2E3C42">least one a consultant.</text>
<text x="534.0" y="874.0" font-size="12" font-weight="700" fill="#15806A">Independence</text>
<text x="640.0" y="874.0" font-size="12" font-weight="400" fill="#2E3C42">Neither doctor may belong to the transplant team.</text>
<text x="534.0" y="894.5" font-size="12" font-weight="700" fill="#15806A">Two sets</text>
<text x="640.0" y="894.5" font-size="12" font-weight="400" fill="#2E3C42">Two complete sets of tests (together or in turn).</text>
<text x="534.0" y="915.0" font-size="12" font-weight="700" fill="#15806A">Time of death</text>
<text x="640.0" y="915.0" font-size="12" font-weight="400" fill="#2E3C42">Confirmed and recorded at completion of the</text>
<text x="640.0" y="935.5" font-size="12" font-weight="400" fill="#2E3C42">SECOND (final) set of tests.</text>
<rect x="30" y="992.5" width="6" height="20" fill="#6D4AA3" rx="3"/>
<text x="46" y="1008.5" font-size="13" font-weight="800" fill="#6D4AA3" letter-spacing="1.2">MODIFIED MAASTRICHT CATEGORIES (2013) — DCD</text>
<rect x="30" y="1026.5" width="940" height="24" fill="#123027" rx="5"/>
<text x="42" y="1042.5" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">CAT.</text>
<text x="150" y="1042.5" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">DESCRIPTION</text>
<text x="780" y="1042.5" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">TYPE</text>
<rect x="30" y="1050.5" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="1050.5" width="4" height="23" fill="#BE3A2E"/>
<text x="42" y="1066.5" font-size="11" font-weight="700" fill="#123027">I</text>
<text x="150" y="1066.5" font-size="11" font-weight="400" fill="#2E3C42">Dead on arrival (brought in dead)</text>
<text x="780" y="1066.5" font-size="11" font-weight="400" fill="#2E3C42">Uncontrolled</text>
<rect x="30" y="1073.5" width="4" height="23" fill="#BE3A2E"/>
<text x="42" y="1089.5" font-size="11" font-weight="700" fill="#123027">II</text>
<text x="150" y="1089.5" font-size="11" font-weight="400" fill="#2E3C42">Unsuccessful resuscitation</text>
<text x="780" y="1089.5" font-size="11" font-weight="400" fill="#2E3C42">Uncontrolled</text>
<rect x="30" y="1096.5" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="1096.5" width="4" height="23" fill="#15806A"/>
<text x="42" y="1112.5" font-size="11" font-weight="700" fill="#123027">III</text>
<text x="150" y="1112.5" font-size="11" font-weight="400" fill="#2E3C42">Anticipated arrest after planned withdrawal of treatment</text>
<text x="780" y="1112.5" font-size="11" font-weight="400" fill="#2E3C42">Controlled — commonest UK</text>
<rect x="30" y="1119.5" width="4" height="23" fill="#15806A"/>
<text x="42" y="1135.5" font-size="11" font-weight="700" fill="#123027">IV</text>
<text x="150" y="1135.5" font-size="11" font-weight="400" fill="#2E3C42">Cardiac arrest after brainstem-death diagnosis</text>
<text x="780" y="1135.5" font-size="11" font-weight="400" fill="#2E3C42">Controlled*</text>
<rect x="30" y="1142.5" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="1142.5" width="4" height="23" fill="#BE3A2E"/>
<text x="42" y="1158.5" font-size="11" font-weight="700" fill="#123027">V</text>
<text x="150" y="1158.5" font-size="11" font-weight="400" fill="#2E3C42">Unexpected arrest in a critically-ill / ICU patient</text>
<text x="780" y="1158.5" font-size="11" font-weight="400" fill="#2E3C42">Uncontrolled</text>
<text x="30" y="1177.5" font-size="11" font-weight="400" fill="#2E3C42">DBD (donation after brainstem death) = heart-beating donor after DNC. DCD (donation after circulatory death) follows confirmed circulatory death: 5 minutes of</text>
<text x="30" y="1192.5" font-size="11" font-weight="400" fill="#2E3C42">continuous absent circulation ('no-touch'), then absent pupillary, corneal &amp; motor responses. Warm-ischaemia time is critical in DCD. *Category IV may be controlled or</text>
<text x="30" y="1207.5" font-size="11" font-weight="400" fill="#2E3C42">uncontrolled.</text>
<rect x="30" y="1224.5" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="1240.5" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="1254.5" width="940" height="228.0" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="1254.5" width="6" height="228.0" fill="#C77B20" rx="3"/>
<circle cx="60" cy="1276.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1280.5" font-size="12" font-weight="600" fill="#123027">Diagnosis needs a known, irreversible cause with all reversible confounders excluded first — normal core temperature, no</text>
<text x="72" y="1298.5" font-size="12" font-weight="400" fill="#2E3C42">sedation / paralysis, no gross metabolic or endocrine derangement — before any reflex is tested.</text>
<circle cx="60" cy="1316.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1320.5" font-size="12" font-weight="600" fill="#123027">Spinal reflexes and spontaneous movements (e.g. the Lazarus sign) can persist after brainstem death and do NOT invalidate it</text>
<text x="72" y="1338.5" font-size="12" font-weight="400" fill="#2E3C42">— they are mediated below the foramen magnum.</text>
<circle cx="60" cy="1356.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1360.5" font-size="12" font-weight="600" fill="#123027">The apnoea test is performed last, only once all six brainstem reflexes are absent, and is abandoned for hypoxia or</text>
<text x="72" y="1378.5" font-size="12" font-weight="400" fill="#2E3C42">cardiovascular instability.</text>
<circle cx="60" cy="1396.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1400.5" font-size="12" font-weight="600" fill="#123027">Two doctors (&gt;5 years' registration, one a consultant), neither on the transplant team, perform two full sets; the legal time of</text>
<text x="72" y="1418.5" font-size="12" font-weight="400" fill="#2E3C42">death is the completion of the SECOND (final) set (FICM/AoMRC).</text>
<circle cx="60" cy="1436.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1440.5" font-size="12" font-weight="600" fill="#123027">Most UK DCD is Maastricht category III (controlled, after planned withdrawal of life-sustaining treatment); circulatory death</text>
<text x="72" y="1458.5" font-size="12" font-weight="400" fill="#2E3C42">requires 5 minutes of continuous absent circulation before the 'no-touch' period ends.</text>
<line x1="30" y1="1498.5" x2="970" y2="1498.5" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1517.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Sources: Academy of Medical Royal Colleges — A Code of Practice for the Diagnosis and Confirmation of Death (2008; updated 2025); Faculty of Intensive Care Medicine &amp; NHSBT</text>
<text x="30" y="1531.5" font-size="10.5" font-weight="400" fill="#7C8A8E">guidance; modified Maastricht classification (2013).</text>
<text x="30" y="1545.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Note: 2008 apnoea-test thresholds shown (start PaCO₂ ≥6.0 kPa, pH &lt;7.40, rise &gt;0.5 to &gt;6.5 kPa); the 2025 Code revised the starting PaCO₂ — check local policy. Ancillary tests are not</text>
<text x="30" y="1559.5" font-size="10.5" font-weight="400" fill="#7C8A8E">routinely required in the UK.</text>
<text x="30" y="1573.5" font-size="10.5" font-weight="400" fill="#9AA6AA">FRCS Part 1 revision aid — verify against current primary sources before clinical use.</text>
<g id="mf-wordmark"><text x="822" y="42" font-size="21" font-weight="800" letter-spacing="0.2" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="822" y="60" font-size="10.5" font-weight="500" fill="#BFD9CE">mockfrcs.co.uk</text></g>
<rect x="0" y="1617.5" width="1000" height="46" fill="#1E5140"/><text x="30" y="1646.5" font-size="14" font-weight="800" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="970" y="1646.5" text-anchor="end" font-size="12.5" font-weight="600" fill="#BFD9CE">Revision resources &amp; realistic mock exams · mockfrcs.co.uk</text>
</svg>