<svg viewBox="0 0 1000 1539" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="1539" fill="#F4F6F4"/>
<rect x="0" y="0" width="1000" height="108" fill="#1E5140"/>
<rect x="0.0" y="108" width="250.0" height="4" fill="#C77B20"/>
<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Renal Transplantation — Complications &amp; Selection</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#BFD9CE">Graft complications by timeline · living-donor contraindications (BTS) · encapsulating peritoneal sclerosis — FRCS Part 1</text>
<rect x="30" y="126" width="6" height="20" fill="#BE3A2E" rx="3"/>
<text x="46" y="142" font-size="13" font-weight="800" fill="#BE3A2E" letter-spacing="1.2">GRAFT COMPLICATIONS — BY TIMELINE</text>
<path d="M 30.0 160.0 L 243.0 160.0 L 265.0 205.0 L 243.0 250.0 L 30.0 250.0 Z" fill="#FBEAE6" stroke="#BE3A2E" stroke-width="1.4"/>
<text x="46.0" y="186" font-size="11.5" font-weight="800" fill="#BE3A2E" letter-spacing="0.4">IMMEDIATE</text>
<text x="46.0" y="204" font-size="11" font-weight="400" fill="#2E3C42">Haemorrhage · renal artery / vein</text>
<text x="46.0" y="219" font-size="11" font-weight="400" fill="#2E3C42">thrombosis · hyperacute rejection</text>
<path d="M 265.0 160.0 L 478.0 160.0 L 500.0 205.0 L 478.0 250.0 L 265.0 250.0 L 287.0 205.0 Z" fill="#F6ECDD" stroke="#C77B20" stroke-width="1.4"/>
<text x="297.0" y="186" font-size="11.5" font-weight="800" fill="#C77B20" letter-spacing="0.4">EARLY  (days–wks)</text>
<text x="297.0" y="204" font-size="11" font-weight="400" fill="#2E3C42">DGF / ATN · urine leak · acute</text>
<text x="297.0" y="219" font-size="11" font-weight="400" fill="#2E3C42">cellular rejection · haematoma</text>
<path d="M 500.0 160.0 L 713.0 160.0 L 735.0 205.0 L 713.0 250.0 L 500.0 250.0 L 522.0 205.0 Z" fill="#E1EAF1" stroke="#245C8C" stroke-width="1.4"/>
<text x="532.0" y="186" font-size="11.5" font-weight="800" fill="#245C8C" letter-spacing="0.4">INTERMEDIATE (wks–mths)</text>
<text x="532.0" y="204" font-size="11" font-weight="400" fill="#2E3C42">Lymphocele · ureteric stricture ·</text>
<text x="532.0" y="219" font-size="11" font-weight="400" fill="#2E3C42">infection (CMV / BK)</text>
<path d="M 735.0 160.0 L 970.0 160.0 L 970.0 250.0 L 735.0 250.0 L 757.0 205.0 Z" fill="#E2F1EC" stroke="#15806A" stroke-width="1.4"/>
<text x="767.0" y="186" font-size="11.5" font-weight="800" fill="#15806A" letter-spacing="0.4">LATE  (mths–yrs)</text>
<text x="767.0" y="204" font-size="11" font-weight="400" fill="#2E3C42">Transplant renal a. stenosis ·</text>
<text x="767.0" y="219" font-size="11" font-weight="400" fill="#2E3C42">chronic rejection · recurrence ·</text>
<text x="767.0" y="234" font-size="11" font-weight="400" fill="#2E3C42">malignancy</text>
<rect x="30" y="268" width="940" height="24" fill="#123027" rx="5"/>
<text x="42" y="284" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">SYSTEM</text>
<text x="150" y="284" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">COMPLICATION</text>
<text x="410" y="284" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">TIMING / FEATURES</text>
<text x="650" y="284" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">MANAGEMENT</text>
<rect x="30" y="292" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="292" width="4" height="23" fill="#BE3A2E"/>
<text x="42" y="308" font-size="11" font-weight="700" fill="#123027">Vascular</text>
<text x="150" y="308" font-size="11" font-weight="400" fill="#2E3C42">Renal vein thrombosis</text>
<text x="410" y="308" font-size="11" font-weight="400" fill="#2E3C42">Early; tense tender graft, haematuria</text>
<text x="650" y="308" font-size="11" font-weight="400" fill="#2E3C42">Explore — usually graft loss</text>
<rect x="30" y="315" width="4" height="23" fill="#BE3A2E"/>
<text x="42" y="331" font-size="11" font-weight="700" fill="#123027">Vascular</text>
<text x="150" y="331" font-size="11" font-weight="400" fill="#2E3C42">Renal artery thrombosis</text>
<text x="410" y="331" font-size="11" font-weight="400" fill="#2E3C42">Early; sudden anuria</text>
<text x="650" y="331" font-size="11" font-weight="400" fill="#2E3C42">Urgent re-exploration</text>
<rect x="30" y="338" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="338" width="4" height="23" fill="#BE3A2E"/>
<text x="42" y="354" font-size="11" font-weight="700" fill="#123027">Vascular</text>
<text x="150" y="354" font-size="11" font-weight="400" fill="#2E3C42">Transplant renal a. stenosis</text>
<text x="410" y="354" font-size="11" font-weight="400" fill="#2E3C42">Late; refractory HTN, bruit, ↑Cr</text>
<text x="650" y="354" font-size="11" font-weight="400" fill="#2E3C42">Angioplasty ± stent</text>
<rect x="30" y="361" width="4" height="23" fill="#245C8C"/>
<text x="42" y="377" font-size="11" font-weight="700" fill="#123027">Urology</text>
<text x="150" y="377" font-size="11" font-weight="400" fill="#2E3C42">Urine leak</text>
<text x="410" y="377" font-size="11" font-weight="400" fill="#2E3C42">&lt;1 wk; ↓urine, ↑drain creatinine</text>
<text x="650" y="377" font-size="11" font-weight="400" fill="#2E3C42">Stent / drain; re-implant</text>
<rect x="30" y="384" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="384" width="4" height="23" fill="#245C8C"/>
<text x="42" y="400" font-size="11" font-weight="700" fill="#123027">Urology</text>
<text x="150" y="400" font-size="11" font-weight="400" fill="#2E3C42">Ureteric stricture</text>
<text x="410" y="400" font-size="11" font-weight="400" fill="#2E3C42">Late; hydronephrosis, ↑Cr</text>
<text x="650" y="400" font-size="11" font-weight="400" fill="#2E3C42">Nephrostomy → dilate / reimplant</text>
<rect x="30" y="407" width="4" height="23" fill="#C77B20"/>
<text x="42" y="423" font-size="11" font-weight="700" fill="#123027">Fluid</text>
<text x="150" y="423" font-size="11" font-weight="400" fill="#2E3C42">Lymphocele</text>
<text x="410" y="423" font-size="11" font-weight="400" fill="#2E3C42">Wks–mths; mass, ureter compression</text>
<text x="650" y="423" font-size="11" font-weight="400" fill="#2E3C42">Aspirate; lap fenestration</text>
<rect x="30" y="430" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="430" width="4" height="23" fill="#15806A"/>
<text x="42" y="446" font-size="11" font-weight="700" fill="#123027">Graft</text>
<text x="150" y="446" font-size="11" font-weight="400" fill="#2E3C42">DGF / ATN</text>
<text x="410" y="446" font-size="11" font-weight="400" fill="#2E3C42">Dialysis in the first week</text>
<text x="650" y="446" font-size="11" font-weight="400" fill="#2E3C42">Supportive; exclude rejection</text>
<rect x="30" y="453" width="4" height="23" fill="#15806A"/>
<text x="42" y="469" font-size="11" font-weight="700" fill="#123027">Graft</text>
<text x="150" y="469" font-size="11" font-weight="400" fill="#2E3C42">Acute rejection</text>
<text x="410" y="469" font-size="11" font-weight="400" fill="#2E3C42">Days–mths; ↑creatinine</text>
<text x="650" y="469" font-size="11" font-weight="400" fill="#2E3C42">Biopsy; pulsed steroids</text>
<rect x="30" y="486" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="502" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">LIVING-DONOR SELECTION — CONTRAINDICATIONS (BTS 2018)</text>
<rect x="30" y="520" width="460.0" height="246.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="520" width="6" height="246.0" fill="#BE3A2E" rx="3"/>
<text x="54" y="548" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">EXCLUDE</text>
<text x="54" y="572" font-size="16" font-weight="800" fill="#123027">Absolute</text>
<text x="54" y="594" font-size="12" font-weight="700" fill="#BE3A2E">Renal fn</text>
<text x="146" y="594.0" font-size="12" font-weight="400" fill="#2E3C42">Reduced GFR for age (predicted GFR at 80 below safe</text>
<text x="146" y="614.5" font-size="12" font-weight="400" fill="#2E3C42">threshold)</text>
<text x="54" y="635.0" font-size="12" font-weight="700" fill="#BE3A2E">Proteinuria</text>
<text x="146" y="635.0" font-size="12" font-weight="400" fill="#2E3C42">Significant proteinuria / albuminuria</text>
<text x="54" y="655.5" font-size="12" font-weight="700" fill="#BE3A2E">BP</text>
<text x="146" y="655.5" font-size="12" font-weight="400" fill="#2E3C42">Hypertension with end-organ damage</text>
<text x="54" y="676.0" font-size="12" font-weight="700" fill="#BE3A2E">Diabetes</text>
<text x="146" y="676.0" font-size="12" font-weight="400" fill="#2E3C42">Diabetes mellitus / significant glucose intolerance</text>
<text x="54" y="696.5" font-size="12" font-weight="700" fill="#BE3A2E">Stones</text>
<text x="146" y="696.5" font-size="12" font-weight="400" fill="#2E3C42">Recurrent nephrolithiasis</text>
<text x="54" y="717.0" font-size="12" font-weight="700" fill="#BE3A2E">Malignancy</text>
<text x="146" y="717.0" font-size="12" font-weight="400" fill="#2E3C42">Active or incompletely treated cancer</text>
<text x="54" y="737.5" font-size="12" font-weight="700" fill="#BE3A2E">Consent</text>
<text x="146" y="737.5" font-size="12" font-weight="400" fill="#2E3C42">Age &lt;18, incapacity or evidence of coercion</text>
<text x="54" y="758.0" font-size="12" font-weight="700" fill="#BE3A2E">Infection</text>
<text x="146" y="758.0" font-size="12" font-weight="400" fill="#2E3C42">Transmissible infection (e.g. untreated HIV, active TB)</text>
<rect x="510.0" y="520" width="460.0" height="246.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="510.0" y="520" width="6" height="246.0" fill="#C77B20" rx="3"/>
<text x="534.0" y="548" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">CAUTION</text>
<text x="534.0" y="572" font-size="16" font-weight="800" fill="#123027">Relative</text>
<text x="534.0" y="594" font-size="12" font-weight="700" fill="#C77B20">BMI</text>
<text x="626.0" y="594.0" font-size="12" font-weight="400" fill="#2E3C42">30–35 (discourage above 35)</text>
<text x="534.0" y="614.5" font-size="12" font-weight="700" fill="#C77B20">BP</text>
<text x="626.0" y="614.5" font-size="12" font-weight="400" fill="#2E3C42">Well-controlled on ≤2 agents, no end-organ damage</text>
<text x="534.0" y="635.0" font-size="12" font-weight="700" fill="#C77B20">Haematuria</text>
<text x="626.0" y="635.0" font-size="12" font-weight="400" fill="#2E3C42">Isolated non-visible — needs urological &amp; renal</text>
<text x="626.0" y="655.5" font-size="12" font-weight="400" fill="#2E3C42">workup</text>
<text x="534.0" y="676.0" font-size="12" font-weight="700" fill="#C77B20">Stones</text>
<text x="626.0" y="676.0" font-size="12" font-weight="400" fill="#2E3C42">Single small calculus with normal metabolic screen</text>
<text x="534.0" y="696.5" font-size="12" font-weight="700" fill="#C77B20">Immunology</text>
<text x="626.0" y="696.5" font-size="12" font-weight="400" fill="#2E3C42">ABO / HLA-incompatible → paired exchange or</text>
<text x="626.0" y="717.0" font-size="12" font-weight="400" fill="#2E3C42">desensitise</text>
<text x="534.0" y="737.5" font-size="12" font-weight="700" fill="#C77B20">Age</text>
<text x="626.0" y="737.5" font-size="12" font-weight="400" fill="#2E3C42">Younger age 18–21; older age has no absolute upper</text>
<text x="626.0" y="758.0" font-size="12" font-weight="400" fill="#2E3C42">limit</text>
<text x="30" y="780.0" font-size="11" font-weight="400" fill="#2E3C42">GFR: donation generally acceptable if predicted GFR at age 80 remains above ~37.5 ml/min/1.73m² (age-adjusted). Assess split renal function (isotope GFR ± DMSA); if</text>
<text x="30" y="795.0" font-size="11" font-weight="400" fill="#2E3C42">the sides differ, the donor keeps the better kidney.</text>
<rect x="30" y="812.0" width="6" height="20" fill="#6D4AA3" rx="3"/>
<text x="46" y="828.0" font-size="13" font-weight="800" fill="#6D4AA3" letter-spacing="1.2">ENCAPSULATING PERITONEAL SCLEROSIS (EPS)</text>
<rect x="30" y="846.0" width="940" height="246.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="846.0" width="6" height="246.0" fill="#6D4AA3" rx="3"/>
<text x="54" y="874.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">PD COMPLICATION</text>
<text x="54" y="898.0" font-size="18" font-weight="800" fill="#123027">The 'abdominal cocoon'</text>
<text x="54" y="920.0" font-size="12" font-weight="700" fill="#6D4AA3">Definition</text>
<text x="148" y="920.0" font-size="12" font-weight="400" fill="#2E3C42">Rare but serious complication of long-term peritoneal dialysis: a progressive fibrocollagenous membrane encases the small bowel</text>
<text x="148" y="940.5" font-size="12" font-weight="400" fill="#2E3C42">('abdominal cocoon').</text>
<text x="54" y="961.0" font-size="12" font-weight="700" fill="#6D4AA3">Risk</text>
<text x="148" y="961.0" font-size="12" font-weight="400" fill="#2E3C42">Cumulative PD duration (esp. &gt;5–8 yrs), recurrent or severe peritonitis, high glucose-load dialysate.</text>
<text x="54" y="981.5" font-size="12" font-weight="700" fill="#6D4AA3">Presentation</text>
<text x="148" y="981.5" font-size="12" font-weight="400" fill="#2E3C42">Recurrent small-bowel obstruction, weight loss / malnutrition, bloody or cloudy effluent, ascites, palpable abdominal mass.</text>
<text x="54" y="1002.0" font-size="12" font-weight="700" fill="#6D4AA3">Imaging</text>
<text x="148" y="1002.0" font-size="12" font-weight="400" fill="#2E3C42">CT: peritoneal thickening ± calcification, bowel-loop tethering ('cocoon'), loculated fluid, dilated obstructed loops.</text>
<text x="54" y="1022.5" font-size="12" font-weight="700" fill="#6D4AA3">Management</text>
<text x="148" y="1022.5" font-size="12" font-weight="400" fill="#2E3C42">Stop PD → switch to HD; nutrition / TPN; tamoxifen; corticosteroids ± immunosuppression; surgery = enterolysis / adhesiolysis in a</text>
<text x="148" y="1043.0" font-size="12" font-weight="400" fill="#2E3C42">specialist centre.</text>
<text x="54" y="1063.5" font-size="12" font-weight="700" fill="#6D4AA3">Exam pearl</text>
<text x="148" y="1063.5" font-size="12" font-weight="400" fill="#2E3C42">May be unmasked after transplantation or after stopping PD ('post-transplant EPS') — new SBO in an ex-PD patient is EPS until</text>
<text x="148" y="1084.0" font-size="12" font-weight="400" fill="#2E3C42">proven otherwise.</text>
<rect x="30" y="1100.0" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="1116.0" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="1130.0" width="940" height="228.0" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="1130.0" width="6" height="228.0" fill="#C77B20" rx="3"/>
<circle cx="60" cy="1152.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1156.0" font-size="12" font-weight="600" fill="#123027">Transplant renal artery stenosis is the commonest late vascular complication — suspect it with refractory hypertension, an</text>
<text x="72" y="1174.0" font-size="12" font-weight="400" fill="#2E3C42">unexplained rise in creatinine (especially after starting an ACEi/ARB) and a graft bruit.</text>
<circle cx="60" cy="1192.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1196.0" font-size="12" font-weight="600" fill="#123027">Renal vein thrombosis presents early with a tense, tender, swollen graft and haematuria and almost always ends in graft loss</text>
<text x="72" y="1214.0" font-size="12" font-weight="400" fill="#2E3C42">— it needs immediate exploration.</text>
<circle cx="60" cy="1232.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1236.0" font-size="12" font-weight="600" fill="#123027">A rising creatinine is non-specific: work through rejection, calcineurin-inhibitor toxicity, obstruction (stricture / lymphocele),</text>
<text x="72" y="1254.0" font-size="12" font-weight="400" fill="#2E3C42">vascular causes and infection (BK / CMV) — Doppler ± nephrostogram and biopsy before assuming rejection.</text>
<circle cx="60" cy="1272.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1276.0" font-size="12" font-weight="600" fill="#123027">Living donation is contraindicated by diabetes, hypertension with end-organ damage, significant proteinuria, recurrent stones</text>
<text x="72" y="1294.0" font-size="12" font-weight="400" fill="#2E3C42">or reduced GFR for age — the donor must retain sufficient lifelong renal reserve.</text>
<circle cx="60" cy="1312.0" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1316.0" font-size="12" font-weight="600" fill="#123027">New small-bowel obstruction in a patient with prolonged peritoneal-dialysis exposure is encapsulating peritoneal sclerosis</text>
<text x="72" y="1334.0" font-size="12" font-weight="400" fill="#2E3C42">until proven otherwise.</text>
<line x1="30" y1="1374.0" x2="970" y2="1374.0" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1393.0" font-size="10.5" font-weight="400" fill="#7C8A8E">Sources: BTS/RA Guidelines for Living Donor Kidney Transplantation (UK, 4th ed. 2018); NHSBT Organ Donation &amp; Transplantation; UK Kidney Association (Renal Association); NICE. EPS:</text>
<text x="30" y="1407.0" font-size="10.5" font-weight="400" fill="#7C8A8E">ISPD / UK Renal Association peritoneal-dialysis guidance.</text>
<text x="30" y="1421.0" font-size="10.5" font-weight="400" fill="#7C8A8E">Note: absolute vs relative donor thresholds are guideline- and centre-dependent; figures reflect UK BTS 2018 (e.g. BMI &gt;35, BP &gt;140/90 with end-organ damage, predicted GFR-at-80</text>
<text x="30" y="1435.0" font-size="10.5" font-weight="400" fill="#7C8A8E">concept).</text>
<text x="30" y="1449.0" font-size="10.5" font-weight="400" fill="#9AA6AA">FRCS Part 1 revision aid — verify against current primary sources before clinical use.</text>
<g id="mf-wordmark"><text x="822" y="42" font-size="21" font-weight="800" letter-spacing="0.2" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="822" y="60" font-size="10.5" font-weight="500" fill="#BFD9CE">mockfrcs.co.uk</text></g>
<rect x="0" y="1493" width="1000" height="46" fill="#1E5140"/><text x="30" y="1522" font-size="14" font-weight="800" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="970" y="1522" text-anchor="end" font-size="12.5" font-weight="600" fill="#BFD9CE">Revision resources &amp; realistic mock exams · mockfrcs.co.uk</text>
</svg>