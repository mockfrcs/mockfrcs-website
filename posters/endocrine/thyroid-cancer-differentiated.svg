<svg viewBox="0 0 1000 1678.5" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="1678.5" fill="#F4F6F4"/>
<rect x="0" y="0" width="1000" height="108" fill="#6E4A1C"/>
<rect x="0.0" y="108" width="250.0" height="4" fill="#C77B20"/>
<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Thyroid cancer (1 of 2) — differentiated</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#E4D3B0">FRCS Part 1 (General Surgery) · papillary / follicular / oncocytic · U &amp; Thy · AJCC 8th · surgery · RAI</text>
<rect x="30" y="126" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="142" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">SOLITARY NODULE — THE FRCS WORK-UP PATHWAY</text>
<path d="M 30.0 158.0 L 243.0 158.0 L 265.0 195.0 L 243.0 232.0 L 30.0 232.0 Z" fill="#E1EAF1" stroke="#245C8C" stroke-width="1.4"/>
<text x="46.0" y="184" font-size="11.5" font-weight="800" fill="#245C8C" letter-spacing="0.4">ULTRASOUND</text>
<text x="46.0" y="202" font-size="11" font-weight="400" fill="#2E3C42">Grade U1–U5 (BTA). U3–U5 → FNA</text>
<path d="M 265.0 158.0 L 478.0 158.0 L 500.0 195.0 L 478.0 232.0 L 265.0 232.0 L 287.0 195.0 Z" fill="#E1EAF1" stroke="#245C8C" stroke-width="1.4"/>
<text x="297.0" y="184" font-size="11.5" font-weight="800" fill="#245C8C" letter-spacing="0.4">FNA CYTOLOGY</text>
<text x="297.0" y="202" font-size="11" font-weight="400" fill="#2E3C42">Thy1–Thy5 (RCPath). Thy3–Thy5</text>
<text x="297.0" y="217" font-size="11" font-weight="400" fill="#2E3C42">→ surgery</text>
<path d="M 500.0 158.0 L 713.0 158.0 L 735.0 195.0 L 713.0 232.0 L 500.0 232.0 L 522.0 195.0 Z" fill="#E2F1EC" stroke="#15806A" stroke-width="1.4"/>
<text x="532.0" y="184" font-size="11.5" font-weight="800" fill="#15806A" letter-spacing="0.4">DIAGNOSTIC OP</text>
<text x="532.0" y="202" font-size="11" font-weight="400" fill="#2E3C42">Thy3f / Thy4 → diagnostic</text>
<text x="532.0" y="217" font-size="11" font-weight="400" fill="#2E3C42">hemithyroidectomy</text>
<path d="M 735.0 158.0 L 970.0 158.0 L 970.0 232.0 L 735.0 232.0 L 757.0 195.0 Z" fill="#E2F1EC" stroke="#15806A" stroke-width="1.4"/>
<text x="767.0" y="184" font-size="11.5" font-weight="800" fill="#15806A" letter-spacing="0.4">DEFINITIVE</text>
<text x="767.0" y="202" font-size="11" font-weight="400" fill="#2E3C42">Confirmed cancer → lobectomy or</text>
<text x="767.0" y="217" font-size="11" font-weight="400" fill="#2E3C42">total ± RAI</text>
<rect x="30" y="240" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="256" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">REPORTING — ULTRASOUND (U) &amp; CYTOLOGY (Thy)</text>
<rect x="30" y="272" width="455" height="24" fill="#2E1E0A" rx="5"/>
<text x="42" y="288" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">U</text>
<text x="96" y="288" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Ultrasound appearance</text>
<rect x="30" y="296" width="455" height="23" fill="#F1F4F2"/>
<rect x="30" y="296" width="4" height="23" fill="#15806A"/>
<text x="42" y="312" font-size="11" font-weight="700" fill="#2E1E0A">U1</text>
<text x="96" y="312" font-size="11" font-weight="400" fill="#2E3C42">Normal thyroid</text>
<rect x="30" y="319" width="4" height="23" fill="#15806A"/>
<text x="42" y="335" font-size="11" font-weight="700" fill="#2E1E0A">U2</text>
<text x="96" y="335" font-size="11" font-weight="400" fill="#2E3C42">Benign</text>
<rect x="30" y="342" width="455" height="23" fill="#F1F4F2"/>
<rect x="30" y="342" width="4" height="23" fill="#C77B20"/>
<text x="42" y="358" font-size="11" font-weight="700" fill="#2E1E0A">U3</text>
<text x="96" y="358" font-size="11" font-weight="400" fill="#2E3C42">Indeterminate / equivocal</text>
<rect x="30" y="365" width="4" height="23" fill="#BE3A2E"/>
<text x="42" y="381" font-size="11" font-weight="700" fill="#2E1E0A">U4</text>
<text x="96" y="381" font-size="11" font-weight="400" fill="#2E3C42">Suspicious</text>
<rect x="30" y="388" width="455" height="23" fill="#F1F4F2"/>
<rect x="30" y="388" width="4" height="23" fill="#BE3A2E"/>
<text x="42" y="404" font-size="11" font-weight="700" fill="#2E1E0A">U5</text>
<text x="96" y="404" font-size="11" font-weight="400" fill="#2E3C42">Malignant</text>
<rect x="515" y="272" width="455" height="24" fill="#2E1E0A" rx="5"/>
<text x="527" y="288" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Thy</text>
<text x="593" y="288" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Cytology — category &amp; action</text>
<rect x="515" y="296" width="455" height="23" fill="#F1F4F2"/>
<rect x="515" y="296" width="4" height="23" fill="#245C8C"/>
<text x="527" y="312" font-size="11" font-weight="700" fill="#2E1E0A">Thy1</text>
<text x="593" y="312" font-size="11" font-weight="400" fill="#2E3C42">Non-diagnostic → repeat</text>
<rect x="515" y="319" width="4" height="23" fill="#15806A"/>
<text x="527" y="335" font-size="11" font-weight="700" fill="#2E1E0A">Thy2</text>
<text x="593" y="335" font-size="11" font-weight="400" fill="#2E3C42">Benign</text>
<rect x="515" y="342" width="455" height="23" fill="#F1F4F2"/>
<rect x="515" y="342" width="4" height="23" fill="#C77B20"/>
<text x="527" y="358" font-size="11" font-weight="700" fill="#2E1E0A">Thy3</text>
<text x="593" y="358" font-size="11" font-weight="400" fill="#2E3C42">Atypia (Thy3a) / follicular (Thy3f)</text>
<rect x="515" y="365" width="4" height="23" fill="#BE3A2E"/>
<text x="527" y="381" font-size="11" font-weight="700" fill="#2E1E0A">Thy4</text>
<text x="593" y="381" font-size="11" font-weight="400" fill="#2E3C42">Suspicious of malignancy</text>
<rect x="515" y="388" width="455" height="23" fill="#F1F4F2"/>
<rect x="515" y="388" width="4" height="23" fill="#BE3A2E"/>
<text x="527" y="404" font-size="11" font-weight="700" fill="#2E1E0A">Thy5</text>
<text x="593" y="404" font-size="11" font-weight="400" fill="#2E3C42">Diagnostic of malignancy</text>
<rect x="30" y="419" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="435" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">HISTOLOGICAL TYPES — DIFFERENTIATED</text>
<rect x="30.0" y="451" width="302.6666666666667" height="253" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<path d="M 30.0 497 L 30.0 462 Q 30.0 451 41.0 451 L 321.6666666666667 451 Q 332.6666666666667 451 332.6666666666667 462 L 332.6666666666667 497 Z" fill="#245C8C"/>
<text x="44.0" y="472" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">PAPILLARY</text>
<text x="44.0" y="489" font-size="11.5" font-weight="600" fill="#FFFFFF">commonest · nodal</text>
<text x="44.0" y="515" font-size="11" font-weight="800" fill="#245C8C" letter-spacing="0.3">Frequency</text>
<text x="44.0" y="530" font-size="11" font-weight="400" fill="#2E3C42">~80–85% — commonest thyroid cancer</text>
<text x="44.0" y="554" font-size="11" font-weight="800" fill="#245C8C" letter-spacing="0.3">Spread</text>
<text x="44.0" y="569" font-size="11" font-weight="400" fill="#2E3C42">Lymphatic → cervical nodes; often multifocal /</text>
<text x="44.0" y="584" font-size="11" font-weight="400" fill="#2E3C42">bilateral</text>
<text x="44.0" y="608" font-size="11" font-weight="800" fill="#245C8C" letter-spacing="0.3">Cytology</text>
<text x="44.0" y="623" font-size="11" font-weight="400" fill="#2E3C42">Diagnostic on FNA — psammoma bodies,</text>
<text x="44.0" y="638" font-size="11" font-weight="400" fill="#2E3C42">Orphan-Annie nuclei, nuclear grooves</text>
<text x="44.0" y="662" font-size="11" font-weight="800" fill="#245C8C" letter-spacing="0.3">Behaviour</text>
<text x="44.0" y="677" font-size="11" font-weight="400" fill="#2E3C42">Excellent prognosis; iodine-avid</text>
<rect x="348.6666666666667" y="451" width="302.6666666666667" height="253" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<path d="M 348.6666666666667 497 L 348.6666666666667 462 Q 348.6666666666667 451 359.6666666666667 451 L 640.3333333333334 451 Q 651.3333333333334 451 651.3333333333334 462 L 651.3333333333334 497 Z" fill="#6D4AA3"/>
<text x="362.6666666666667" y="472" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">FOLLICULAR</text>
<text x="362.6666666666667" y="489" font-size="11.5" font-weight="600" fill="#FFFFFF">blood-borne · needs lobe</text>
<text x="362.6666666666667" y="515" font-size="11" font-weight="800" fill="#6D4AA3" letter-spacing="0.3">Frequency</text>
<text x="362.6666666666667" y="530" font-size="11" font-weight="400" fill="#2E3C42">~10% — second commonest</text>
<text x="362.6666666666667" y="554" font-size="11" font-weight="800" fill="#6D4AA3" letter-spacing="0.3">Spread</text>
<text x="362.6666666666667" y="569" font-size="11" font-weight="400" fill="#2E3C42">Haematogenous → lung, bone</text>
<text x="362.6666666666667" y="593" font-size="11" font-weight="800" fill="#6D4AA3" letter-spacing="0.3">Cytology</text>
<text x="362.6666666666667" y="608" font-size="11" font-weight="400" fill="#2E3C42">FNA cannot separate adenoma from carcinoma</text>
<text x="362.6666666666667" y="632" font-size="11" font-weight="800" fill="#6D4AA3" letter-spacing="0.3">Behaviour</text>
<text x="362.6666666666667" y="647" font-size="11" font-weight="400" fill="#2E3C42">Capsular / vascular invasion defines malignancy</text>
<text x="362.6666666666667" y="662" font-size="11" font-weight="400" fill="#2E3C42">— needs the whole lobe</text>
<rect x="667.3333333333334" y="451" width="302.6666666666667" height="253" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<path d="M 667.3333333333334 497 L 667.3333333333334 462 Q 667.3333333333334 451 678.3333333333334 451 L 959.0 451 Q 970.0 451 970.0 462 L 970.0 497 Z" fill="#C77B20"/>
<text x="681.3333333333334" y="472" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">ONCOCYTIC</text>
<text x="681.3333333333334" y="489" font-size="11.5" font-weight="600" fill="#FFFFFF">Hürthle · RAI-resistant</text>
<text x="681.3333333333334" y="515" font-size="11" font-weight="800" fill="#C77B20" letter-spacing="0.3">A.k.a.</text>
<text x="681.3333333333334" y="530" font-size="11" font-weight="400" fill="#2E3C42">Hürthle cell (oncocytic) carcinoma</text>
<text x="681.3333333333334" y="554" font-size="11" font-weight="800" fill="#C77B20" letter-spacing="0.3">Caution</text>
<text x="681.3333333333334" y="569" font-size="11" font-weight="400" fill="#2E3C42">More often RAI-refractory; FDG-PET avid; higher</text>
<text x="681.3333333333334" y="584" font-size="11" font-weight="400" fill="#2E3C42">nodal risk</text>
<text x="681.3333333333334" y="608" font-size="11" font-weight="800" fill="#C77B20" letter-spacing="0.3">Behaviour</text>
<text x="681.3333333333334" y="623" font-size="11" font-weight="400" fill="#2E3C42">Managed as high-risk differentiated cancer</text>
<rect x="30" y="712" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="728" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">AJCC 8th STAGING — MIND THE AGE CUT-OFF</text>
<rect x="30" y="744" width="940" height="123.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="744" width="6" height="123.0" fill="#C77B20" rx="3"/>
<text x="54" y="772" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">age is prognostic</text>
<text x="54" y="796" font-size="18" font-weight="800" fill="#2E1E0A">The age-55 rule (differentiated only)</text>
<text x="54" y="818" font-size="12" font-weight="700" fill="#C77B20">Under 55</text>
<text x="162" y="818.0" font-size="12" font-weight="400" fill="#2E3C42">Only two stages exist — Stage I if M0, Stage II if M1 — whatever the tumour size or nodal burden.</text>
<text x="54" y="838.5" font-size="12" font-weight="700" fill="#C77B20">55 and over</text>
<text x="162" y="838.5" font-size="12" font-weight="400" fill="#2E3C42">Conventional T/N/M: I–II (T1–T3 / nodes), III (T4a), IVA (T4b), IVB (M1).</text>
<text x="54" y="859.0" font-size="12" font-weight="700" fill="#C77B20">Why</text>
<text x="162" y="859.0" font-size="12" font-weight="400" fill="#2E3C42">Age is an independent prognostic factor unique to differentiated thyroid cancer; medullary &amp; anaplastic are staged differently.</text>
<rect x="30" y="875.0" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="891.0" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">SURGERY — EXTENT &amp; THE NECK</text>
<rect x="30" y="907.0" width="940" height="184.5" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="907.0" width="6" height="184.5" fill="#15806A" rx="3"/>
<text x="54" y="935.0" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">risk-adapted extent</text>
<text x="54" y="959.0" font-size="18" font-weight="800" fill="#2E1E0A">How much thyroid, and which nodes</text>
<text x="54" y="981.0" font-size="12" font-weight="700" fill="#15806A">Lobectomy</text>
<text x="204" y="981.0" font-size="12" font-weight="400" fill="#2E3C42">An option for low-risk unifocal tumours ≤4 cm with no extrathyroidal extension, no nodal / distant disease and no prior neck</text>
<text x="204" y="1001.5" font-size="12" font-weight="400" fill="#2E3C42">irradiation.</text>
<text x="54" y="1022.0" font-size="12" font-weight="700" fill="#15806A">Total thyroidectomy</text>
<text x="204" y="1022.0" font-size="12" font-weight="400" fill="#2E3C42">&gt;4 cm, extrathyroidal extension, nodal or distant disease, bilateral / multifocal, prior neck RT — and whenever RAI is</text>
<text x="204" y="1042.5" font-size="12" font-weight="400" fill="#2E3C42">planned.</text>
<text x="54" y="1063.0" font-size="12" font-weight="700" fill="#15806A">Central neck (VI)</text>
<text x="204" y="1063.0" font-size="12" font-weight="400" fill="#2E3C42">Therapeutic central-compartment dissection for involved nodes; prophylactic dissection is selective.</text>
<text x="54" y="1083.5" font-size="12" font-weight="700" fill="#15806A">Lateral neck</text>
<text x="204" y="1083.5" font-size="12" font-weight="400" fill="#2E3C42">Therapeutic (biopsy-proven nodes) — not prophylactic.</text>
<rect x="30" y="1099.5" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="1115.5" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">ADJUVANT THERAPY &amp; SURVEILLANCE</text>
<rect x="30" y="1131.5" width="940" height="164.0" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<rect x="30" y="1131.5" width="6" height="164.0" fill="#6D4AA3" rx="3"/>
<text x="54" y="1159.5" font-size="11" font-weight="700" fill="#6B7B80" letter-spacing="1.4">after the operation</text>
<text x="54" y="1183.5" font-size="18" font-weight="800" fill="#2E1E0A">Radioiodine, TSH, thyroglobulin &amp; beyond</text>
<text x="54" y="1205.5" font-size="12" font-weight="700" fill="#6D4AA3">Radioiodine</text>
<text x="184" y="1205.5" font-size="12" font-weight="400" fill="#2E3C42">Ablative / adjuvant RAI for higher-risk disease — requires total thyroidectomy and TSH stimulation (withdrawal or rhTSH).</text>
<text x="54" y="1226.0" font-size="12" font-weight="700" fill="#6D4AA3">TSH suppression</text>
<text x="184" y="1226.0" font-size="12" font-weight="400" fill="#2E3C42">Levothyroxine to suppress TSH (risk-adapted) — differentiated tumours are TSH-driven.</text>
<text x="54" y="1246.5" font-size="12" font-weight="700" fill="#6D4AA3">Thyroglobulin</text>
<text x="184" y="1246.5" font-size="12" font-weight="400" fill="#2E3C42">Tumour marker after total thyroidectomy + RAI; a rising Tg signals recurrence — always check anti-Tg antibodies alongside.</text>
<text x="54" y="1267.0" font-size="12" font-weight="700" fill="#6D4AA3">Dynamic risk</text>
<text x="184" y="1267.0" font-size="12" font-weight="400" fill="#2E3C42">ATA recurrence risk (low / intermediate / high) is re-scored over time as treatment response is seen.</text>
<text x="54" y="1287.5" font-size="12" font-weight="700" fill="#6D4AA3">RAI-refractory</text>
<text x="184" y="1287.5" font-size="12" font-weight="400" fill="#2E3C42">Progressive iodine-refractory disease → lenvatinib or sorafenib (multikinase inhibitors).</text>
<rect x="30" y="1305.5" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="1321.5" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="1335.5" width="940" height="174.0" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="1335.5" width="6" height="174.0" fill="#C77B20" rx="3"/>
<circle cx="60" cy="1357.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1361.5" font-size="12" font-weight="600" fill="#2E1E0A">Follicular carcinoma cannot be diagnosed on FNA — capsular / vascular invasion needs the whole lobe, so Thy3f goes for a</text>
<text x="72" y="1379.5" font-size="12" font-weight="400" fill="#2E3C42">diagnostic hemithyroidectomy.</text>
<circle cx="60" cy="1397.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1401.5" font-size="12" font-weight="600" fill="#2E1E0A">Under 55 with differentiated cancer you can only ever be Stage I or II — even lung metastases are Stage II, never III or IV.</text>
<circle cx="60" cy="1419.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1423.5" font-size="12" font-weight="600" fill="#2E1E0A">Papillary spreads to lymph nodes, follicular spreads by blood — nodes versus lung / bone.</text>
<circle cx="60" cy="1441.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1445.5" font-size="12" font-weight="600" fill="#2E1E0A">Thyroglobulin only works once the normal thyroid is gone (total thyroidectomy + RAI); anti-Tg antibodies can give false-low</text>
<text x="72" y="1463.5" font-size="12" font-weight="400" fill="#2E3C42">readings.</text>
<circle cx="60" cy="1481.5" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1485.5" font-size="12" font-weight="600" fill="#2E1E0A">Oncocytic (Hürthle cell) tumours are more often radioiodine-refractory — anticipate it and consider FDG-PET.</text>
<line x1="30" y1="1531.5" x2="970" y2="1531.5" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1550.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Sources: British Thyroid Association guidelines for the management of thyroid cancer in adults (Perros et al., 2014) · UK National Multidisciplinary Guidelines (2016) · Royal College of</text>
<text x="30" y="1564.5" font-size="10.5" font-weight="400" fill="#7C8A8E">Pathologists thyroid FNA (Thy) terminology &amp; dataset · AJCC/TNM 8th edition (2018) · NICE.</text>
<text x="30" y="1578.5" font-size="10.5" font-weight="400" fill="#7C8A8E">U = BTA/RCR ultrasound grading (U1–U5); Thy = RCPath cytology categories (Thy1–Thy5). Medullary &amp; anaplastic cancers are covered on sheet 2 of 2.</text>
