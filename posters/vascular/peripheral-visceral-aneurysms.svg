<svg viewBox="0 0 1000 1389" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="1389" fill="#F4F6F4"/>
<rect x="0" y="0" width="1000" height="108" fill="#3E464F"/>
<rect x="0.0" y="108" width="250.0" height="4" fill="#C77B20"/>
<rect x="250.0" y="108" width="250.0" height="4" fill="#245C8C"/>
<rect x="500.0" y="108" width="250.0" height="4" fill="#15806A"/>
<rect x="750.0" y="108" width="250.0" height="4" fill="#6D4AA3"/>
<text x="30" y="46" font-size="29" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">Peripheral &amp; Visceral Artery Aneurysms</text>
<text x="30" y="74" font-size="13" font-weight="500" fill="#CDD2D8">Common presentations · when to intervene · approach · SVS 2022 / ESVS 2024</text>
<rect x="30" y="146" width="940" height="44" fill="#E1EAF1" rx="9" stroke="#245C8C" stroke-width="1.1"/>
<rect x="30" y="146" width="6" height="44" fill="#245C8C" rx="3"/>
<text x="50" y="164.5" font-size="12" font-weight="800" fill="#245C8C">TRUE vs FALSE</text>
<text x="165" y="164.5" font-size="11.5" font-weight="400" fill="#2E3C42">True aneurysm = all three wall layers, focal dilatation ≥ 1.5× normal. False (pseudo) = contained rupture walled only by adventitia</text>
<text x="165" y="179.5" font-size="11.5" font-weight="400" fill="#2E3C42">/ surrounding tissue (post-puncture, trauma, infection, pancreatitis) — ruptures unpredictably.</text>
<rect x="30" y="202" width="940" height="44" fill="#F6ECDD" rx="9" stroke="#C77B20" stroke-width="1.1"/>
<rect x="30" y="202" width="6" height="44" fill="#C77B20" rx="3"/>
<text x="50" y="220.5" font-size="12" font-weight="800" fill="#C77B20">LIMB vs LIFE</text>
<text x="151" y="220.5" font-size="11.5" font-weight="400" fill="#2E3C42">Peripheral aneurysms (popliteal, femoral) threaten the LIMB via thrombosis / embolism — rupture is rare. Visceral and iliac</text>
<text x="151" y="235.5" font-size="11.5" font-weight="400" fill="#2E3C42">aneurysms threaten LIFE via rupture.</text>
<rect x="30" y="250" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="266" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">THE ANEURYSMS AT A GLANCE</text>
<rect x="30.0" y="280" width="304.0" height="268" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<path d="M 30.0 326 L 30.0 291 Q 30.0 280 41.0 280 L 323.0 280 Q 334.0 280 334.0 291 L 334.0 326 Z" fill="#15806A"/>
<text x="44.0" y="301" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">POP</text>
<text x="44.0" y="318" font-size="11.5" font-weight="600" fill="#FFFFFF">Popliteal</text>
<text x="44.0" y="344" font-size="11" font-weight="800" fill="#15806A" letter-spacing="0.3">Assoc</text>
<text x="44.0" y="359" font-size="11" font-weight="400" fill="#2E3C42">commonest peripheral; ~50% bilateral, ~50%</text>
<text x="44.0" y="374" font-size="11" font-weight="400" fill="#2E3C42">have an AAA</text>
<text x="44.0" y="398" font-size="11" font-weight="800" fill="#15806A" letter-spacing="0.3">Risk</text>
<text x="44.0" y="413" font-size="11" font-weight="400" fill="#2E3C42">thrombosis / embolism → acute limb ischaemia</text>
<text x="44.0" y="428" font-size="11" font-weight="400" fill="#2E3C42">(rupture rare)</text>
<text x="44.0" y="452" font-size="11" font-weight="800" fill="#15806A" letter-spacing="0.3">Treat</text>
<text x="44.0" y="467" font-size="11" font-weight="400" fill="#2E3C42">≥ 2 cm, or symptomatic / thrombus / poor run-off</text>
<text x="44.0" y="491" font-size="11" font-weight="800" fill="#15806A" letter-spacing="0.3">Repair</text>
<text x="44.0" y="506" font-size="11" font-weight="400" fill="#2E3C42">open exclusion + vein bypass (gold standard);</text>
<text x="44.0" y="521" font-size="11" font-weight="400" fill="#2E3C42">covered stent</text>
<rect x="348.0" y="280" width="304.0" height="268" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<path d="M 348.0 326 L 348.0 291 Q 348.0 280 359.0 280 L 641.0 280 Q 652.0 280 652.0 291 L 652.0 326 Z" fill="#245C8C"/>
<text x="362.0" y="301" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">CFA</text>
<text x="362.0" y="318" font-size="11.5" font-weight="600" fill="#FFFFFF">Femoral — true</text>
<text x="362.0" y="344" font-size="11" font-weight="800" fill="#245C8C" letter-spacing="0.3">Assoc</text>
<text x="362.0" y="359" font-size="11" font-weight="400" fill="#2E3C42">CFA ± bifurcation; often bilateral, assoc AAA /</text>
<text x="362.0" y="374" font-size="11" font-weight="400" fill="#2E3C42">iliac</text>
<text x="362.0" y="398" font-size="11" font-weight="800" fill="#245C8C" letter-spacing="0.3">Risk</text>
<text x="362.0" y="413" font-size="11" font-weight="400" fill="#2E3C42">thrombosis / embolism; rupture less common</text>
<text x="362.0" y="437" font-size="11" font-weight="800" fill="#245C8C" letter-spacing="0.3">Treat</text>
<text x="362.0" y="452" font-size="11" font-weight="400" fill="#2E3C42">≥ 2.5 cm or symptomatic</text>
<text x="362.0" y="476" font-size="11" font-weight="800" fill="#245C8C" letter-spacing="0.3">Repair</text>
<text x="362.0" y="491" font-size="11" font-weight="400" fill="#2E3C42">open interposition graft (endovascular rarely)</text>
<rect x="666.0" y="280" width="304.0" height="268" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<path d="M 666.0 326 L 666.0 291 Q 666.0 280 677.0 280 L 959.0 280 Q 970.0 280 970.0 291 L 970.0 326 Z" fill="#C77B20"/>
<text x="680.0" y="301" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">PSA</text>
<text x="680.0" y="318" font-size="11.5" font-weight="600" fill="#FFFFFF">Femoral — pseudo</text>
<text x="680.0" y="344" font-size="11" font-weight="800" fill="#C77B20" letter-spacing="0.3">Cause</text>
<text x="680.0" y="359" font-size="11" font-weight="400" fill="#2E3C42">commonest femoral lesion — post-puncture /</text>
<text x="680.0" y="374" font-size="11" font-weight="400" fill="#2E3C42">IVDU</text>
<text x="680.0" y="398" font-size="11" font-weight="800" fill="#C77B20" letter-spacing="0.3">Signs</text>
<text x="680.0" y="413" font-size="11" font-weight="400" fill="#2E3C42">pulsatile groin mass + bruit after arterial access</text>
<text x="680.0" y="437" font-size="11" font-weight="800" fill="#C77B20" letter-spacing="0.3">Treat</text>
<text x="680.0" y="452" font-size="11" font-weight="400" fill="#2E3C42">US-guided thrombin injection (post-catheter)</text>
<text x="680.0" y="476" font-size="11" font-weight="800" fill="#C77B20" letter-spacing="0.3">Surgery</text>
<text x="680.0" y="491" font-size="11" font-weight="400" fill="#2E3C42">if infected (IVDU), rapidly expanding or large</text>
<rect x="30.0" y="562" width="304.0" height="268" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<path d="M 30.0 608 L 30.0 573 Q 30.0 562 41.0 562 L 323.0 562 Q 334.0 562 334.0 573 L 334.0 608 Z" fill="#6D4AA3"/>
<text x="44.0" y="583" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">ILIAC</text>
<text x="44.0" y="600" font-size="11.5" font-weight="600" fill="#FFFFFF">Iliac</text>
<text x="44.0" y="626" font-size="11" font-weight="800" fill="#6D4AA3" letter-spacing="0.3">Assoc</text>
<text x="44.0" y="641" font-size="11" font-weight="400" fill="#2E3C42">usually with an AAA; isolated is rare (~2%)</text>
<text x="44.0" y="665" font-size="11" font-weight="800" fill="#6D4AA3" letter-spacing="0.3">Risk</text>
<text x="44.0" y="680" font-size="11" font-weight="400" fill="#2E3C42">rupture; pelvic / ureteric compression</text>
<text x="44.0" y="704" font-size="11" font-weight="800" fill="#6D4AA3" letter-spacing="0.3">Treat</text>
<text x="44.0" y="719" font-size="11" font-weight="400" fill="#2E3C42">common iliac ≥ 3.5 cm (internal iliac lower)</text>
<text x="44.0" y="743" font-size="11" font-weight="800" fill="#6D4AA3" letter-spacing="0.3">Repair</text>
<text x="44.0" y="758" font-size="11" font-weight="400" fill="#2E3C42">EVAR ± iliac branch device (preserve internal</text>
<text x="44.0" y="773" font-size="11" font-weight="400" fill="#2E3C42">iliac)</text>
<rect x="348.0" y="562" width="304.0" height="268" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<path d="M 348.0 608 L 348.0 573 Q 348.0 562 359.0 562 L 641.0 562 Q 652.0 562 652.0 573 L 652.0 608 Z" fill="#BE3A2E"/>
<text x="362.0" y="583" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">SAA</text>
<text x="362.0" y="600" font-size="11.5" font-weight="600" fill="#FFFFFF">Splenic</text>
<text x="362.0" y="626" font-size="11" font-weight="800" fill="#BE3A2E" letter-spacing="0.3">Assoc</text>
<text x="362.0" y="641" font-size="11" font-weight="400" fill="#2E3C42">commonest visceral (~60%); F:M 4:1; pregnancy /</text>
<text x="362.0" y="656" font-size="11" font-weight="400" fill="#2E3C42">portal HTN</text>
<text x="362.0" y="680" font-size="11" font-weight="800" fill="#BE3A2E" letter-spacing="0.3">Risk</text>
<text x="362.0" y="695" font-size="11" font-weight="400" fill="#2E3C42">rupture — high mortality, especially in pregnancy</text>
<text x="362.0" y="719" font-size="11" font-weight="800" fill="#BE3A2E" letter-spacing="0.3">Treat</text>
<text x="362.0" y="734" font-size="11" font-weight="400" fill="#2E3C42">&gt; 2 cm, symptomatic, childbearing / pregnant,</text>
<text x="362.0" y="749" font-size="11" font-weight="400" fill="#2E3C42">any pseudo</text>
<text x="362.0" y="773" font-size="11" font-weight="800" fill="#BE3A2E" letter-spacing="0.3">Repair</text>
<text x="362.0" y="788" font-size="11" font-weight="400" fill="#2E3C42">coil embolisation / covered stent; open if ruptured</text>
<rect x="666.0" y="562" width="304.0" height="268" fill="#FFFFFF" rx="11" stroke="#E0E6E3" stroke-width="1.2"/>
<path d="M 666.0 608 L 666.0 573 Q 666.0 562 677.0 562 L 959.0 562 Q 970.0 562 970.0 573 L 970.0 608 Z" fill="#15806A"/>
<text x="680.0" y="583" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">VISC</text>
<text x="680.0" y="600" font-size="11.5" font-weight="600" fill="#FFFFFF">Colic / visceral branch</text>
<text x="680.0" y="626" font-size="11" font-weight="800" fill="#15806A" letter-spacing="0.3">Which</text>
<text x="680.0" y="641" font-size="11" font-weight="400" fill="#2E3C42">pancreaticoduodenal, gastroduodenal, jejunal,</text>
<text x="680.0" y="656" font-size="11" font-weight="400" fill="#2E3C42">colic</text>
<text x="680.0" y="680" font-size="11" font-weight="800" fill="#15806A" letter-spacing="0.3">Assoc</text>
<text x="680.0" y="695" font-size="11" font-weight="400" fill="#2E3C42">coeliac stenosis / MALS; PAN gives multiple</text>
<text x="680.0" y="710" font-size="11" font-weight="400" fill="#2E3C42">microaneurysms</text>
<text x="680.0" y="734" font-size="11" font-weight="800" fill="#15806A" letter-spacing="0.3">Risk</text>
<text x="680.0" y="749" font-size="11" font-weight="400" fill="#2E3C42">rupture — NOT size-dependent</text>
<text x="680.0" y="773" font-size="11" font-weight="800" fill="#15806A" letter-spacing="0.3">Treat</text>
<text x="680.0" y="788" font-size="11" font-weight="400" fill="#2E3C42">embolise most regardless of size (esp. pseudo &amp;</text>
<text x="680.0" y="803" font-size="11" font-weight="400" fill="#2E3C42">PD / GD)</text>
<rect x="30" y="834" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="850" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">ASSOCIATIONS &amp; RED-FLAG CAUSES</text>
<rect x="30" y="864" width="940" height="44" fill="#E1EAF1" rx="9" stroke="#245C8C" stroke-width="1.1"/>
<rect x="30" y="864" width="6" height="44" fill="#245C8C" rx="3"/>
<text x="50" y="882.5" font-size="12" font-weight="800" fill="#245C8C">SCREEN</text>
<text x="119" y="882.5" font-size="11.5" font-weight="400" fill="#2E3C42">Any peripheral aneurysm → screen for an AAA and the contralateral side (co-existence is high). Image with duplex, then CT angiography</text>
<text x="119" y="897.5" font-size="11.5" font-weight="400" fill="#2E3C42">for planning.</text>
<rect x="30" y="918" width="940" height="44" fill="#F6ECDD" rx="9" stroke="#C77B20" stroke-width="1.1"/>
<rect x="30" y="918" width="6" height="44" fill="#C77B20" rx="3"/>
<text x="50" y="936.5" font-size="12" font-weight="800" fill="#C77B20">CAUSES</text>
<text x="119" y="936.5" font-size="11.5" font-weight="400" fill="#2E3C42">Multiple / young patient → connective tissue (Marfan, Ehlers-Danlos, Loeys-Dietz) or vasculitis (PAN — visceral microaneurysms). Saccular</text>
<text x="119" y="951.5" font-size="11.5" font-weight="400" fill="#2E3C42">+ painful + febrile → mycotic (Salmonella / Staph): resect + antibiotics + revascularise.</text>
<rect x="30" y="966" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="982" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="996" width="940" height="250" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="996" width="6" height="250" fill="#C77B20" rx="3"/>
<circle cx="60" cy="1018" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1022" font-size="12" font-weight="600" fill="#1B2026">Popliteal aneurysms threaten the LIMB (thrombosis / embolism), not usually life — rupture is rare; the danger is acute limb</text>
<text x="72" y="1040" font-size="12" font-weight="400" fill="#2E3C42">ischaemia.</text>
<circle cx="60" cy="1058" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1062" font-size="12" font-weight="600" fill="#1B2026">Always check the OTHER leg and the aorta: popliteal aneurysms are ~50% bilateral and ~50% coexist with an AAA.</text>
<circle cx="60" cy="1080" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1084" font-size="12" font-weight="600" fill="#1B2026">The commonest 'femoral aneurysm' is a false one — a post-catheterisation pseudoaneurysm; treat with thrombin injection, not</text>
<text x="72" y="1102" font-size="12" font-weight="400" fill="#2E3C42">open surgery, unless infected.</text>
<circle cx="60" cy="1120" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1124" font-size="12" font-weight="600" fill="#1B2026">Splenic aneurysm in a woman of childbearing age: treat even if &lt; 2 cm — size doesn't predict rupture in pregnancy and rupture</text>
<text x="72" y="1142" font-size="12" font-weight="400" fill="#2E3C42">mortality is very high.</text>
<circle cx="60" cy="1160" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1164" font-size="12" font-weight="600" fill="#1B2026">Pancreaticoduodenal / gastroduodenal aneurysms: treat regardless of size (rupture risk is not size-dependent) and look for</text>
<text x="72" y="1182" font-size="12" font-weight="400" fill="#2E3C42">coeliac-axis stenosis / MALS.</text>
<circle cx="60" cy="1200" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1204" font-size="12" font-weight="600" fill="#1B2026">Pseudoaneurysms (trauma, pancreatitis, iatrogenic) rupture unpredictably — don't apply true-aneurysm size thresholds to</text>
<text x="72" y="1222" font-size="12" font-weight="400" fill="#2E3C42">them.</text>
<line x1="30" y1="1246" x2="970" y2="1246" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1265" font-size="10.5" font-weight="400" fill="#7C8A8E">SVS 2022 popliteal artery aneurysm CPG; ESVS 2024 abdominal aorto-iliac aneurysm CPG; ESVS splanchnic / visceral aneurysm guidance.</text>
<text x="30" y="1279" font-size="10.5" font-weight="400" fill="#7C8A8E">True aneurysm = all three wall layers, ≥ 1.5× normal; false (pseudo) = contained rupture. Size thresholds are guides — symptoms / thrombus / pregnancy override size.</text>
<text x="30" y="1293" font-size="10.5" font-weight="400" fill="#9AA6AA">MockFRCS revision aid — verify against current ESVS / SVS guidance and local vascular network protocols.</text>
<g id="mf-wordmark"><text x="822" y="42" font-size="21" font-weight="800" letter-spacing="0.2" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="822" y="60" font-size="10.5" font-weight="500" fill="#CDD2D8">mockfrcs.co.uk</text></g>
<rect x="0" y="1343" width="1000" height="46" fill="#3E464F"/><text x="30" y="1372" font-size="14" font-weight="800" fill="#FFFFFF">Mock<tspan fill="#6FA8DC">FRCS</tspan></text><text x="970" y="1372" text-anchor="end" font-size="12.5" font-weight="600" fill="#CDD2D8">Revision resources &amp; realistic mock exams · mockfrcs.co.uk</text>
</svg>