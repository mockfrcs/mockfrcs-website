<text x="692" y="370" font-size="11" font-weight="400" fill="#2E3C42">Calf, ankle</text>
<rect x="402" y="380" width="568" height="26" fill="#F1F4F2"/>
<rect x="402" y="380" width="4" height="26" fill="#BE3A2E"/>
<text x="414" y="396" font-size="11" font-weight="700" fill="#1B2026">Infra-popliteal</text>
<text x="542" y="396" font-size="11" font-weight="400" fill="#2E3C42">AT / PT / peroneal</text>
<text x="692" y="396" font-size="11" font-weight="400" fill="#2E3C42">Foot; diabetic</text>
<rect x="402" y="420" width="568" height="204" fill="#ECE6F4" rx="9" stroke="#6D4AA3" stroke-width="1.1"/>
<rect x="402" y="420" width="6" height="204" fill="#6D4AA3" rx="3"/>
<text x="422" y="444" font-size="12" font-weight="800" fill="#6D4AA3">LERICHE SYNDROME (aorto-iliac)</text>
<text x="422" y="466" font-size="11.5" font-weight="400" fill="#2E3C42">Triad: buttock / thigh / hip claudication + erectile dysfunction + absent femoral pulses</text>
<text x="422" y="482" font-size="11.5" font-weight="400" fill="#2E3C42">(± distal wasting, pallor). Classically the younger male smoker with bilateral inflow</text>
<text x="422" y="498" font-size="11.5" font-weight="400" fill="#2E3C42">disease.</text>
<rect x="30" y="628" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="644" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">SEVERITY — FONTAINE ↔ RUTHERFORD</text>
<rect x="30" y="658" width="940" height="24" fill="#1B2026" rx="5"/>
<text x="42" y="674" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Fontaine</text>
<text x="150" y="674" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Clinical picture</text>
<text x="590" y="674" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Rutherford (0–6)</text>
<rect x="30" y="682" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="682" width="4" height="23" fill="#245C8C"/>
<text x="42" y="698" font-size="11" font-weight="700" fill="#1B2026">I</text>
<text x="150" y="698" font-size="11" font-weight="400" fill="#2E3C42">Asymptomatic</text>
<text x="590" y="698" font-size="11" font-weight="400" fill="#2E3C42">0 — asymptomatic</text>
<rect x="30" y="705" width="4" height="23" fill="#15806A"/>
<text x="42" y="721" font-size="11" font-weight="700" fill="#1B2026">IIa</text>
<text x="150" y="721" font-size="11" font-weight="400" fill="#2E3C42">Mild claudication (&gt;200 m)</text>
<text x="590" y="721" font-size="11" font-weight="400" fill="#2E3C42">1 — mild claudication</text>
<rect x="30" y="728" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="728" width="4" height="23" fill="#C77B20"/>
<text x="42" y="744" font-size="11" font-weight="700" fill="#1B2026">IIb</text>
<text x="150" y="744" font-size="11" font-weight="400" fill="#2E3C42">Mod–severe claudication (&lt;200 m)</text>
<text x="590" y="744" font-size="11" font-weight="400" fill="#2E3C42">2–3 — mod / severe</text>
<rect x="30" y="751" width="4" height="23" fill="#6D4AA3"/>
<text x="42" y="767" font-size="11" font-weight="700" fill="#1B2026">III</text>
<text x="150" y="767" font-size="11" font-weight="400" fill="#2E3C42">Ischaemic rest pain</text>
<text x="590" y="767" font-size="11" font-weight="400" fill="#2E3C42">4 — ischaemic rest pain</text>
<rect x="30" y="774" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="774" width="4" height="23" fill="#BE3A2E"/>
<text x="42" y="790" font-size="11" font-weight="700" fill="#1B2026">IV</text>
<text x="150" y="790" font-size="11" font-weight="400" fill="#2E3C42">Ulceration / gangrene</text>
<text x="590" y="790" font-size="11" font-weight="400" fill="#2E3C42">5–6 — minor / major tissue loss</text>
<rect x="30" y="801" width="6" height="20" fill="#245C8C" rx="3"/>
<text x="46" y="817" font-size="13" font-weight="800" fill="#245C8C" letter-spacing="1.2">DIFFERENTIAL OF CLAUDICATION</text>
<rect x="30" y="831" width="940" height="24" fill="#1B2026" rx="5"/>
<text x="42" y="847" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Type</text>
<text x="210" y="847" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Pain</text>
<text x="500" y="847" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Relieved by</text>
<text x="800" y="847" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Pulses</text>
<rect x="30" y="855" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="855" width="4" height="23" fill="#C77B20"/>
<text x="42" y="871" font-size="11" font-weight="700" fill="#1B2026">Arterial</text>
<text x="210" y="871" font-size="11" font-weight="400" fill="#2E3C42">Cramp; fixed claudication distance</text>
<text x="500" y="871" font-size="11" font-weight="400" fill="#2E3C42">Stopping (minutes)</text>
<text x="800" y="871" font-size="11" font-weight="400" fill="#2E3C42">↓ / absent</text>
<rect x="30" y="878" width="4" height="23" fill="#245C8C"/>
<text x="42" y="894" font-size="11" font-weight="700" fill="#1B2026">Neurogenic</text>
<text x="210" y="894" font-size="11" font-weight="400" fill="#2E3C42">Positional; spinal stenosis</text>
<text x="500" y="894" font-size="11" font-weight="400" fill="#2E3C42">Sitting, leaning forward</text>
<text x="800" y="894" font-size="11" font-weight="400" fill="#2E3C42">Normal</text>
<rect x="30" y="901" width="940" height="23" fill="#F1F4F2"/>
<rect x="30" y="901" width="4" height="23" fill="#15806A"/>
<text x="42" y="917" font-size="11" font-weight="700" fill="#1B2026">Venous</text>
<text x="210" y="917" font-size="11" font-weight="400" fill="#2E3C42">Bursting, whole-limb heaviness</text>
<text x="500" y="917" font-size="11" font-weight="400" fill="#2E3C42">Elevation</text>
<text x="800" y="917" font-size="11" font-weight="400" fill="#2E3C42">Present</text>
<rect x="30" y="924" width="4" height="23" fill="#6D4AA3"/>
<text x="42" y="940" font-size="11" font-weight="700" fill="#1B2026">MSK / joint</text>
<text x="210" y="940" font-size="11" font-weight="400" fill="#2E3C42">Localised to a joint</text>
<text x="500" y="940" font-size="11" font-weight="400" fill="#2E3C42">Rest, variable</text>
<text x="800" y="940" font-size="11" font-weight="400" fill="#2E3C42">Present</text>
<rect x="30" y="951" width="6" height="20" fill="#15806A" rx="3"/>
<text x="46" y="967" font-size="13" font-weight="800" fill="#15806A" letter-spacing="1.2">INVESTIGATION</text>
<rect x="30.0" y="981" width="164.0" height="62" fill="#E2F1EC" rx="10" stroke="#15806A" stroke-width="1.5"/>
<text x="112.0" y="1016.0" font-size="11.5" font-weight="700" fill="#15806A" text-anchor="middle">Pulses &amp; Buerger's</text>
<line x1="198.0" y1="1012.0" x2="211.0" y2="1012.0" stroke="#6B7B80" stroke-width="2.6"/>
<path d="M 220.0 1012.0 L 211.0 1016.7 L 211.0 1007.3 Z" fill="#6B7B80"/>
<rect x="224.0" y="981" width="164.0" height="62" fill="#E2F1EC" rx="10" stroke="#15806A" stroke-width="1.5"/>
<text x="306.0" y="1016.0" font-size="11.5" font-weight="700" fill="#15806A" text-anchor="middle">ABPI ± toe pressure</text>
<line x1="392.0" y1="1012.0" x2="405.0" y2="1012.0" stroke="#6B7B80" stroke-width="2.6"/>
<path d="M 414.0 1012.0 L 405.0 1016.7 L 405.0 1007.3 Z" fill="#6B7B80"/>
<rect x="418.0" y="981" width="164.0" height="62" fill="#E2F1EC" rx="10" stroke="#15806A" stroke-width="1.5"/>
<text x="500.0" y="1016.0" font-size="11.5" font-weight="700" fill="#15806A" text-anchor="middle">Duplex (1st-line)</text>
<line x1="586.0" y1="1012.0" x2="599.0" y2="1012.0" stroke="#6B7B80" stroke-width="2.6"/>
<path d="M 608.0 1012.0 L 599.0 1016.7 L 599.0 1007.3 Z" fill="#6B7B80"/>
<rect x="612.0" y="981" width="164.0" height="62" fill="#E2F1EC" rx="10" stroke="#15806A" stroke-width="1.5"/>
<text x="694.0" y="1016.0" font-size="11.5" font-weight="700" fill="#15806A" text-anchor="middle">CTA / MRA</text>
<line x1="780.0" y1="1012.0" x2="793.0" y2="1012.0" stroke="#6B7B80" stroke-width="2.6"/>
<path d="M 802.0 1012.0 L 793.0 1016.7 L 793.0 1007.3 Z" fill="#6B7B80"/>
<rect x="806.0" y="981" width="164.0" height="62" fill="#E2F1EC" rx="10" stroke="#15806A" stroke-width="1.5"/>
<text x="888.0" y="1016.0" font-size="11.5" font-weight="700" fill="#15806A" text-anchor="middle">DSA (if intervening)</text>
<rect x="30" y="1055" width="940" height="30" fill="#E1EAF1" rx="9" stroke="#245C8C" stroke-width="1.1"/>
<rect x="30" y="1055" width="6" height="30" fill="#245C8C" rx="3"/>
<text x="50" y="1074.0" font-size="12" font-weight="800" fill="#245C8C">ABPI</text>
<text x="98" y="1074.0" font-size="11.5" font-weight="400" fill="#2E3C42">&gt;1.3 incompressible (diabetes / CKD) → use toe pressures · 0.90–1.20 normal · 0.50–0.90 claudication · &lt;0.50 severe / rest pain</text>
<rect x="30" y="1089" width="6" height="20" fill="#C77B20" rx="3"/>
<text x="46" y="1105" font-size="13" font-weight="800" fill="#C77B20" letter-spacing="1.2">RED FLAGS &amp; EXAM PITFALLS</text>
<rect x="30" y="1119" width="940" height="138" fill="#F6ECDD" rx="11" stroke="#EAD7B8" stroke-width="1.2"/>
<rect x="30" y="1119" width="6" height="138" fill="#C77B20" rx="3"/>
<circle cx="60" cy="1141" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1145" font-size="12" font-weight="600" fill="#1B2026">Falsely HIGH ABPI (&gt;1.3) from incompressible calcified vessels in diabetes / CKD — always check toe pressures / TBI.</text>
<circle cx="60" cy="1163" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1167" font-size="12" font-weight="600" fill="#1B2026">PAD is systemic atherosclerosis: cardiovascular events, not the leg, are the leading cause of death — treat CV risk hard.</text>
<circle cx="60" cy="1185" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1189" font-size="12" font-weight="600" fill="#1B2026">Ischaemic rest pain is worse lying flat and eased by hanging the leg out of bed — distinguish from nocturnal cramps.</text>
<circle cx="60" cy="1207" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1211" font-size="12" font-weight="600" fill="#1B2026">CLTI (rest pain / tissue loss) needs urgent vascular referral — see sheet 2.</text>
<circle cx="60" cy="1229" r="2.6" fill="#BE3A2E"/>
<text x="72" y="1233" font-size="12" font-weight="600" fill="#1B2026">Leriche in a young male smoker: don't overlook erectile dysfunction + absent femoral pulses.</text>
<line x1="30" y1="1257" x2="970" y2="1257" stroke="#D7DEDC" stroke-width="1"/>
<text x="30" y="1276" font-size="10.5" font-weight="400" fill="#7C8A8E">NICE CG147 Lower limb peripheral arterial disease: diagnosis and management; NICE QS52. ESVS clinical practice guidelines on asymptomatic lower-limb PAD &amp; intermittent</text>
<text x="30" y="1290" font-size="10.5" font-weight="400" fill="#7C8A8E">claudication.</text>
<text x="30" y="1304" font-size="10.5" font-weight="400" fill="#7C8A8E">Fontaine and Rutherford severity classifications. TASC II (Norgren et al., 2007) — anatomic lesion staging (see sheet 2).</text>
<text x="30" y="1318" font-size="10.5" font-weight="400" fill="#9AA6AA">MockFRCS revision aid — verify against current NICE / ESVS guidance and local vascular network protocols.</text>
