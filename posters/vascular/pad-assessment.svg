<text x="692" y="318" font-size="11" font-weight="400" fill="#2E3C42">Thigh</text>
<rect x="402" y="328" width="568" height="26" fill="#F1F4F2"/>
<rect x="402" y="328" width="4" height="26" fill="#C77B20"/>
<text x="414" y="344" font-size="11" font-weight="700" fill="#1B2026">Fem-popliteal</text>
<text x="542" y="344" font-size="11" font-weight="400" fill="#2E3C42">SFA — Hunter's canal</text>
<text x="692" y="344" font-size="11" font-weight="400" fill="#2E3C42">Calf (commonest)</text>
<rect x="402" y="354" width="4" height="26" fill="#C77B20"/>
<text x="414" y="370" font-size="11" font-weight="700" fill="#1B2026">Popliteal</text>
