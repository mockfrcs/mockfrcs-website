<text x="692" y="268" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">Claudication / clue</text>
<rect x="402" y="276" width="568" height="26" fill="#F1F4F2"/>
<rect x="402" y="276" width="4" height="26" fill="#245C8C"/>
<text x="414" y="292" font-size="11" font-weight="700" fill="#1B2026">Aorto-iliac</text>
<text x="542" y="292" font-size="11" font-weight="400" fill="#2E3C42">Aorta, iliacs</text>
<text x="692" y="292" font-size="11" font-weight="400" fill="#2E3C42">Buttock, hip, thigh</text>
<rect x="402" y="302" width="4" height="26" fill="#C77B20"/>
