<text x="152" y="506" font-size="11" font-weight="700" fill="#C77B20">Popliteal</text>
<text x="152" y="554" font-size="11" font-weight="700" fill="#BE3A2E">Tibioperoneal trunk</text>
<text x="152" y="586" font-size="10.5" font-weight="700" fill="#BE3A2E">AT · PT · Peroneal</text>
